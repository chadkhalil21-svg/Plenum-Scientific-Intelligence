<title id="title">USGS Miami-Dade bounded well catalogue metadata</title><desc id="desc">Bars represent the proportion of catalogue fields actually supplied, not well functionality.</desc><rect width="680" height="436" rx="12" fill="#f8fafc"/><g font-family="sans-serif" font-size="14" fill="#172554"><text x="25" y="35" font-size="19" font-weight="bold">USGS groundwater metadata | Miami-Dade</text><text x="25" y="65">Official OGC monitoring-locations → schema + scope validator → 215 records</text><text x="25" y="94" font-weight="bold">Metadata available / total catalogue records</text><text x="25" y="141">construction date</text><rect x="250" y="126" width="250" height="19" rx="3" fill="#e2e8f0"/><rect x="250" y="126" width="116.28" height="19" rx="3" fill="#0e7490"/><text x="515" y="141">100/215</text><text x="25" y="172">well constructed depth</text><rect x="250" y="157" width="250" height="19" rx="3" fill="#e2e8f0"/><rect x="250" y="157" width="203.49" height="19" rx="3" fill="#0e7490"/><text x="515" y="172">175/215</text><text x="25" y="203">hole constructed depth</text><rect x="250" y="188" width="250" height="19" rx="3" fill="#e2e8f0"/><rect x="250" y="188" width="32.56" height="19" rx="3" fill="#0e7490"/><text x="515" y="203">28/215</text><text x="25" y="234">aquifer code</text><rect x="250" y="219" width="250" height="19" rx="3" fill="#e2e8f0"/><rect x="250" y="219" width="141.86" height="19" rx="3" fill="#0e7490"/><text x="515" y="234">122/215</text><text x="25" y="265">national aquifer code</text><rect x="250" y="250" width="250" height="19" rx="3" fill="#e2e8f0"/><rect x="250" y="250" width="141.86" height="19" rx="3" fill="#0e7490"/><text x="515" y="265">122/215</text><text x="25" y="296">aquifer type code</text><rect x="250" y="281" width="250" height="19" rx="3" fill="#e2e8f0"/><rect x="250" y="281" width="83.72" height="19" rx="3" fill="#0e7490"/><text x="515" y="296">72/215</text><text x="25" y="327">altitude</text><rect x="250" y="312" width="250" height="19" rx="3" fill="#e2e8f0"/><rect x="250" y="312" width="203.49" height="19" rx="3" fill="#0e7490"/><text x="515" y="327">175/215</text><text x="25" y="358">vertical datum</text><rect x="250" y="343" width="250" height="19" rx="3" fill="#e2e8f0"/><rect x="250" y="343" width="203.49" height="19" rx="3" fill="#0e7490"/><text x="515" y="358">175/215</text><text x="25" y="401">Filled = supplied; grey = missing. No groundwater observations downloaded.</text></g></svg>

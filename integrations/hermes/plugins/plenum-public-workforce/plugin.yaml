name: plenum-public-workforce
version: "1.0.0"
description: Founder-only public GitHub assignment bridge for existing Plenum specialist workers
author: Plenum Industries, Inc.
kind: standalone
provides_tools:
  - plenum_assign_public_task
  - plenum_read_public_task_status
requires_env:
  - name: PLENUM_GITHUB_PUBLIC_ISSUES_TOKEN
    description: Owner-scoped GitHub token restricted to public Plenum repository Issues
    prompt: GitHub public Issues token
    password: true

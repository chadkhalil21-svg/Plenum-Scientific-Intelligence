<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Original motion qualification</title>
<style>
html,body{margin:0;width:640px;height:360px;overflow:hidden}
#stage{position:relative;width:640px;height:360px;background:#101827;overflow:hidden;color:white;font:24px sans-serif}
#rail{position:absolute;left:60px;top:175px;width:520px;height:4px;background:#44617f}
#dot{position:absolute;left:70px;top:146px;width:64px;height:64px;border-radius:50%;background:#61d7c8}
#heading{position:absolute;left:60px;top:40px}
</style></head>
<body><div id="stage" data-composition-id="motion" data-start="0" data-duration="2" data-width="640" data-height="360">
<div id="rail" class="clip" data-start="0" data-duration="2" data-track-index="0"></div>
<div id="dot" class="clip" data-start="0" data-duration="2" data-track-index="1"></div>
<div id="heading" class="clip" data-start="0" data-duration="2" data-track-index="2">Original concept motion</div>
</div><script src="./gsap.min.js"></script><script>
const tl=gsap.timeline({paused:true});tl.to("#dot",{x:430,duration:2,ease:"none"},0);
window.__timelines=window.__timelines||{};window.__timelines.motion=tl;
</script></body></html>

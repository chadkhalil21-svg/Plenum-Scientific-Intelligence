# On-demand personal Codespaces development setup. Not a production deployment.
# Start manually with: bash integrations/n8n/start-codespace-workforce.sh
# GitHub Codespaces 5678 port MUST remain Private (never Public).
services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?Create locally using start script}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=true
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=America/New_York
    volumes:
      - n8n_local_data:/home/node/.n8n
    networks: [private_ai]
    depends_on: [ollama]
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      - OLLAMA_CONTEXT_LENGTH=8192
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ollama_local_models:/root/.ollama
    networks: [private_ai]
    # NO published model port, so the inference endpoint remains inaccessible
    # to anyone not inside this Docker network.
networks:
  private_ai:
    driver: bridge
volumes:
  n8n_local_data:
  ollama_local_models:

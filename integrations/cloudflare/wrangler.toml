name = "plenum-public-wake"
main = "plenum-github-wake-worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = true
# Uses a Free-plan SQLite Durable Object for atomic replay rejection only.
# No paid Workers AI model, R2 bucket, resident agent or overage.
# This is NOT a server for Hermes, Paperclip or private WhatsApp sessions.
# Set PLENUM_WEBHOOK_HMAC_SECRET and PLENUM_GITHUB_DISPATCH_TOKEN
# using Cloudflare secrets on the owner's account, never in git.

# Replay protection is mandatory: missing binding makes /wake return 503.
[[durable_objects.bindings]]
name = "PLENUM_REPLAY_GUARD"
class_name = "PublicWakeReplayGuard"

[exports.PublicWakeReplayGuard]
type = "durable-object"
storage = "sqlite"


# Separate owner-private continuity records. NOT enabled without the distinct
# PLENUM_PRIVATE_MEMORY_HMAC_SECRET, configured privately in Cloudflare.
# No new host, third-party provider or paid inference account.
[[durable_objects.bindings]]
name = "PLENUM_PRIVATE_MEMORY"
class_name = "PrivateContinuityMemory"

[exports.PrivateContinuityMemory]
type = "durable-object"
storage = "sqlite"

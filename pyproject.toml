[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plenum-scientific-intelligence"
version = "0.1.0"
description = "Bounded and evidence-based AI research foundation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
plenum = "plenum_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plenum-scientific-intelligence"
version = "0.1.0"
description = "Bounded and evidence-based AI research foundation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
science = ["numpy>=1.26,<3", "scipy>=1.12,<2", "rdkit>=2025.9,<2027"]
ml = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2"]
empirical = ["numpy>=1.26,<3"]
orchestration = ["langgraph==1.2.20", "openmdao==3.45.2"]
astronomy = ["astropy>=7.0,<8"]
battery = ["pybamm==26.10.1.1"]

[project.scripts]
plenum = "plenum_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

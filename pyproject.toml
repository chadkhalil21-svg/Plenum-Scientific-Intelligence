[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plenum-scientific-intelligence"
version = "0.1.0"
description = "Bounded and evidence-based AI research foundation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
science = ["numpy>=1.26,<3", "scipy>=1.12,<2", "rdkit>=2025.9,<2027"]
numerical = ["numpy>=1.26,<3", "scipy>=1.12,<2"]
standard_benchmarks = ["lm_eval[hf]==0.4.13"]
inspection = ["inspect-ai==0.3.287"]
openhands_sdk = ["openhands-sdk==1.60.1"]
openhands_tools = ["openhands-sdk==1.60.1", "openhands-tools==1.60.1"]
paperqa = ["paper-qa==2026.8.12"]
voice_livekit = ["livekit-agents==1.8.9"]
ml = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2"]
empirical = ["numpy>=1.26,<3"]
orchestration = ["langgraph==1.2.20", "openmdao==3.45.2", "langgraph-checkpoint-sqlite==3.1.3"]
astronomy = ["astropy>=7.0,<8"]
battery = ["pybamm==26.10.1.1"]
dynamics = ["openmm==8.6.1"]
chemistry = ["pyscf==2.15.0"]
music = ["music21>=9.7,<10"]
browser = ["playwright==1.64.1"]
browser_secure = ["cryptography==50.0.2"]
browser_cloud_storage = ["google-cloud-storage>=3.0,<4"]

[project.scripts]
plenum = "plenum_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

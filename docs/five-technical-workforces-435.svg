  <title id="title">Plenum Prometheus — Five technical workforces</title>
  <desc id="desc">The Founder authorizes consequential actions. The original Minister of Operations coordinates four executing divisions and the fifth, Verification and Advisory Council. Scientific Research covers research and simulation; Engineering and Manufacturing covers engineering and creative; Commercial Operations covers operations, marketing, support and business advice; Global Intelligence covers research and browser operations. Outputs independently return through the Verification and Advisory Council to the Minister. These are logical assignments and bounded capabilities, not five always-on autonomous agents. Current private access is scope-gated. Source register updated 15 November 2026.</desc>

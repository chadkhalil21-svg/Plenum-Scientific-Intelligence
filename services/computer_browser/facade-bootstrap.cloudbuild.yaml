# Build only the isolated OAuth MCP facade. The image has no browser, cookies,
# private website session storage, service-account keys, or owner IAP app.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - services/computer_browser/facade.Dockerfile
      - --tag
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
logsBucket: gs://plenum-computer-browser-build-source-98614162800
options:
  logging: GCS_ONLY

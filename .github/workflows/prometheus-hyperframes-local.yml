name: Prometheus | HyperFrames local motion qualification
on:
  pull_request:
    paths:
      - '.github/workflows/prometheus-hyperframes-local.yml'
      - 'docs/checkpoint-maintainer-guide/index.html'
permissions:
  contents: read
jobs:
  local-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
          no-cache: true
      - name: Build the official immutable release from source instead of unverifiable npm metadata
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hf-qualification"
          mkdir -p "$root/home" "$root/project"
          git init "$root/upstream"
          git -C "$root/upstream" fetch --depth=1 https://github.com/heygen-com/hyperframes.git refs/tags/v0.9.97
          git -C "$root/upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$root/upstream" rev-parse HEAD)" = c6ff4a31f240f6051836136577f51045c6da15c5
          test "$(git -C "$root/upstream" rev-parse HEAD:LICENSE)" = ae06b37e1c5116ccfaa615ac25ec1aabf5658d8c
          test "$(git -C "$root/upstream" rev-parse HEAD:bun.lock)" = 4f920799633fbacab10f73b73cc9dabb9b3cb0f0
          cd "$root/upstream"
          node -e 'const p=require("./packages/cli/package.json");if(p.version!=="0.9.97"||p.license!=="Apache-2.0")process.exit(1)'
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          sha256sum bun.lock > "$root/source-lock.sha256"
          node --input-type=module -e 'import fs from "node:fs";import {createRequire} from "node:module";const r=createRequire(process.cwd()+"/packages/core/package.json");fs.copyFileSync(r.resolve("gsap/dist/gsap.min.js"),process.argv[1])' "$root/project/gsap.min.js"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg iproute2
          HOME="$root/home" HYPERFRAMES_NO_TELEMETRY=1 node packages/cli/bin/hyperframes.mjs browser ensure
          cp "$GITHUB_WORKSPACE/docs/checkpoint-maintainer-guide/index.html" "$root/project/index.html"
      - name: Render original local composition with network isolated and no hosted services
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hf-qualification"
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser -u "$1" -- env -i HOME="$2/home" PATH="$3" HYPERFRAMES_NO_TELEMETRY=1 CI=true node "$2/upstream/packages/cli/bin/hyperframes.mjs" render "$2/project" --output "$2/output.mp4" --fps 24 --quality draft --workers 1 --no-browser-gpu
          ' _ "$(id -un)" "$root" "$PATH"
          cp "$root/output.mp4" output.mp4
          cp "$root/source-lock.sha256" source-lock.sha256
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('output.mp4')
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_streams','-of','json',str(p)]))['streams'][0]
          assert (meta['width'],meta['height'])==(640,360)
          assert abs(float(meta['duration'])-8)<0.1
          assert int(meta['nb_frames'])==192
          def frame(t):
              return subprocess.check_output(['ffmpeg','-v','error','-ss',str(t),'-i',str(p),'-frames:v','1','-f','rawvideo','-pix_fmt','rgb24','-'])
          a,b=frame(0.3),frame(7.5)
          assert len(a)==len(b)==640*360*3
          assert sum(abs(x-y) for x,y in zip(a,b))/len(a)>0.3, 'No meaningful motion'
          h=lambda name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
          pathlib.Path('hyperframes-acceptance.json').write_text(json.dumps({'schema':'plenum-hyperframes-local-v1','version':'0.9.97','release_commit':'c6ff4a31f240f6051836136577f51045c6da15c5','video_sha256':h('output.mp4'),'source_lock_receipt_sha256':h('source-lock.sha256'),'source_build':True,'frames':192,'duration_seconds':8,'public_repository_documentation':True,'composition_sha256':h('docs/checkpoint-maintainer-guide/index.html'),'paid_inference':False,'owner_runtime_verified':False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prometheus-checkpoint-maintainer-motion
          path: |
            output.mp4
            hyperframes-acceptance.json
            source-lock.sha256
            docs/checkpoint-maintainer-guide/index.html
          if-no-files-found: error
          retention-days: 7

name: Verify Scientific AI Foundation
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/control-center.yml'
      - 'protocols/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/control-center.yml'
      - 'protocols/**'
permissions:
  contents: read
concurrency:
  group: plenum-full-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install prototype
        run: python -m pip install -e ".[science,ml,orchestration,astronomy,empirical]"
      - name: Run independent checks
        run: python -m unittest discover -s tests -v
      - name: Evaluate a bounded improvement proposal
        run: python -m plenum_ai.cli improve --out reports/improvement.json
      - name: Check independently recomputed improvement metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path("reports/improvement.json").read_text())
          assert e["independent_audit"]["passed"], e["independent_audit"]
          assert e["independent_audit"]["holdout_n"] >= 8
          assert e["deployed"] is False
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: improvement-proposal
          path: reports/improvement.json

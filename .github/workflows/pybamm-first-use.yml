name: Plenum Engineering | One-Time Upstream PyBaMM Battery Adapter Acceptance
on:
  pull_request:
    paths:
      - 'src/plenum_ai/battery_first_use.py'
      - 'tests/test_battery_first_use.py'
      - '.github/workflows/pybamm-first-use.yml'
      - 'pyproject.toml'
permissions:
  contents: read
concurrency:
  group: plenum-pybamm-new-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  independently-verified-real-upstream-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CI: 'true'
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use ONLY existing pinned PyBaMM optional battery extra
        run: |
          python -m pip install -e ".[battery]"
          python -m pip check
      - name: Test the new independent physical integrator and safe entrypoint (no solver repeat)
        run: |
          python -m unittest discover -s tests -p test_battery_first_use.py -v
      - name: Actually execute two changed-current upstream PyBaMM physics solves
        run: |
          python -m plenum_ai.battery_first_use --out reports/pybamm-spm-first-use.json
      - name: Independently read back and grade actual output, no invented success
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          p=Path('reports/pybamm-spm-first-use.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema']=='plenum-pybamm-real-spm-first-use-v1'
          assert d['status']=='PYBAMM_REAL_PHYSICS_CHECK_PASS'
          assert d['solver_ran'] is True
          assert d['library']=='PyBaMM' and d['upstream_repository']=='pybamm-team/PyBaMM'
          assert len(d['cases'])==2
          assert [x['applied_current_A'] for x in d['cases']]==[1.5,3.0]
          assert d['changed_input_check_passed'] is True
          assert abs(d['changed_input_capacity_ratio']-2.0)<0.035
          for x in d['cases']:
              assert x['sample_count']>=5
              assert 299.0 <= x['simulated_duration_s'] <= 301.0
              assert x['current_max_abs_error_A'] < .015
              assert x['capacity_balance_abs_error_Ah'] < .001
              assert x['voltage_bounded']
              assert x['physical_conservation_check_passed']
              assert math.isfinite(x['terminal_voltage_end_V'])
          assert d['external_experiment_validation'] is False
          assert d['novel_battery_discovery'] is False
          assert d['agent_model_inference_calls']==0
          assert not d['private_accounts_accessed']
          assert not d['paid_api_used']
          print('INDEPENDENT BATTERY ADAPTER ACCEPTED: real PyBaMM two-current solver, bounded charge balance, NOT experimental validation')
          PY
      - name: Retain PUBLIC bounded proof, not model weights or private data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plenum-first-use-pybamm-battery-physics
          path: reports/pybamm-spm-first-use.json
          if-no-files-found: ignore
          retention-days: 7

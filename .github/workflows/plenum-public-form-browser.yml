name: Plenum Independent Public Form Browser (TinyFish Free)
on:
  issues:
    types: [opened]
  pull_request:
    paths:
      - 'src/plenum_ai/public_form_browser.py'
      - 'tests/test_public_form_browser.py'
      - '.github/workflows/plenum-public-form-browser.yml'
  push:
    branches: [main]
    paths:
      - 'src/plenum_ai/public_form_browser.py'
      - 'tests/test_public_form_browser.py'
      - '.github/workflows/plenum-public-form-browser.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: plenum-public-form-browser-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false
jobs:
  public-get-search:
    if: >-
      github.event_name == 'issues' &&
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      github.event.issue.user.login == 'chadkhalil21-svg' &&
      github.event.issue.title == 'Prometheus Chat Browser: public-form-search'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install official Playwright with isolated Chromium
        run: |
          python -m pip install -e '.[browser]'
          python -m playwright install --with-deps chromium
      - name: Perform founder-directed public GET-only form search
        env:
          BROWSER_AUTHOR: ${{ github.event.issue.user.login }}
          BROWSER_TITLE: ${{ github.event.issue.title }}
          BROWSER_BODY: ${{ github.event.issue.body }}
        run: |
          python -m plenum_ai.public_form_browser \
            --author "$BROWSER_AUTHOR" \
            --title "$BROWSER_TITLE" \
            --body "$BROWSER_BODY" \
            --output "$RUNNER_TEMP/plenum-public-form-browser.md"
      - name: Return sanitized nonprivate result to founder issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/plenum-public-form-browser.md"
  offline-contract:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e .
          python -m unittest discover -s tests -p test_public_form_browser.py -v

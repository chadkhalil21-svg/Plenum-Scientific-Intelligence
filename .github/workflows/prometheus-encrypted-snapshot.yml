name: Prometheus encrypted snapshot contract
on:
  pull_request:
    paths:
      - 'integrations/cloudflare/paperclip-snapshot*'
      - '.github/workflows/prometheus-encrypted-snapshot.yml'
permissions:
  contents: read
jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Isolated encrypted snapshot contract
        run: |
          node integrations/cloudflare/paperclip-snapshot.test.mjs
          node integrations/cloudflare/paperclip-snapshot-transport.test.mjs
          node integrations/cloudflare/paperclip-snapshot-quota.test.mjs
      - name: Local upstream workerd SQLite persistence (synthetic only)
        working-directory: integrations/cloudflare
        run: |
          npm install --no-save --no-package-lock --ignore-scripts miniflare@4.20260730.0
          node paperclip-snapshot-workerd.test.mjs

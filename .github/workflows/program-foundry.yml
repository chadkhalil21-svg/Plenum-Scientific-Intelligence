name: Generate Original Reviewable Programs
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Pre-reviewed original starter program template"
        required: true
        type: choice
        options:
          - research_cli
          - data_validator
          - geometry_designer
      public_topic:
        description: "Public program topic, not a secret or unpublished patent"
        required: true
        default: "Scientific research and original design"
  push:
    paths:
      - '.github/workflows/program-foundry.yml'
      - 'src/plenum_ai/program_foundry.py'
      - 'tests/test_program_foundry.py'
permissions:
  contents: read
concurrency:
  group: plenum-reviewable-program-foundry
  cancel-in-progress: true
jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROGRAM_KIND: ${{ github.event.inputs.kind || 'research_cli' }}
      PROGRAM_TOPIC: ${{ github.event.inputs.public_topic || 'Scientific research and original design' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Test the entire code factory without new dependencies
        run: python -m unittest discover -s tests -p 'test_program_foundry.py' -v
      - name: Generate a reviewed original Python program and its tests
        run: |
          python -m plenum_ai.cli build-program \
            --kind "$PROGRAM_KIND" --topic "$PROGRAM_TOPIC" \
            --dir reports/generated_program --out reports/program_manifest.json
      - name: Run generated program's own independent tests
        run: |
          (cd reports/generated_program && python -m unittest discover -s . -p 'test_generated.py' -v)
      - name: Verify no program was merged, deployed, or permitted to self-modify
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('reports/program_manifest.json').read_text())
          assert m['human_code_review_required']
          assert m['generated_program_has_not_been_deployed']
          assert not m['model_weights_self_modified']
          assert not m['external_code_execution_approved']
          assert len(m['main_sha256'])==64
          print('Original code compiled and tested; no automatic production changes.')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-program-for-human-review
          path: reports/
          if-no-files-found: warn
          retention-days: 14

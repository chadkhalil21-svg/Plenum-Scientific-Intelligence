name: Prometheus upstream specialist interoperability
on:
  pull_request:
    paths:
      - 'integrations/prometheus_oss/upstream_specialists.py'
      - 'integrations/prometheus_oss/upstream-specialists-requirements.txt'
      - '.github/workflows/prometheus-upstream-specialists.yml'
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' && github.actor == 'chadkhalil21-svg' && github.event.pull_request.head.repo.full_name == github.repository && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual pinned upstream frameworks
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r integrations/prometheus_oss/upstream-specialists-requirements.txt
          python -m pip check
      - name: Start original local model, no provider credentials
        run: |
          set -eu
          docker pull ollama/ollama:latest
          docker run -d --name plenum-paperclip-qwen --network host -e OLLAMA_HOST=127.0.0.1:11434 -e OLLAMA_CONTEXT_LENGTH=2048 -e OLLAMA_NUM_PARALLEL=1 --memory=8g --cpus=3 ollama/ollama:latest
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          bash integrations/paperclip/pull_original_qwen.sh
          test "$(docker exec plenum-paperclip-qwen ollama list | awk '$1=="qwen3.5:4b" {print $2}')" = d8b0f5e9760c
      - name: Execute actual upstream specialist and peer workflow
        run: |
          for case in science engineering; do
            python integrations/prometheus_oss/upstream_specialists.py run "$case" "reports/upstream/$case"
          done
      - name: Remove model and independently reread all receipts
        run: |
          docker rm -f plenum-paperclip-qwen
          if curl --fail --silent --max-time 2 http://127.0.0.1:11434/api/tags; then exit 1; fi
          for case in science engineering; do
            python integrations/prometheus_oss/upstream_specialists.py verify "$case" "reports/upstream/$case" > "reports/upstream/$case-verification.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prometheus-upstream-specialist-evidence
          path: reports/upstream/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove local model
        if: always()
        run: docker rm -f plenum-paperclip-qwen 2>/dev/null || true

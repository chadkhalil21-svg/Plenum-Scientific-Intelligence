name: Plenum Business Workforce | Public Service Readback

# Free scheduled ephemeral runner. Not 24/7 hosting. No production mutations.
# Existing American Rider Cloud Run production audit is separate and unchanged.
on:
  pull_request:
    paths:
      - 'src/plenum_ai/business_public_watch.py'
      - 'tests/test_public_business_watch.py'
      - '.github/workflows/business-public-readback.yml'
  schedule:
    - cron: '37 5,11,17,23 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plenum-business-public-readback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Validate bounded retry, independent readback and no writes
        run: python -m unittest discover -s tests -p 'test_public_business_watch.py' -v
  real-public-readback:
    needs: offline-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Independently reread actual approved public business HTTPS endpoints
        run: python -m plenum_ai.business_public_watch --out reports/public-business-readback.json
      - name: Publish no-secret status summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('reports/public-business-readback.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              if not p.is_file():
                  output.write('Public readback: **NO REPORT**. See failed job.\n')
              else:
                  r=json.loads(p.read_text())
                  output.write(f"Public HTTP readback: **{r['verified']}/{r['total']}** independently reread. Not commercial readiness.\n\n")
                  for item in r['reports']:
                      output.write(f"- {item['service']}: {item['status']} ({item.get('reason', 'ok')})\n")
          PY
      - name: Save only bounded public availability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-business-readback-${{ github.run_id }}
          path: reports/public-business-readback.json
          if-no-files-found: ignore
          retention-days: 7

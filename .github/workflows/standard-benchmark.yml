name: Reviewed Standard Model Benchmark (Manual Only)
on:
  workflow_dispatch:
    inputs:
      model:
        description: Reviewed open-weight checkpoint
        type: choice
        required: true
        options:
          - Qwen/Qwen3-1.7B
          - HuggingFaceTB/SmolLM2-1.7B-Instruct
      task:
        description: Reviewed standard public benchmark
        type: choice
        required: true
        options:
          - arc_easy
          - hellaswag
      sample_limit:
        description: Small example count; not a scientific claim
        type: choice
        required: true
        options:
          - '4'
          - '8'
          - '16'
permissions:
  contents: read
concurrency:
  group: plenum-standard-benchmark-manual
  cancel-in-progress: false
jobs:
  reviewed-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MODEL: ${{ inputs.model }}
      TASK: ${{ inputs.task }}
      LIMIT: ${{ inputs.sample_limit }}
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Preview bounded MIT-licensed evaluator without downloading a model
        run: |
          python -m pip install -e .
          python -m plenum_ai.standard_benchmark \
            --model "$MODEL" --task "$TASK" --limit "$LIMIT" \
            --out reports/standard_benchmark_plan.json
      - name: Install pinned optional third-party evaluation harness on explicit manual dispatch
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[standard_benchmarks]"
      - name: Run reviewed CPU standard benchmark, restricted to small sample count
        run: |
          python -m plenum_ai.standard_benchmark \
            --model "$MODEL" --task "$TASK" --limit "$LIMIT" --execute \
            --out reports/standard_benchmark_execution.json
      - name: Preserve scores and planner provenance without claiming AGI
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/standard_benchmark_execution.json'))
          assert p['schema']=='plenum-standard-benchmark-adapter-v1'
          assert p['execution_result']['standard_framework_executed'] is True
          assert p['execution_result']['AGI_demonstrated'] is False
          assert p['AGI_demonstrated'] is False
          print('Reviewed model:',p['requested_model'])
          print('Review-limited task:',p['task'],'sample count:',p['sample_limit'])
          print('Results are exploratory; no automatic model promotion.')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: standard-benchmark-reviewed-evidence
          path: |
            reports/standard_benchmark_plan.json
            reports/standard_benchmark_execution.json
            reports/standard-evals/
          retention-days: 30

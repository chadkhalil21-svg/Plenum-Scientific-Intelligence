name: Prometheus Hermes native skill learning
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/prometheus-hermes-native-learning.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: prometheus-hermes-native-learning-once
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'prometheus-hermes-native-learning' && github.run_attempt == 1 && github.event.before == '0493a94c73323446359d06dc82cb6f15871e573d'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind new independently accepted scholarly discovery experience
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hermes-evidence" "$RUNNER_TEMP/hermes-work" "$RUNNER_TEMP/hermes-home"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46106202156/jobs" > "$RUNNER_TEMP/discovery-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15247567493/zip" > "$RUNNER_TEMP/discovery.zip"
          echo "4ee4e2e086e692cccad2c2a4e33aa73556fd5deafd9cb582c538778335323ed8  $RUNNER_TEMP/discovery.zip" | sha256sum -c -
          python - "$RUNNER_TEMP/discovery-jobs.json" "$RUNNER_TEMP/discovery.zip" "$RUNNER_TEMP/hermes-work/experience.json" <<'PY'
          import json,sys,zipfile,pathlib
          jobs=json.load(open(sys.argv[1]))["jobs"]
          for ident in (140859404231,140861602798):
              assert next(j for j in jobs if j["id"]==ident)["conclusion"]=="success"
          z=zipfile.ZipFile(sys.argv[2]); assert z.testzip() is None
          def receipt(suffix):
              names=[n for n in z.namelist() if n.endswith(suffix)]
              assert len(names)==1 and z.getinfo(names[0]).file_size<100000
              return json.loads(z.read(names[0]))
          q=receipt("/qualification.json"); v=q["independent_verification"]
          assert v["verified_contracts"]==5 and v["independent_actual_input_test"] and v["provider_calls_replayed"]==0
          d=receipt("/paper_discovery.result.json")["result"]
          r=receipt("/paper_readback.result.json")["result"]
          assert 1<=len(r)<=2 and 1<=len(d["records"])<=4
          assert all(any(row["url"]=="https://doi.org/"+doi and row["title"]==meta["title"] for row in d["records"]) for doi,meta in r.items())
          # Only trusted structural facts; remote text is not a skill instruction.
          facts={"objective":"Find public concrete corrosion papers and independently check deposited records; solve and verify thermal model.",
                 "discovery_records":len(d["records"]),"independent_doi_readbacks":len(r),"matching_title_and_identifier":True,
                 "verified_contracts":v["verified_contracts"],"provider_calls_replayed":0,
                 "source":"Crossref deposited metadata; separate same-provider readback, not paper-content or independent scientific confirmation",
                 "prior_defect":"Producer admitted identifiers incompatible with downstream DOI policy, case duplicates and titles truncated after relevance checking.",
                 "accepted_correction":"Reuse existing downstream DOI grammar; normalize identifier case, remove duplicates and check normalized title relevance before limiting accepted records.",
                 "provenance":{"run":46106202156,"artifact":15247567493,"merge":"8e8544bd5661c8a03b050e43f938d85a08bb099d"}}
          pathlib.Path(sys.argv[3]).write_text(json.dumps(facts,separators=(",",":")))
          PY
          sudo chown -R 10000:10000 "$RUNNER_TEMP/hermes-home"
          chmod -R a+rX "$RUNNER_TEMP/hermes-work"
      - name: Pull versioned official upstream runtime and existing local model
        run: |
          set -euo pipefail
          docker pull nousresearch/hermes-agent@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f
          docker run --init --rm --network none --user 10000:10000 --cap-drop ALL --security-opt no-new-privileges --entrypoint /opt/hermes/.venv/bin/hermes-agent nousresearch/hermes-agent@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f --version > "$RUNNER_TEMP/hermes-evidence/hermes-version.txt"
          grep -Eq '(^|[^0-9])0[.]23[.]4([^0-9]|$)' "$RUNNER_TEMP/hermes-evidence/hermes-version.txt"
          docker pull ollama/ollama@sha256:7e8c7ba387b11b09dcce1eff1118b1ab433564ed263434a7730c209f2ee346f4
          docker image inspect nousresearch/hermes-agent@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/hermes-evidence/hermes-image.json"
          docker image inspect ollama/ollama@sha256:7e8c7ba387b11b09dcce1eff1118b1ab433564ed263434a7730c209f2ee346f4 --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/hermes-evidence/ollama-image.json"
          docker run -d --name plenum-hermes-ollama -p 127.0.0.1:11434:11434 -e OLLAMA_CONTEXT_LENGTH=65536 -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_NO_CLOUD=1 --memory=9g --cpus=3 ollama/ollama@sha256:7e8c7ba387b11b09dcce1eff1118b1ab433564ed263434a7730c209f2ee346f4
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags && break; sleep 2; done
          docker exec plenum-hermes-ollama ollama pull qwen3.5:4b
          curl -fsS http://127.0.0.1:11434/api/tags > "$RUNNER_TEMP/hermes-evidence/model.json"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert any(m["name"]=="qwen3.5:4b" and m["digest"]=="d8b0f5e9760cd1682034f292d7ef72ec46f432149be0df7574bf2d6e92e38c04" for m in d["models"])' "$RUNNER_TEMP/hermes-evidence/model.json"
          docker network create --internal plenum-hermes-internal
          docker network connect --alias ollama plenum-hermes-internal plenum-hermes-ollama
          docker network disconnect bridge plenum-hermes-ollama
          test "$(docker network inspect plenum-hermes-internal --format '{{.Internal}}')" = true
      - id: learn
        name: Native Hermes extracts a staged procedural skill
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/hermes-config.yaml" <<'YAML'
          model:
            provider: custom
            model: qwen3.5:4b
            base_url: http://ollama:11434/v1
            api_key: local-only
            context_length: 65536
          platform_toolsets:
            cli: [skills]
          security:
            allow_lazy_installs: false
          skills:
            write_approval: true
          terminal:
            backend: local
            cwd: /opt/data/work
          agent:
            max_turns: 3
          YAML
          sudo install -o 10000 -g 10000 -m 0600 "$RUNNER_TEMP/hermes-config.yaml" "$RUNNER_TEMP/hermes-home/config.yaml"
          # No write access to prior evidence, checkout or external endpoints.
          # Only native skill staging is authorized; no approval or activation.
          experience=$(cat "$RUNNER_TEMP/hermes-work/experience.json")
          set +e
          timeout 720 docker run --init --name plenum-hermes-native --network plenum-hermes-internal --user 10000:10000 --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 3g --cpus 1 --workdir /opt/data/work -e HERMES_WRITE_SAFE_ROOT=/opt/data/work -e HOME=/opt/data -e HERMES_HOME=/opt/data -e OPENAI_API_KEY=local-only -e HERMES_SKIP_CONFIG_MIGRATION=1 -v "$RUNNER_TEMP/hermes-home:/opt/data" -v "$RUNNER_TEMP/hermes-work:/opt/data/work:ro" --entrypoint /opt/hermes/.venv/bin/hermes nousresearch/hermes-agent@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f chat --oneshot --toolsets skills --max-turns 3 -q "You are the existing Plenum Research specialist. Derive one transferable research-quality procedure from this independently accepted experience: $experience . Stage exactly one skill_manage operations create named plenum-source-evidence-quality with valid SKILL.md. Use only that tool; no other action. Do not approve. Stop after staging." > "$RUNNER_TEMP/hermes-native-output.txt" 2>&1
          rc=$?
          set -e
          printf '{"native_exit":%s}\n' "$rc" > "$RUNNER_TEMP/hermes-evidence/native-exit.json"
          exit "$rc"
      - name: Independently verify staged candidate and no active installation
        if: always() && steps.learn.outcome != 'skipped'
        run: |
          set -euo pipefail
          sudo python - "$RUNNER_TEMP/hermes-home" "$RUNNER_TEMP/hermes-evidence" <<'PY'
          import pathlib,sys,json,hashlib
          home,out=map(pathlib.Path,sys.argv[1:])
          pending=home/"pending"/"skills"
          rows=list(pending.glob("*.json")) if pending.is_dir() and not pending.is_symlink() else []
          (out/"pending-count.json").write_text(json.dumps({"pending_count":min(len(rows),100)}))
          assert len(rows)==1
          p=rows[0]; assert not p.is_symlink() and 0<p.stat().st_size<20000
          r=json.loads(p.read_bytes()); a=r["payload"]
          # v0.23.4 advertises operations[]; the upstream approval gate
          # stages the entire batch as {"action":"batch","operations":[...]}.
          shape="batch" if a.get("action")=="batch" else "flat" if a.get("action")=="create" else "other"
          ops=a.get("operations") if shape=="batch" else [a] if shape=="flat" else []
          count=len(ops) if isinstance(ops,list) else -1
          exact=count==1 and isinstance(ops[0],dict) and ops[0].get("action")=="create" and ops[0].get("name")=="plenum-source-evidence-quality"
          (out/"staging-diagnostic.json").write_text(json.dumps({"shape":shape,"operation_count":count,"exact_create":bool(exact)}))
          assert exact
          a=ops[0]
          assert not any(a.get(k) for k in ("file_path","file_content","old_string","new_string","absorbed_into","operations"))
          content=a["content"]; assert isinstance(content,str) and 100<len(content)<8000
          # Preserve the exact bounded untrusted candidate before content checks.
          # Never auto-wrap, rewrite, approve, install or execute it.
          (out/"candidate-skill.txt").write_text(content,encoding="utf-8")
          (out/"content-diagnostic.json").write_text(json.dumps({"candidate_sha256":hashlib.sha256(content.encode()).hexdigest(),"frontmatter_prefix":content.lstrip("\ufeff").startswith("---"),"description_marker":"description:" in content,"approved":False}))
          assert not any((home/"skills").rglob("plenum-source-evidence-quality"))
          assert content.lstrip("\ufeff").startswith("---") and "description:" in content
          (out/"staging-receipt.json").write_text(json.dumps({"schema":"plenum-hermes-staged-skill-v1","source_artifact":15247567493,"source_sha256":"4ee4e2e086e692cccad2c2a4e33aa73556fd5deafd9cb582c538778335323ed8","candidate_sha256":hashlib.sha256(content.encode()).hexdigest(),"native_exit":json.loads((out/"native-exit.json").read_text())["native_exit"],"native_staged":True,"approved":False,"active":False,"transfer_verified":False,"paid_inference":False}))
          PY
      - name: Validate candidate with pinned upstream Hermes frontmatter validator
        if: always() && steps.learn.outcome != 'skipped'
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/hermes-evidence/candidate-skill.txt"
          docker run --rm --network none --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --read-only --pids-limit 64 --memory 768m -v "$RUNNER_TEMP/hermes-evidence/candidate-skill.txt:/candidate.txt:ro" --entrypoint /opt/hermes/.venv/bin/python nousresearch/hermes-agent@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f -c 'from pathlib import Path; from tools.skill_manager_tool import _validate_frontmatter,_validate_content_size; c=Path("/candidate.txt").read_text(); ok=_validate_frontmatter(c) is None and _validate_content_size(c) is None; print("HERMES_NATIVE_FRONTMATTER_VALID" if ok else "HERMES_NATIVE_FRONTMATTER_REJECTED"); raise SystemExit(0 if ok else 1)' > "$RUNNER_TEMP/hermes-evidence/upstream-format-verdict.txt"
      - name: Preserve bounded candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-hermes-native-learning
          path: ${{ runner.temp }}/hermes-evidence/
      - name: Clean temporary isolated containers
        if: always()
        run: |
          docker rm -f plenum-hermes-native plenum-hermes-ollama || true
          docker network rm plenum-hermes-internal || true

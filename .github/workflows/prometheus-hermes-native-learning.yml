name: Prometheus Hermes native skill learning
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/prometheus-hermes-native-learning.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: prometheus-hermes-native-learning-once
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'prometheus-hermes-native-learning' && github.run_attempt == 1 && github.event.before == '5e13a93969649a121295f1aad90c2ceadd4b080a'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind accepted engineering and subsequent review experience
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hermes-evidence" "$RUNNER_TEMP/hermes-work" "$RUNNER_TEMP/hermes-home"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46103340148/jobs" > "$RUNNER_TEMP/hermes-prior-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15246534681/zip" > "$RUNNER_TEMP/hermes-prior.zip"
          echo "d873b04ac3d540bc54139052ff0ba6e69310e91348f698f5bd19ff77fbbf8fb2  $RUNNER_TEMP/hermes-prior.zip" | sha256sum -c -
          python -c 'import json,sys; a=next(x for x in json.load(open(sys.argv[1]))["jobs"] if x["id"]==140850493441); assert a["conclusion"]=="success" and any(x["name"]=="Independent networkless regression and frozen acceptance" and x["conclusion"]=="success" for x in a["steps"])' "$RUNNER_TEMP/hermes-prior-jobs.json"
          python - "$RUNNER_TEMP/hermes-prior.zip" "$RUNNER_TEMP/hermes-work" <<'PY'
          import sys,zipfile,pathlib
          z=zipfile.ZipFile(sys.argv[1]); assert z.testzip() is None
          root=pathlib.Path(sys.argv[2])
          for name in ("candidate.patch","independent-verdict.txt"):
              info=z.getinfo(name); assert 0<info.file_size<30000
              (root/name).write_bytes(z.read(name))
          assert b"Ran 15 tests" in (root/"independent-verdict.txt").read_bytes()
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46105158171/jobs" > "$RUNNER_TEMP/learning-prior-jobs.json"
          python -c 'import json,sys; a=next(x for x in json.load(open(sys.argv[1]))["jobs"] if x["id"]==140856143572); assert a["conclusion"]=="failure"; s={x["name"]:x["conclusion"] for x in a["steps"]}; assert s["Native Hermes extracts a staged procedural skill"]=="success" and s["Independently verify staged candidate and no active installation"]=="failure"' "$RUNNER_TEMP/learning-prior-jobs.json"
          test "$(git hash-object src/plenum_ai/business_public_watch.py)" = 7643820329b4c5214f464cf1c36d344b6f3be317
          cp src/plenum_ai/business_public_watch.py "$RUNNER_TEMP/hermes-work/reviewed-source.py"
          sudo chown -R 10000:10000 "$RUNNER_TEMP/hermes-home"
          chmod -R a+rX "$RUNNER_TEMP/hermes-work"
      - name: Pull versioned official upstream runtime and existing local model
        run: |
          set -euo pipefail
          docker pull nousresearch/hermes-agent@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f
          docker run --init --rm --network none --user 10000:10000 --cap-drop ALL --security-opt no-new-privileges --entrypoint /opt/hermes/.venv/bin/hermes-agent nousresearch/hermes-agent@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f --version > "$RUNNER_TEMP/hermes-evidence/hermes-version.txt"
          grep -Eq '(^|[^0-9])0[.]23[.]4([^0-9]|$)' "$RUNNER_TEMP/hermes-evidence/hermes-version.txt"
          docker pull ollama/ollama@sha256:7e8c7ba387b11b09dcce1eff1118b1ab433564ed263434a7730c209f2ee346f4
          docker image inspect nousresearch/hermes-agent@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/hermes-evidence/hermes-image.json"
          docker image inspect ollama/ollama@sha256:7e8c7ba387b11b09dcce1eff1118b1ab433564ed263434a7730c209f2ee346f4 --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/hermes-evidence/ollama-image.json"
          docker run -d --name plenum-hermes-ollama -p 127.0.0.1:11434:11434 -e OLLAMA_CONTEXT_LENGTH=65536 -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_NO_CLOUD=1 --memory=9g --cpus=3 ollama/ollama@sha256:7e8c7ba387b11b09dcce1eff1118b1ab433564ed263434a7730c209f2ee346f4
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags && break; sleep 2; done
          docker exec plenum-hermes-ollama ollama pull qwen3.5:4b
          curl -fsS http://127.0.0.1:11434/api/tags > "$RUNNER_TEMP/hermes-evidence/model.json"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert any(m["name"]=="qwen3.5:4b" and m["digest"]=="d8b0f5e9760cd1682034f292d7ef72ec46f432149be0df7574bf2d6e92e38c04" for m in d["models"])' "$RUNNER_TEMP/hermes-evidence/model.json"
          docker network create --internal plenum-hermes-internal
          docker network connect --alias ollama plenum-hermes-internal plenum-hermes-ollama
          docker network disconnect bridge plenum-hermes-ollama
          test "$(docker network inspect plenum-hermes-internal --format '{{.Internal}}')" = true
      - name: Native Hermes extracts a staged procedural skill
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/hermes-config.yaml" <<'YAML'
          model:
            provider: custom
            model: qwen3.5:4b
            base_url: http://ollama:11434/v1
            api_key: local-only
            context_length: 65536
          platform_toolsets:
            cli: [file, skills]
          security:
            allow_lazy_installs: false
          skills:
            write_approval: true
          terminal:
            backend: local
            cwd: /opt/data/work
          agent:
            max_turns: 6
          YAML
          sudo install -o 10000 -g 10000 -m 0600 "$RUNNER_TEMP/hermes-config.yaml" "$RUNNER_TEMP/hermes-home/config.yaml"
          # No write access to prior evidence, checkout or external endpoints.
          # Only native skill staging is authorized; no approval or activation.
          timeout 720 docker run --init --name plenum-hermes-native --network plenum-hermes-internal --user 10000:10000 --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 3g --cpus 1 --workdir /opt/data/work -e HERMES_WRITE_SAFE_ROOT=/opt/data/work -e HOME=/opt/data -e HERMES_HOME=/opt/data -e OPENAI_API_KEY=local-only -e HERMES_SKIP_CONFIG_MIGRATION=1 -v "$RUNNER_TEMP/hermes-home:/opt/data" -v "$RUNNER_TEMP/hermes-work:/opt/data/work:ro" --entrypoint /opt/hermes/.venv/bin/hermes nousresearch/hermes-agent@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f chat --oneshot --toolsets file,skills --max-turns 6 -q 'You are the existing Plenum Engineering specialist. Read candidate.patch, independent-verdict.txt and reviewed-source.py in /opt/data/work. Compare the accepted original patch with the subsequently reviewed implementation. Derive a reusable procedure for validating untrusted inputs and preventing unsafe or misleading error diagnostics in future software assignments. Explain why consuming an iterator and inspecting unvalidated attributes are mistakes. Use the native skill_manage operations array with exactly one create operation named plenum-safe-validation-diagnostics and concise valid SKILL.md content grounded in the comparison. Skill write approval is enabled: stop after staging, do not approve, edit other skills, execute code, or make external calls.' > "$RUNNER_TEMP/hermes-native-output.txt" 2>&1
      - name: Independently verify staged candidate and no active installation
        run: |
          set -euo pipefail
          sudo python - "$RUNNER_TEMP/hermes-home" "$RUNNER_TEMP/hermes-evidence" <<'PY'
          import pathlib,sys,json,hashlib
          home,out=map(pathlib.Path,sys.argv[1:])
          pending=home/"pending"/"skills"
          assert pending.is_dir() and not pending.is_symlink()
          rows=list(pending.glob("*.json")); assert len(rows)==1
          p=rows[0]; assert not p.is_symlink() and 0<p.stat().st_size<20000
          r=json.loads(p.read_bytes()); a=r["payload"]
          # v0.23.4 advertises operations[]; the upstream approval gate
          # stages the entire batch as {"action":"batch","operations":[...]}.
          shape="batch" if a.get("action")=="batch" else "flat" if a.get("action")=="create" else "other"
          ops=a.get("operations") if shape=="batch" else [a] if shape=="flat" else []
          count=len(ops) if isinstance(ops,list) else -1
          exact=count==1 and isinstance(ops[0],dict) and ops[0].get("action")=="create" and ops[0].get("name")=="plenum-safe-validation-diagnostics"
          (out/"staging-diagnostic.json").write_text(json.dumps({"shape":shape,"operation_count":count,"exact_create":bool(exact)}))
          assert exact
          a=ops[0]
          assert not any(a.get(k) for k in ("file_path","file_content","old_string","new_string","absorbed_into","operations"))
          content=a["content"]; assert isinstance(content,str) and 100<len(content)<8000
          assert content.startswith("---") and "description:" in content
          assert not any((home/"skills").rglob("plenum-safe-validation-diagnostics"))
          # Candidate remains untrusted data: preserve for separate review, never execute.
          (out/"candidate-skill.txt").write_text(content,encoding="utf-8")
          (out/"staging-receipt.json").write_text(json.dumps({"schema":"plenum-hermes-staged-skill-v1","source_artifact":15246534681,"source_sha256":"d873b04ac3d540bc54139052ff0ba6e69310e91348f698f5bd19ff77fbbf8fb2","candidate_sha256":hashlib.sha256(content.encode()).hexdigest(),"reviewed_source_blob":"7643820329b4c5214f464cf1c36d344b6f3be317","native_staged":True,"approved":False,"active":False,"transfer_verified":False,"paid_inference":False}))
          PY
      - name: Preserve bounded candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-hermes-native-learning
          path: ${{ runner.temp }}/hermes-evidence/
      - name: Clean temporary isolated containers
        if: always()
        run: |
          docker rm -f plenum-hermes-native plenum-hermes-ollama || true
          docker network rm plenum-hermes-internal || true

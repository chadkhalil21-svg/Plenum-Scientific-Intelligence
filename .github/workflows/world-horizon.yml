name: Public World Intelligence Source Verification
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Public topic only, no credentials or confidential details"
        required: false
        default: "science research innovation"
      area:
        description: "Public information category"
        required: false
        type: choice
        options:
          - all
          - universities
          - defense
          - foreign_affairs
          - business
          - environment
          - news
          - journals
          - software
          - discoveries
          - art
          - music
          - design
          - health
          - funding
          - artificial_intelligence
          - physics
  schedule:
    - cron: "37 7 * * *"
      timezone: "America/New_York"
  push:
    paths:
      - '.github/workflows/world-horizon.yml'
      - 'src/plenum_ai/world_horizon.py'
      - 'tests/test_world_horizon.py'
      - 'src/plenum_ai/lab_radar.py'
      - 'tests/test_lab_radar.py'
permissions:
  contents: read
concurrency:
  group: public-world-horizon
  cancel-in-progress: true
jobs:
  source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      WORLD_TOPIC: ${{ github.event.inputs.topic || 'science research innovation' }}
      WORLD_AREA: ${{ github.event.inputs.area || 'all' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Verify parsing, restrictions and honest unavailable-source handling offline
        run: python -m unittest discover -s tests -p 'test_world_horizon.py' -v
      - name: Verify incremental laboratory radar without network requests
        run: python -m unittest discover -s tests -p 'test_lab_radar.py' -v
      - name: Retrieve public institutional, journal, economic and environmental source metadata
        run: |
          python -m plenum_ai.cli world-horizon \
            --topic "$WORLD_TOPIC" --category "$WORLD_AREA" \
            --online --out reports/world_horizon.json
      - name: Preserve exact source status and refuse fabricated breakthrough claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('reports/world_horizon.json').read_text())
          assert report["schema"]=="plenum-public-horizon-snapshot-v1"
          assert not report["AGI_achieved"]
          assert not report["independent_breakthrough_verified"]
          assert report["providers_attempted"] >= 1
          assert len(report["providers"])==report["providers_attempted"]
          for item in report["records"]:
              assert item["untrusted_external_content"]
              assert not item["independent_fact_check_complete"]
              assert item["url"].startswith('https://')
          for source in report["providers"]:
              print(source["source"], source["status"],
                    "items:",len(source["records"]),source.get("error_type",""),
                    "safe_schema:",source.get("schema_diagnostic",""))
          print("Total public records:",len(report["records"]))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plenum-public-world-horizon-evidence
          path: reports/world_horizon.json
          if-no-files-found: warn
          retention-days: 14

  public-memory-archive:
    needs: source-verification
    if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research-memory
          path: research-memory
      - uses: actions/checkout@v7
        with:
          ref: main
          path: source-code
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: plenum-public-world-horizon-evidence
          path: reports/
      - name: Append bounded, explicitly public read-only records
        env:
          RUN_ID: ${{ github.run_id }}
          GIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          snapshot=json.loads(Path("reports/world_horizon.json").read_text())
          assert snapshot["schema"]=="plenum-public-horizon-snapshot-v1"
          assert not snapshot["independent_breakthrough_verified"]
          assert not snapshot["AGI_achieved"]
          assert snapshot["providers_attempted"]<=32
          assert len(snapshot["records"])<=128
          assert all(r["untrusted_external_content"] for r in snapshot["records"])
          date=datetime.now(timezone.utc).strftime("%Y-%m-%d")
          file=Path("research-memory/evidence/world-horizon")/(
              date+"-run-"+os.environ["RUN_ID"]+".json")
          file.parent.mkdir(parents=True,exist_ok=True)
          if file.exists(): raise FileExistsError("Do not replace earlier discovery evidence")
          report={
              "schema":"plenum-public-world-intelligence-archive-v1",
              "run_id":os.environ["RUN_ID"],
              "source_revision":os.environ["GIT_SHA"],
              "unverified_public_records":snapshot,
              "trusted_instructions_from_sources":False,
              "automatic_code_or_model_changes":False,
              "private_data_accessed":False,
          }
          file.write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n")
          print("Wrote one bounded public snapshot to:",file)
          PY
      - name: Archive new-to-us scientific signals from the SAME daily scan
        env:
          RUN_ID: ${{ github.run_id }}
          REVISION: ${{ github.sha }}
        run: |
          PYTHONPATH=source-code/src python - <<'PY'
          from plenum_ai.lab_radar import summarize,update_seen,INDEX_SCHEMA
          from pathlib import Path
          import json,os
          snapshot=json.loads(Path("reports/world_horizon.json").read_text())
          directory=Path("research-memory/evidence/lab-radar")
          directory.mkdir(parents=True,exist_ok=True)
          history=directory/"seen-links.json"
          if history.exists():
              previous=json.loads(history.read_text())
              assert previous["schema"]==INDEX_SCHEMA
              old=previous["urls"]
          else:
              old=None
          digest=summarize(snapshot,old)
          assert not digest["AGI_demonstrated"]
          assert not digest["independent_laboratory_breakthrough_verified"]
          dest=directory/("run-"+os.environ["RUN_ID"]+".json")
          if dest.exists(): raise FileExistsError("Never replace source-linked history")
          dest.write_text(json.dumps({"schema":"plenum-public-lab-radar-evidence-v1",
             "run_id":os.environ["RUN_ID"],"source_revision":os.environ["REVISION"],
             "public_metadata_digest":digest,"automatic_code_or_model_changes":False},
             indent=2,ensure_ascii=False)+"\n")
          history.write_text(json.dumps({"schema":INDEX_SCHEMA,
                               "urls":update_seen(old,snapshot)},indent=2)+"\n")
          assert json.loads(dest.read_text())["schema"]=="plenum-public-lab-radar-evidence-v1"
          assert json.loads(history.read_text())["schema"]==INDEX_SCHEMA
          print("New public links:",digest["new_public_links_before_limit"])
          print("Source outages:",digest["source_outages"])
          PY
      - name: Save evidence on research-memory, never modify main
        run: |
          git -C research-memory config user.name "Plenum Public Intelligence Ledger"
          git -C research-memory config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C research-memory add evidence/world-horizon/ evidence/lab-radar/
          git -C research-memory commit -m "Archive public worldwide research and incremental lab radar"
          git -C research-memory pull --rebase origin research-memory
          git -C research-memory push origin HEAD:research-memory

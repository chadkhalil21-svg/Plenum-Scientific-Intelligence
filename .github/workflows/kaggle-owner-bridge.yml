name: Prometheus Kaggle Owner-Approved Notebook Access
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Read or write only the approved Prometheus notebook"
        required: true
        type: choice
        default: verify
        options:
          - verify
          - list
          - read
          - status
          - write-draft
      kernel_ref:
        description: "owner/notebook-slug; write-draft only permits plenum-prometheus-qwen-trial"
        required: false
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: kaggle-owner-approved
  cancel-in-progress: false
jobs:
  kaggle-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: kaggle-access
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install official Kaggle CLI
        run: python -m pip install kaggle==2.2.4
      - name: Execute an explicitly chosen owner notebook operation
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_OPERATION: ${{ inputs.operation }}
          KAGGLE_KERNEL_REF: ${{ inputs.kernel_ref }}
        run: |
          python scripts/kaggle_bridge.py --mode "$KAGGLE_OPERATION" --kernel-ref "$KAGGLE_KERNEL_REF"

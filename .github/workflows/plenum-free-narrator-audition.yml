name: Plenum Studio | Free Local Narrator Audition
on:
  push:
    paths:
      - 'src/plenum_ai/voice_audition.py'
      - 'fixtures/terra_voice_audition.txt'
      - '.github/workflows/plenum-free-narrator-audition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-voices:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only locally running open-source speech components
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check 'kokoro-onnx==0.6.1' 'soundfile==0.13.1'
      - name: Download and hash-verify upstream permissively licensed CPU model and voices
        run: |
          mkdir -p /tmp/plenum-kokoro
          curl --fail --location --retry 2 --max-time 180 \
            'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx' \
            -o /tmp/plenum-kokoro/model.onnx
          curl --fail --location --retry 2 --max-time 120 \
            'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin' \
            -o /tmp/plenum-kokoro/voices.bin
          echo 'ae315a79b623f244700e4afb9246c46a26066782e049ba174bf3ba433970ee9c  /tmp/plenum-kokoro/model.onnx' | sha256sum -c -
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  /tmp/plenum-kokoro/voices.bin' | sha256sum -c -
      - name: Generate exactly two original-science English voice auditions locally
        run: |
          python -m plenum_ai.voice_audition \
            --text-file fixtures/terra_voice_audition.txt \
            --model /tmp/plenum-kokoro/model.onnx \
            --voices /tmp/plenum-kokoro/voices.bin \
            --out-dir reports/voice-audition
      - name: Verify real playable WAV headers and independently unapproved status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from plenum_ai.voice_audition import audit_wav
          folder = Path('reports/voice-audition')
          manifest = json.loads((folder/'audition_manifest.json').read_text())
          assert manifest['paid_inference_used'] is False
          assert manifest['naturalness_independently_verified'] is False
          assert manifest['commercial_voice_rights_independently_verified'] is False
          assert manifest['founder_approval_for_film_release'] is False
          assert set(x['voice'] for x in manifest['tracks']) == {'am_michael','af_sarah'}
          for item in manifest['tracks']:
              checked = audit_wav(folder/item['path'])
              assert checked['file_sha256'] == item['file_sha256']
              print(item['voice'], checked['duration_seconds'], 'seconds of genuine audio')
          PY
      - name: Retain WAV auditions for founder listening, not public distribution
        uses: actions/upload-artifact@v4
        with:
          name: plenum-free-narrator-auditions
          path: reports/voice-audition/
          retention-days: 7
          if-no-files-found: error

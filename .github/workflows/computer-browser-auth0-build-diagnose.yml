name: Diagnose Failed Owner Browser Cloud Build (Read Only)
on:
  issues:
    types: [opened]
permissions:
  contents: read
  id-token: write
  issues: write
jobs:
  diagnose:
    if: >-
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      github.event.issue.user.login == 'chadkhalil21-svg' &&
      github.event.issue.title == 'Computer Browser: diagnose failed Auth0 MCP build' &&
      github.event.issue.body == 'DIAGNOSE_AUTH0_MCP_BUILD_a6ef98ff:2026-11-08'
    environment: computer-browser-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_BROWSER_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Isolate live anonymous Upgrade and exact-image signed-session transport
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GCP_PROJECT_ID" = 'plenum-computer-browser'
          IMAGE="$(gcloud run services describe plenum-browser-owner-auth0 --project="$GCP_PROJECT_ID" --region=us-east1 --format='value(spec.template.spec.containers[0].image)')"
          case "$IMAGE" in
            "us-east1-docker.pkg.dev/$GCP_PROJECT_ID/plenum-browser/browser-auth0-owner:"*) ;;
            *) echo "Unexpected existing owner image"; exit 1 ;;
          esac
          echo "PUBLIC_OWNER_IMAGE_REFERENCE=$IMAGE"
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet >/dev/null
          docker pull "$IMAGE" >/dev/null
          # ONE anonymous production protocol probe; no owner cookie, headers,
          # target site credentials, runtime env, vault, provider token or AI.
          timeout 30 docker run --rm -i --read-only --tmpfs /tmp --entrypoint python "$IMAGE" - <<'PY'
          import asyncio
          import websockets
          from websockets.exceptions import InvalidStatus
          async def probe():
              try:
                  async with websockets.connect(
                      "wss://plenum-browser-owner-auth0-2lak3vl73q-ue.a.run.app/owner/live?site=https%3A%2F%2Fexample.com",
                      origin="https://plenum-browser-owner-auth0-2lak3vl73q-ue.a.run.app",
                      open_timeout=20,close_timeout=2):
                      print("LIVE_ANONYMOUS_WEBSOCKET_UNEXPECTEDLY_ACCEPTED",flush=True)
                      raise SystemExit(1)
              except InvalidStatus as exc:
                  code=exc.response.status_code
                  print("LIVE_ANONYMOUS_UPGRADE_HTTP_STATUS",code,flush=True)
                  if code!=403:
                      raise SystemExit(1)
              except Exception as exc:
                  print("LIVE_ANONYMOUS_TRANSPORT_EXCEPTION_CLASS",type(exc).__name__,flush=True)
                  raise SystemExit(1)
          asyncio.run(probe())
          PY
          # Exact app + real Uvicorn + real signed Auth0 fixture cookie +
          # actual Chromium frame, entirely isolated, no external networking.
          timeout 90 docker run --rm -i --network none --read-only --tmpfs /tmp --entrypoint python "$IMAGE" - <<'PY'
          import asyncio,base64,json,os,socket,subprocess,sys,time
          import websockets
          from itsdangerous import TimestampSigner
          from urllib.request import Request,urlopen
          origin="https://plenum-browser-owner-auth0-2lak3vl73q-ue.a.run.app"
          os.environ.update({
              "K_SERVICE":"plenum-browser-owner-auth0",
              "COMPUTER_BROWSER_TOKEN":"synthetic-isolated-fixture-material-"+"a"*32,
              "AUTH0_OWNER_CLIENT_ID":"SyntheticFixtureClient123",
              "AUTH0_OWNER_PUBLIC_ORIGIN":origin,
              "BROWSER_PUBLIC_ORIGIN":origin,
              "BROWSER_ALLOWED_ORIGINS":"https://example.com",
              "COMPUTER_BROWSER_CI_ONLY":"true"})
          from services.computer_browser.owner_auth0 import _session_secret
          now=int(time.time())
          record={"plenum_auth0_owner_v1":{"owner":"a"*64,"iat":now-2,"exp":now+120}}
          signed=TimestampSigner(_session_secret()).sign(base64.b64encode(json.dumps(record).encode())).decode()
          cookie="__Host-plenum_browser_owner="+signed
          server=subprocess.Popen([sys.executable,"-m","uvicorn","services.computer_browser.api:app",
              "--host","127.0.0.1","--port","8099","--log-level","critical","--no-access-log"],
              stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          async def run():
              for tick in range(75):
                  try:
                      with socket.create_connection(("127.0.0.1",8099),timeout=.2):
                          break
                  except OSError:
                      if server.poll() is not None:
                          print("ISOLATED_APP_STARTUP_FAILED",flush=True)
                          raise SystemExit(1)
                      await asyncio.sleep(.2)
              with urlopen(Request("http://127.0.0.1:8099/owner",headers={"Cookie":cookie}),timeout=5) as response:
                  print("ISOLATED_SIGNED_OWNER_HTTP_STATUS",response.status,flush=True)
                  assert response.status==200
              try:
                  async with websockets.connect(
                      "ws://127.0.0.1:8099/owner/live?site=https%3A%2F%2Fexample.com%2F&demo=1",
                      origin=origin,additional_headers={"Cookie":cookie},
                      open_timeout=10,close_timeout=2,max_size=2_000_000) as ws:
                      print("ISOLATED_SIGNED_OWNER_UPGRADE_ACCEPTED",flush=True)
                      for tick in range(4):
                          message=json.loads(await asyncio.wait_for(ws.recv(),25))
                          if message.get("failure"):
                              print("ISOLATED_FIXED_FAILURE",message.get("code","not-classified"),flush=True)
                              raise SystemExit(1)
                          if message.get("type")=="frame":
                              print("ISOLATED_REAL_CHROMIUM_FRAME_BYTES",len(message["image"]),flush=True)
                              await ws.send(json.dumps({"type":"close"}))
                              return
                      raise SystemExit(1)
              except Exception as exc:
                  print("ISOLATED_SIGNED_TRANSPORT_EXCEPTION_CLASS",type(exc).__name__,flush=True)
                  raise SystemExit(1)
          try:
              asyncio.run(run())
          finally:
              server.terminate()
              server.wait(timeout=8)
          PY
      - name: Inspect only fixed failed build metadata and sanitized Cloud Logging records
        id: inspect
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GCP_PROJECT_ID" = 'plenum-computer-browser'
          umask 077
          trap 'rm -f "$RUNNER_TEMP/mcp-build.json" "$RUNNER_TEMP/mcp-build-logs.json" "$RUNNER_TEMP/mcp-build-log-errors"' EXIT
          gcloud builds describe a6ef98ff-62ea-44ec-9965-887087494380 \
            --project="$GCP_PROJECT_ID" --region=us-east1 \
            --format=json > "$RUNNER_TEMP/mcp-build.json"
          if ! gcloud logging read \
            'resource.type="build" AND resource.labels.build_id="a6ef98ff-62ea-44ec-9965-887087494380"' \
            --project="$GCP_PROJECT_ID" --limit=200 --format=json \
            > "$RUNNER_TEMP/mcp-build-logs.json" 2> "$RUNNER_TEMP/mcp-build-log-errors"; then
            echo 'Unable to retrieve Cloud Logging details with existing deployer permissions.'
            printf 'LOG_READ_UNAVAILABLE\n' > "$RUNNER_TEMP/mcp-build-logs.json"
          fi
          python - <<'PY'
          import json,os,re
          root=os.environ["RUNNER_TEMP"]
          build=json.load(open(root+"/mcp-build.json"))
          assert build.get("id")=="a6ef98ff-62ea-44ec-9965-887087494380"
          assert build.get("status")=="FAILURE"
          print("Build status: FAILURE; step 0: "+str(build.get("steps",[{}])[0].get("status","unknown")))
          raw=open(root+"/mcp-build-logs.json").read()
          if raw=="LOG_READ_UNAVAILABLE\n":
              label="CLOUD_LOGS_UNAVAILABLE"
          else:
              try:
                  records=json.loads(raw)
              except json.JSONDecodeError:
                  records=[]
              chunks=[]
              for record in records:
                  chunks.append(str(record.get("textPayload","")))
                  chunks.append(str(record.get("jsonPayload",{}).get("message","")))
              message="\n".join(chunks).lower()
              if "unknown instruction" in message or "dockerfile parse error" in message or "heredoc" in message:
                  label="DOCKERFILE_PARSER_OR_HEREDOC"
              elif "failed to solve" in message or "failed to compute cache key" in message or "copy failed" in message:
                  label="DOCKERFILE_BUILD_CONTEXT_OR_COPY"
              elif "no matching distribution" in message or "could not find a version" in message or "pip install" in message and "error" in message:
                  label="PYTHON_DEPENDENCY_RESOLUTION"
              elif "permission denied" in message or "unauthorized" in message:
                  label="BUILD_PERMISSION"
              elif "timed out" in message or "network is unreachable" in message or "temporary failure" in message:
                  label="BUILD_NETWORK"
              elif not records:
                  label="CLOUD_LOGS_EMPTY"
              else:
                  label="OTHER_BUILD_STEP_ERROR"
          print("SANITIZED_FAILURE_CATEGORY="+label)
          # Emit only fixed dependency/exception diagnostics from public source builds.
          if label != "CLOUD_LOGS_UNAVAILABLE":
              safe=[]
              for chunk in chunks:
                  for line in chunk.splitlines():
                      if any(marker in line for marker in (
                          "ResolutionImpossible", "The conflict is caused by:",
                          " depends on ", "No matching distribution found",
                          "Could not find a version that satisfies",
                          "AssertionError", "ModuleNotFoundError", "ImportError"
                      )):
                          if not re.search(r"https?://|token|password|credential|secret|bearer|authorization",line,re.I):
                              safe.append(re.sub(r"[^A-Za-z0-9 .,:;_=/()<>!+\\[\\]'-]","?",line)[:240])
              for line in safe[:16]:
                  print("PUBLIC_BUILD_DIAGNOSTIC="+line)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("category="+label+"\n")
          PY
          echo "Read-only build diagnosis complete, no IAM changes or deployments."
      - name: Post only non-sensitive failure classification to owner issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CATEGORY: ${{ steps.inspect.outputs.category }}
        shell: bash
        run: |
          set -euo pipefail
          case "$CATEGORY" in
            DOCKERFILE_PARSER_OR_HEREDOC|DOCKERFILE_BUILD_CONTEXT_OR_COPY|PYTHON_DEPENDENCY_RESOLUTION|BUILD_PERMISSION|BUILD_NETWORK|CLOUD_LOGS_EMPTY|CLOUD_LOGS_UNAVAILABLE|OTHER_BUILD_STEP_ERROR) ;;
            *) CATEGORY="DIAGNOSTIC_UNAVAILABLE" ;;
          esac
          gh issue comment "$ISSUE_NUMBER" --body "Owner Browser Cloud Build a6ef98ff read-only failure classification: $CATEGORY. No public service, browser action, IAM grants, or Cloud Run changes performed."

name: Diagnose Failed Owner Browser Cloud Build (Read Only)
on:
  issues:
    types: [opened]
permissions:
  contents: read
  id-token: write
  issues: write
jobs:
  diagnose:
    if: >-
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      github.event.issue.user.login == 'chadkhalil21-svg' &&
      github.event.issue.title == 'Computer Browser: diagnose failed Auth0 MCP build' &&
      github.event.issue.body == 'DIAGNOSE_AUTH0_MCP_BUILD_a6ef98ff:2026-11-08'
    environment: computer-browser-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_BROWSER_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect signed-out GitHub rendering with original exact request policy
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GCP_PROJECT_ID" = 'plenum-computer-browser'
          IMAGE="$(gcloud run services describe plenum-browser-owner-auth0 --project="$GCP_PROJECT_ID" --region=us-east1 --format='value(spec.template.spec.containers[0].image)')"
          case "$IMAGE" in
            "us-east1-docker.pkg.dev/$GCP_PROJECT_ID/plenum-browser/browser-auth0-owner:"*) ;;
            *) echo "Unexpected existing owner image"; exit 1 ;;
          esac
          echo "PUBLIC_OWNER_IMAGE_REFERENCE=$IMAGE"
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet >/dev/null
          docker pull "$IMAGE" >/dev/null
          # Only signed-out PUBLIC GitHub, ORIGINAL proxy/policy/Chromium.
          # Never forward host credentials, runtime env, vault or owner state.
          mkdir -p "$RUNNER_TEMP/public-render"
          timeout 160 docker run --rm -i --read-only --tmpfs /tmp --entrypoint python "$IMAGE" - > "$RUNNER_TEMP/public-render-raw.json" <<'PY'
          import asyncio,base64,json,collections,re
          from urllib.parse import urlsplit
          from playwright.async_api import async_playwright,TimeoutError
          from services.computer_browser.private_login import _allow_live_request
          from services.computer_browser.pinned_public_preview import PinnedOriginProxy
          primary="https://github.com"
          approved={primary,"https://github.githubassets.com","https://avatars.githubusercontent.com"}
          async def run():
              report={"public_only":True,"pages":[]}
              async with PinnedOriginProxy(primary,additional_origins=approved-{primary},
                      max_tunnels=16,max_tunnel_bytes=30_000_000,max_lifetime=180) as broker:
                  async with async_playwright() as p:
                      browser=await p.chromium.launch(headless=True,proxy={"server":f"http://127.0.0.1:{broker.port}"},
                          args=["--disable-background-networking","--disable-quic",
                                "--force-webrtc-ip-handling-policy=disable_non_proxied_udp"])
                      for label,url in (("home",primary),("login",primary+"/login")):
                          context=await browser.new_context(viewport={"width":1024,"height":720},
                              accept_downloads=False,service_workers="block",ignore_https_errors=False,permissions=[])
                          blocked=collections.Counter()
                          failed=collections.Counter()
                          errors=[]
                          async def route_request(route):
                              req=route.request
                              if _allow_live_request(url=req.url,method=req.method,resource_type=req.resource_type,
                                  primary=primary,approved=frozenset(approved)):
                                  await route.continue_()
                              else:
                                  parts=urlsplit(req.url)
                                  blocked[(parts.scheme+"://"+str(parts.hostname),req.method,req.resource_type)]+=1
                                  await route.abort()
                          await context.route("**/*",route_request)
                          await context.route_web_socket("**/*",lambda route:route.close())
                          page=await context.new_page()
                          page.on("pageerror",lambda error:errors.append(type(error).__name__))
                          page.on("requestfailed",lambda request:failed.update([
                              (urlsplit(request.url).hostname,request.resource_type,request.failure)]))
                          response=await page.goto(url,wait_until="domcontentloaded",timeout=25000)
                          try:
                              await page.wait_for_function(
                                  "() => Boolean(document.body && (document.body.innerText.trim().length || document.querySelector('input,button,a')))",
                                  timeout=8000)
                          except TimeoutError:
                              pass
                          state=await page.evaluate("""() => ({
                              title:document.title,
                              text:(document.body?.innerText||"").slice(0,600),
                              bodyCharacters:(document.body?.innerText||"").trim().length,
                              controls:document.querySelectorAll("input,button,textarea,select,a").length,
                              readyState:document.readyState
                          })""")
                          image=await page.screenshot(type="jpeg",quality=60,timeout=12000)
                          text=state["text"].lower()
                          challenge=any(term in text for term in (
                              "verify you are human","checking your browser",
                              "automated traffic","robot check","performing security verification"))
                          report["pages"].append({"label":label,"http_status":response.status if response else None,
                              "final_public_url":page.url,"state":state,"site_challenge":challenge,
                              "blocked_public_origins":[{"origin":k[0],"method":k[1],"type":k[2],"count":v} for k,v in sorted(blocked.items())],
                              "failed_requests":[{"host":k[0],"type":k[1],"reason":k[2],"count":v} for k,v in sorted(failed.items())],
                              "page_error_count":len(errors),"jpeg_base64":base64.b64encode(image).decode()})
                          await context.close()
                          if challenge:
                              break
                      await browser.close()
              print(json.dumps(report))
          asyncio.run(run())
          PY
          python - <<'PY'
          import os,json,base64
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          raw=root/"public-render-raw.json"
          report=json.loads(raw.read_text().splitlines()[-1])
          for page in report["pages"]:
              (root/"public-render"/(page["label"]+".jpg")).write_bytes(base64.b64decode(page.pop("jpeg_base64")))
          (root/"public-render"/"public-render-report.json").write_text(json.dumps(report,indent=2))
          raw.unlink()
          print("PUBLIC_SIGNED_OUT_RENDER_REPORT",json.dumps(report))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: original-public-github-rendering
          path: ${{ runner.temp }}/public-render/
          retention-days: 1
          if-no-files-found: error
      - name: Inspect only fixed failed build metadata and sanitized Cloud Logging records
        id: inspect
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GCP_PROJECT_ID" = 'plenum-computer-browser'
          umask 077
          trap 'rm -f "$RUNNER_TEMP/mcp-build.json" "$RUNNER_TEMP/mcp-build-logs.json" "$RUNNER_TEMP/mcp-build-log-errors"' EXIT
          gcloud builds describe a6ef98ff-62ea-44ec-9965-887087494380 \
            --project="$GCP_PROJECT_ID" --region=us-east1 \
            --format=json > "$RUNNER_TEMP/mcp-build.json"
          if ! gcloud logging read \
            'resource.type="build" AND resource.labels.build_id="a6ef98ff-62ea-44ec-9965-887087494380"' \
            --project="$GCP_PROJECT_ID" --limit=200 --format=json \
            > "$RUNNER_TEMP/mcp-build-logs.json" 2> "$RUNNER_TEMP/mcp-build-log-errors"; then
            echo 'Unable to retrieve Cloud Logging details with existing deployer permissions.'
            printf 'LOG_READ_UNAVAILABLE\n' > "$RUNNER_TEMP/mcp-build-logs.json"
          fi
          python - <<'PY'
          import json,os,re
          root=os.environ["RUNNER_TEMP"]
          build=json.load(open(root+"/mcp-build.json"))
          assert build.get("id")=="a6ef98ff-62ea-44ec-9965-887087494380"
          assert build.get("status")=="FAILURE"
          print("Build status: FAILURE; step 0: "+str(build.get("steps",[{}])[0].get("status","unknown")))
          raw=open(root+"/mcp-build-logs.json").read()
          if raw=="LOG_READ_UNAVAILABLE\n":
              label="CLOUD_LOGS_UNAVAILABLE"
          else:
              try:
                  records=json.loads(raw)
              except json.JSONDecodeError:
                  records=[]
              chunks=[]
              for record in records:
                  chunks.append(str(record.get("textPayload","")))
                  chunks.append(str(record.get("jsonPayload",{}).get("message","")))
              message="\n".join(chunks).lower()
              if "unknown instruction" in message or "dockerfile parse error" in message or "heredoc" in message:
                  label="DOCKERFILE_PARSER_OR_HEREDOC"
              elif "failed to solve" in message or "failed to compute cache key" in message or "copy failed" in message:
                  label="DOCKERFILE_BUILD_CONTEXT_OR_COPY"
              elif "no matching distribution" in message or "could not find a version" in message or "pip install" in message and "error" in message:
                  label="PYTHON_DEPENDENCY_RESOLUTION"
              elif "permission denied" in message or "unauthorized" in message:
                  label="BUILD_PERMISSION"
              elif "timed out" in message or "network is unreachable" in message or "temporary failure" in message:
                  label="BUILD_NETWORK"
              elif not records:
                  label="CLOUD_LOGS_EMPTY"
              else:
                  label="OTHER_BUILD_STEP_ERROR"
          print("SANITIZED_FAILURE_CATEGORY="+label)
          # Emit only fixed dependency/exception diagnostics from public source builds.
          if label != "CLOUD_LOGS_UNAVAILABLE":
              safe=[]
              for chunk in chunks:
                  for line in chunk.splitlines():
                      if any(marker in line for marker in (
                          "ResolutionImpossible", "The conflict is caused by:",
                          " depends on ", "No matching distribution found",
                          "Could not find a version that satisfies",
                          "AssertionError", "ModuleNotFoundError", "ImportError"
                      )):
                          if not re.search(r"https?://|token|password|credential|secret|bearer|authorization",line,re.I):
                              safe.append(re.sub(r"[^A-Za-z0-9 .,:;_=/()<>!+\\[\\]'-]","?",line)[:240])
              for line in safe[:16]:
                  print("PUBLIC_BUILD_DIAGNOSTIC="+line)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("category="+label+"\n")
          PY
          echo "Read-only build diagnosis complete, no IAM changes or deployments."
      - name: Post only non-sensitive failure classification to owner issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CATEGORY: ${{ steps.inspect.outputs.category }}
        shell: bash
        run: |
          set -euo pipefail
          case "$CATEGORY" in
            DOCKERFILE_PARSER_OR_HEREDOC|DOCKERFILE_BUILD_CONTEXT_OR_COPY|PYTHON_DEPENDENCY_RESOLUTION|BUILD_PERMISSION|BUILD_NETWORK|CLOUD_LOGS_EMPTY|CLOUD_LOGS_UNAVAILABLE|OTHER_BUILD_STEP_ERROR) ;;
            *) CATEGORY="DIAGNOSTIC_UNAVAILABLE" ;;
          esac
          gh issue comment "$ISSUE_NUMBER" --body "Owner Browser Cloud Build a6ef98ff read-only failure classification: $CATEGORY. No public service, browser action, IAM grants, or Cloud Run changes performed."

name: Private Cloud Run Browser Gateway Verification
on:
  pull_request:
    paths:
      - 'services/computer_browser/**'
      - 'tests/test_browser_session_crypto.py'
      - 'tests/test_browser_actions.py'
      - 'tests/test_computer_browser_iap.py'
      - 'tests/test_private_browser_profiles.py'
      - 'tests/test_browser_private_login.py'
      - 'tests/test_browser_owner_saved_session.py'
      - 'tests/test_computer_browser_gateway.py'
      - 'tests/test_computer_browser_deploy.py'
      - 'tests/test_programmatic_iap_probe.py'
      - 'tests/test_browser_route_diagnostic.py'
      - 'tests/test_iap_policy_audit.py'
      - 'tests/test_http_response_diagnostic.py'
      - 'tests/test_iam_machine_health.py'
      - 'tests/test_iam_machine_bootstrap.py'
      - 'tests/test_cloud_run_safe_health_route.py'
      - 'tests/test_iam_machine_health_release.py'
      - 'tests/test_iam_machine_public_read.py'
      - 'tests/test_chat_iam_browser_bridge.py'
      - '.github/workflows/chat-browser-machine-iam-public-fixture.yml'
      - '.github/workflows/computer-browser-iam-machine-read-release.yml'
      - '.github/workflows/computer-browser-iam-machine-health-release.yml'
      - '.github/workflows/computer-browser-iam-machine-route-probe.yml'
      - '.github/workflows/computer-browser-iam-machine-bootstrap.yml'
      - '.github/workflows/computer-browser-iam-machine-health.yml'
      - '.github/workflows/computer-browser-iap-health-probe.yml'
      - '.github/workflows/computer-browser-cloud-run-deploy.yml'
      - '.github/workflows/computer-browser-cloud-run-ci.yml'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'services/computer_browser/**'
      - 'tests/test_computer_browser_gateway.py'
      - 'tests/test_programmatic_iap_probe.py'
      - 'tests/test_browser_route_diagnostic.py'
      - 'tests/test_iap_policy_audit.py'
      - 'tests/test_http_response_diagnostic.py'
      - 'tests/test_iam_machine_health.py'
      - 'tests/test_iam_machine_bootstrap.py'
      - 'tests/test_cloud_run_safe_health_route.py'
      - 'tests/test_iam_machine_health_release.py'
      - 'tests/test_iam_machine_public_read.py'
      - 'tests/test_chat_iam_browser_bridge.py'
      - '.github/workflows/chat-browser-machine-iam-public-fixture.yml'
      - '.github/workflows/computer-browser-iam-machine-read-release.yml'
      - '.github/workflows/computer-browser-iam-machine-health-release.yml'
      - '.github/workflows/computer-browser-iam-machine-route-probe.yml'
      - '.github/workflows/computer-browser-iam-machine-bootstrap.yml'
      - '.github/workflows/computer-browser-iam-machine-health.yml'
      - '.github/workflows/computer-browser-iap-health-probe.yml'
      - '.github/workflows/computer-browser-cloud-run-ci.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install only existing browser engine and HTTP gateway
        run: |
          python -m pip install -e '.[browser,browser_secure]' fastapi==0.115.12 uvicorn==0.34.2 httpx==0.28.1 PyJWT[crypto]==2.10.1 python-multipart==0.0.20
          python -m playwright install --with-deps chromium
      - name: Verify auth, public origins, no remote writes and real local Chromium interactions
        env:
          COMPUTER_BROWSER_TOKEN: 'not-a-real-production-browser-secret-0123456789'
          BROWSER_ALLOWED_ORIGINS: https://example.com
        run: python -m unittest discover -s tests -p 'test_computer_browser_gateway.py' -v
      - name: Verify manual IAM-only cloud deployment safeguards
        run: python -m unittest discover -s tests -p 'test_computer_browser_deploy.py' -v
      - name: Verify separate IAM-only machine health service security
        run: python -m unittest discover -s tests -p 'test_iam_machine_health.py' -v
      - name: Verify owner-gated machine runtime account bootstrap policy
        run: python -m unittest discover -s tests -p 'test_iam_machine_bootstrap.py' -v
      - name: Verify Cloud Run-safe health and read-only machine route probe
        run: python -m unittest discover -s tests -p 'test_cloud_run_safe_health_route.py' -v
      - name: Validate immutable IAM machine /health release and no-public-access controls
        run: python -m unittest discover -s tests -p 'test_iam_machine_health_release.py' -v
      - name: Verify fixed public fixture private IAM machine read has strict scope
        run: python -m unittest discover -s tests -p 'test_iam_machine_public_read.py' -v
      - name: Verify owner-only chat-to-private IAM public browser bridge policy
        run: python -m unittest discover -s tests -p 'test_chat_iam_browser_bridge.py' -v
      - name: Verify owner-approved programmatic IAP health probe without cloud access
        run: python -m unittest discover -s tests -p 'test_programmatic_iap_probe.py' -v
      - name: Verify 404 route metadata classifier and safe workflow
        run: python -m unittest discover -s tests -p 'test_browser_route_diagnostic.py' -v
      - name: Verify precise IAP resource policy audit without changing access
        run: python -m unittest discover -s tests -p 'test_iap_policy_audit.py' -v
      - name: Test redacted IAP HTTP differential classification
        run: python -m unittest discover -s tests -p 'test_http_response_diagnostic.py' -v
      - name: Test encrypted owner-scoped Playwright browser state restoration
        run: python -m unittest discover -s tests -p 'test_browser_session_crypto.py' -v
      - name: Verify encrypted cloud profile storage without real credentials
        run: python -m unittest discover -s tests -p 'test_private_browser_profiles.py' -v
      - name: Verify actual offline multi-step Chromium clicks forms and uploads
        run: python -m unittest discover -s tests -p 'test_browser_actions.py' -v
      - name: Verify owner IAP signing and private console identity boundaries
        run: python -m unittest discover -s tests -p 'test_computer_browser_iap.py' -v
      - name: Verify IAP owner interactive Chromium and site-scoped cookie privacy
        run: python -m unittest discover -s tests -p 'test_browser_private_login.py' -v
      - name: Verify signed-owner saved-session preview and revocation endpoints
        run: python -m unittest discover -s tests -p 'test_browser_owner_saved_session.py' -v
      - name: Verify real on-demand public navigation with actual Chromium
        run: |
          python - <<'PY'
          import asyncio
          from services.computer_browser.engine import read_public
          x=asyncio.run(read_public("https://example.com/"))
          assert x["status"]==200 and x["title_untrusted"]=="Example Domain"
          assert x["external_site_changed"] is False
          assert x["AGI_demonstrated"] is False
          print("Real public browser navigation: PASS")
          PY
      - name: Build independent Cloud Run container without deploying or billing
        run: docker build -t plenum-browser-ci -f services/computer_browser/Dockerfile .
      - name: Smoke-test container health and unauthorized request rejection
        run: |
          docker run -d --name browser-ci -p 18080:8080 plenum-browser-ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18080/healthz > /tmp/browser-health.json; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json, urllib.request, urllib.error
          d=json.load(open("/tmp/browser-health.json"))
          assert d["ready"] and not d["remote_mutations_enabled"]
          req=urllib.request.Request("http://localhost:18080/v1/plan",
                  data=b'{"url":"https://example.com/"}',
                  headers={"Content-Type":"application/json"},method="POST")
          try: urllib.request.urlopen(req)
          except urllib.error.HTTPError as x: assert x.code==401
          else: raise AssertionError("Unauthenticated browser gateway accepted POST")
          print("Production container auth fail-closed: PASS")
          PY
      - if: always()
        run: docker rm -f browser-ci || true

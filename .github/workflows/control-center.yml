name: Plenum Research Control Center
on:
  push:
    paths:
      - '.github/workflows/control-center.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: "Select one approved public research operation"
        type: choice
        required: true
        options:
          - science
          - knowledge
          - licensed-article
          - durable-investigation
          - verify
          - ecosystem
          - molecular-dynamics
          - discovery
          - creative
          - youtube
      question:
        description: "PUBLIC research question only. Do not enter patent or private data."
        required: true
        default: "Open scientific research on aerospace and materials"
      channel_id:
        description: "Public YouTube UC channel ID, or nasa"
        required: false
        default: "nasa"
      pmcid:
        description: "Europe PMC open-access identifier (only used for licensed-article)"
        required: false
        default: "PMC12247565"
permissions:
  contents: read
concurrency:
  group: plenum-console-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  approved-operation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TASK: ${{ github.event.inputs.operation || 'science' }}
      QUESTION: ${{ github.event.inputs.question || 'Evaluate orbit and thermal cooling' }}
      PMCID: ${{ github.event.inputs.pmcid || 'PMC12247565' }}
      CHANNEL_ID: ${{ github.event.inputs.channel_id || 'nasa' }}
      LANGGRAPH_STRICT_MSGPACK: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Read already archived verified public research memory
        uses: actions/checkout@v7
        with:
          ref: research-memory
          path: prior-knowledge
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install only the tools required by the chosen operation
        run: |
          case "$TASK" in
            science|durable-investigation) python -m pip install -e ".[science,orchestration]" ;;
            knowledge|licensed-article) python -m pip install -e . ;;
            verify) python -m pip install -e ".[science,ml,orchestration,astronomy,empirical]" ;;
            ecosystem) python -m pip install -e . ;;
            discovery|creative|youtube) python -m pip install -e . ;;
            molecular-dynamics) python -m pip install -e ".[dynamics]" ;;
            *) echo "Unapproved operation"; exit 1 ;;
          esac
      - name: Execute the approved operation without autonomous code or deployment
        shell: bash
        run: |
          mkdir -p reports
          case "$TASK" in
            science)
              plenum parallel-research --auto --query "$QUESTION" --out reports/science.json
              ;;
            knowledge)
              plenum import-public-memory --dir prior-knowledge/memory/entries \
                --db reports/library.sqlite --out reports/memory_restored.json
              plenum index-literature --query "$QUESTION" --online --global-sources --db reports/library.sqlite --out reports/ingestion.json
              plenum search-knowledge --query "$QUESTION" --db reports/library.sqlite --out reports/citations.json
              ;;
            licensed-article)
              plenum index-open-article --pmcid "$PMCID" --db reports/library.sqlite --out reports/oa.json
              plenum search-knowledge --query "research scientific" --db reports/library.sqlite --out reports/citations.json
              ;;
            durable-investigation)
              plenum durable-research --query "$QUESTION" \
                --thread-id "control-${{ github.run_id }}" \
                --db reports/checkpoints.sqlite --out reports/durable.json
              plenum durable-state --thread-id "control-${{ github.run_id }}" \
                --db reports/checkpoints.sqlite --out reports/restored.json
              ;;
            ecosystem)
              plenum scientific-ecosystem --out reports/scientific_ecosystem.json
              ;;
            molecular-dynamics)
              plenum openmm-reference --steps 100 --out reports/molecular_dynamics.json
              ;;
            discovery)
              plenum discovery-pulse --topic "$QUESTION" --out reports/discovery_pulse.json
              ;;
            youtube)
              plenum youtube-updates --channel "$CHANNEL_ID" --out reports/youtube_updates.json
              ;;
            creative)
              plenum creative-sources --query "$QUESTION" --out reports/creative_sources.json
              plenum creative-studio --topic "$QUESTION" --seed 1701 --dir reports/creative_studio --out reports/creative_studio.json
              ;;
            verify)
              python -m unittest discover -s tests -v
              ;;
          esac
      - name: Check evidence status and never authorize production changes
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          task=os.environ["TASK"]
          if task=="ecosystem":
              r=json.loads(Path("reports/scientific_ecosystem.json").read_text())
              assert r["all_external_execution_approved"] is False
              assert r["published_api_keys_exposed"] is False
          if task=="molecular-dynamics":
              r=json.loads(Path("reports/molecular_dynamics.json").read_text())
              assert r["numerical_fixture_passed"] and r["relative_total_energy_drift"] < 0.01
              assert not r["protein_dynamics_validated"]
          if task=="discovery":
              r=json.loads(Path("reports/discovery_pulse.json").read_text())
              assert not r["breakthroughs_independently_confirmed"]
              assert not r["video_transcripts_downloaded"]
          if task=="youtube":
              r=json.loads(Path("reports/youtube_updates.json").read_text())
              assert r["metadata_only"] and not r["videos_downloaded"]
          if task=="creative":
              r=json.loads(Path("reports/creative_studio.json").read_text())
              assert r["created_from_algorithm"] and not r["copied_copyrighted_music_or_art"]
              assert Path(r["outputs"]["artwork_svg"]).is_file()
              assert Path(r["outputs"]["score_musicxml"]).is_file()
          if task=="science":
              r=json.loads(Path("reports/science.json").read_text())
              assert not r["scientific_discovery_verified"]
              assert not r["external_execution_enabled"]
          elif task=="knowledge":
              r=json.loads(Path("reports/ingestion.json").read_text())
              print("Literature metadata indexed:",r["metadata_records_indexed"])
              assert not r["fulltext_added"]
          elif task=="licensed-article":
              r=json.loads(Path("reports/oa.json").read_text())
              assert r["indexed"] and not r["scientific_claims_verified"]
          elif task=="durable-investigation":
              r=json.loads(Path("reports/restored.json").read_text())
              assert r["finished"] and r["replayed_without_running_tools"]
          print("Public research command complete:",task)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plenum-public-research-console
          path: reports/
          retention-days: 14
          if-no-files-found: warn

name: Paperclip import and entrypoint gate
on:
  pull_request:
permissions:
  contents: read
jobs:
  paperclip-import-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Import all five divisions, exercise eleven role profiles and memory boundary
        env:
          PYTHONPATH: src
        run: python integrations/paperclip/import_smoke.py
      - name: Test bounded checkpoint and failure recovery
        run: python integrations/paperclip/checkpoint_smoke.py
      - name: Verify isolated runtime checkpoint authorization and CAS
        run: node --test integrations/cloudflare/plenum-paperclip-checkpoint.test.mjs integrations/cloudflare/plenum-private-continuity.test.mjs
      - name: Minister task discovery and sanitized failure-artifact regressions
        env:
          PYTHONPATH: src
        run: python integrations/paperclip/minister_smoke.py
      - name: Bounded local-model plan and immutable receipt regressions
        run: python integrations/paperclip/model_plan_smoke.py

name: Paperclip import and entrypoint gate
on:
  pull_request:
permissions:
  contents: read
jobs:
  paperclip-import-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Import all five divisions, exercise eleven role profiles and memory boundary
        env:
          PYTHONPATH: src
        run: python integrations/paperclip/import_smoke.py

name: Parallel Scientific Tools and NASA OpenMDAO
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Public research question only; no unpublished inventions"
        required: true
        default: "Evaluate orbital mechanics, thermal cooling, kinetics, and molecules"
  push:
    paths:
      - ".github/workflows/parallel-tools.yml"
      - "src/plenum_ai/parallel_research.py"
      - "src/plenum_ai/tool_registry.py"
      - "src/plenum_ai/openmdao_adapter.py"
      - "tests/test_parallel_research.py"
permissions:
  contents: read
concurrency:
  group: verified-scientific-parallel-network
  cancel-in-progress: true
jobs:
  verified-network:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned LangGraph and OpenMDAO and scientific dependencies
        run: python -m pip install -e ".[science,orchestration]"
      - name: Test independent parallel workers and dependent optimization
        run: python -m unittest discover -s tests -p "test_parallel_research.py" -v
      - name: Execute multiple scientific tools in a dependency-aware research network
        env:
          USER_QUERY: ${{ github.event.inputs.query }}
        shell: bash
        run: |
          if [ -z "$USER_QUERY" ]; then
            USER_QUERY="Evaluate orbital mechanics, thermal cooling, kinetics, and molecules"
          fi
          python -m plenum_ai.cli tool-registry --out reports/tool_registry.json
          python -m plenum_ai.cli parallel-research --query "$USER_QUERY" --out reports/parallel_research.json
          python -m plenum_ai.cli parallel-research --auto --query "Optimize cooling and electrical circuits for orbital motion" --out reports/auto_routed_research.json
      - name: Verify no untested scientific claims or automatic deployment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/parallel_research.json").read_text())
          assert r["parallel_tool_count"] == 4
          assert len(r["workers"]) == 4
          assert r["known_model_integration_passed"], r["verification"]
          assert r["dependent_optimization"]["verified_fixture"]
          assert not r["scientific_discovery_verified"]
          assert not r["model_inference_used"]
          assert not r["verification"]["production_code_modified_by_agents"]
          auto=json.loads(Path("reports/auto_routed_research.json").read_text())
          assert auto["known_model_integration_passed"], auto["verification"]
          assert auto["dependent_optimization"]["verified_fixture"]
          assert auto["routing"]["routing_method"] == "deterministic_allowlisted_keywords"
          assert not auto["routing"]["model_selected_tools"]
          print("Four independent tools, dependent OpenMDAO, and automatic routing verified.")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: multi-tool-scientific-evidence
          path: reports/
          retention-days: 14

name: Verify Computer Browser Programmatic IAP Health (No Deployment)
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
  id-token: write
  issues: write
concurrency:
  group: computer-browser-iap-health-only
  cancel-in-progress: false
jobs:
  iap-health-only:
    if: >-
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' &&
        github.event.issue.user.login == 'chadkhalil21-svg' &&
        github.event.issue.title == 'Computer Browser: verify programmatic IAP health' &&
        github.event.issue.body == 'VERIFY_IAP_HEALTH_ONLY:2026-11-07'))
    environment: computer-browser-production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Test the strictly scoped IAP health claim builder
        id: policy
        run: python -m unittest discover -s tests -p test_programmatic_iap_probe.py -v
      - name: Authenticate existing short-lived GitHub OIDC to Google
        id: gcp_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_BROWSER_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify private service metadata and write one bounded claim to scratch
        id: claim
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BROWSER_DEPLOY_SA: ${{ secrets.GCP_BROWSER_DEPLOY_SA }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GCP_PROJECT_ID" = "plenum-computer-browser"
          test -n "$BROWSER_DEPLOY_SA"
          SERVICE_URL="$(gcloud run services describe plenum-computer-browser --project="$GCP_PROJECT_ID" --region=us-east1 --format='value(status.url)')"
          export SERVICE_URL
          python -m services.computer_browser.programmatic_iap_probe \
            --cloud-run-url "$SERVICE_URL" --service-account "$BROWSER_DEPLOY_SA" \
            --claims-file "$RUNNER_TEMP/browser-iap-claims.json"
          echo "PASS: Cloud Run URL and non-secret scoped claim validated."
      - name: Diagnose Cloud Run ingress and URL metadata without changing security
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe plenum-computer-browser \
            --project="$GCP_PROJECT_ID" --region=us-east1 --format=json \
            > "$RUNNER_TEMP/browser-service-metadata.json"
          python -m services.computer_browser.route_diagnostic \
            "$RUNNER_TEMP/browser-service-metadata.json"
          rm -f "$RUNNER_TEMP/browser-service-metadata.json"
          echo "Read-only route metadata checked; no IAM or ingress changes."

      - name: Audit only exact IAP and Cloud Run service bindings (no changes)
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_NUMBER="$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectNumber)')"
          test -n "$PROJECT_NUMBER"
          IAP_FILE="$RUNNER_TEMP/exact-iap-policy.json"
          RUN_FILE="$RUNNER_TEMP/exact-run-policy.json"
          # Never echo raw policy documents containing user account names.
          if gcloud iap web get-iam-policy \
               --project="$GCP_PROJECT_ID" --resource-type=cloud-run \
               --region=us-east1 --service=plenum-computer-browser \
               --format=json > "$IAP_FILE" 2>/dev/null; then
            echo "PASS: IAP service-specific policy read."
          else
            rm -f "$IAP_FILE"
            echo "UNAVAILABLE: IAP service-specific policy could not be read."
          fi
          if gcloud run services get-iam-policy plenum-computer-browser \
               --project="$GCP_PROJECT_ID" --region=us-east1 \
               --format=json > "$RUN_FILE" 2>/dev/null; then
            echo "PASS: Cloud Run service-specific policy read."
          else
            rm -f "$RUN_FILE"
            echo "UNAVAILABLE: Cloud Run service-specific policy could not be read."
          fi
          args=(--project-number "$PROJECT_NUMBER")
          if [ -f "$IAP_FILE" ]; then args+=(--iap-policy "$IAP_FILE"); fi
          if [ -f "$RUN_FILE" ]; then args+=(--run-policy "$RUN_FILE"); fi
          python -m services.computer_browser.iap_policy_audit "${args[@]}"
          rm -f "$IAP_FILE" "$RUN_FILE"
          echo "Read-only IAM audit complete. No access grants changed."

      - name: Sign health-only JWT with Google IAMCredentials (never export a key)
        id: sign
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BROWSER_DEPLOY_SA: ${{ secrets.GCP_BROWSER_DEPLOY_SA }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! gcloud iam service-accounts sign-jwt \
                "$RUNNER_TEMP/browser-iap-claims.json" \
                "$RUNNER_TEMP/browser-iap.jwt" \
                --iam-account="$BROWSER_DEPLOY_SA" \
                --project="$GCP_PROJECT_ID" --quiet > /dev/null 2>&1; then
            echo "BLOCKED: the existing GitHub cloud identity lacks permission to sign a self-scoped JWT."
            echo "Owner may grant roles/iam.serviceAccountTokenCreator on only this target service account, never at project level."
            exit 1
          fi
          test -s "$RUNNER_TEMP/browser-iap.jwt"
          chmod 600 "$RUNNER_TEMP/browser-iap.jwt"
          echo "PASS: short-lived health-only service JWT signed without a key download."
      - name: Verify IAP permits programmatic private Cloud Run health only
        id: health
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe plenum-computer-browser --project="$GCP_PROJECT_ID" --region=us-east1 --format='value(status.url)')"
          export SERVICE_URL
          python - <<'PY'
          import os
          from services.computer_browser.programmatic_iap_probe import health_url
          assert health_url(os.environ["SERVICE_URL"]).endswith("/healthz")
          PY
          umask 077
          printf 'Proxy-Authorization: Bearer %s\n' "$(cat "$RUNNER_TEMP/browser-iap.jwt")" > "$RUNNER_TEMP/browser-iap-header"
          RESPONSE="$RUNNER_TEMP/browser-iap-response.json"
          STATUS="$(curl --silent --show-error --max-time 20 --proto '=https' \
            --header @"$RUNNER_TEMP/browser-iap-header" \
            --output "$RESPONSE" --write-out '%{http_code}' \
            "$SERVICE_URL/healthz" || true)"
          rm -f "$RUNNER_TEMP/browser-iap-claims.json" "$RUNNER_TEMP/browser-iap.jwt" "$RUNNER_TEMP/browser-iap-header"
          if [ "$STATUS" != "200" ]; then
            echo "BLOCKED: IAP programmatic health request returned HTTP $STATUS."
            echo "A 404 may mean restricted ingress, a disabled URL, missing route or an IAP problem."
            echo "Review the redacted route diagnostic above before changing IAM permissions."
            exit 1
          fi
          python -m services.computer_browser.programmatic_iap_probe \
            --health-response "$RESPONSE"
          rm -f "$RESPONSE"
          echo "No browser navigation, site login, writes, deployment, or secret values were used."

      - name: Post non-sensitive verification result to founder's GitHub issue
        if: always() && github.event_name == 'issues' && github.event.issue.user.login == 'chadkhalil21-svg'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
          POLICY_RESULT: ${{ steps.policy.outcome }}
          OIDC_RESULT: ${{ steps.gcp_auth.outcome }}
          CLAIM_RESULT: ${{ steps.claim.outcome }}
          SIGN_RESULT: ${{ steps.sign.outcome }}
          HEALTH_RESULT: ${{ steps.health.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            RESULT="PASS: Programmatic service-account IAP authentication reached the existing private Cloud Run /healthz endpoint. No website action was performed."
          elif [ "$POLICY_RESULT" != "success" ]; then
            RESULT="NOT VERIFIED: Offline IAP claim-policy test failed. No Google permissions or service access were attempted."
          elif [ "$OIDC_RESULT" != "success" ]; then
            RESULT="NOT VERIFIED: Existing GitHub-to-Google workload identity authentication failed. No Cloud Run request was attempted."
          elif [ "$CLAIM_RESULT" != "success" ]; then
            RESULT="NOT VERIFIED: Private Cloud Run service metadata or strict health claim validation failed. No signed request was attempted."
          elif [ "$SIGN_RESULT" != "success" ]; then
            RESULT="NOT VERIFIED: Google IAMCredentials could not sign the health JWT. Check self-scoped signJwt permission on only the existing GitHub service account."
          elif [ "$HEALTH_RESULT" != "success" ]; then
            RESULT="NOT VERIFIED: The signed Cloud Run health request failed. A 404 does not prove missing IAP permission; inspect the read-only routing diagnostic before any Google changes."
          else
            RESULT="NOT VERIFIED: Programmatic IAP health check did not complete. No deployment or private browser action occurred."
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$RESULT"

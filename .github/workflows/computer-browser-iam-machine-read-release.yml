name: Release IAM Machine Browser Stateless Public Read (Owner Approved)
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RELEASE_IAM_MACHINE_READ_APPROVED
        required: true
        type: string
permissions:
  contents: read
  id-token: write
  issues: write
concurrency:
  group: plenum-private-machine-browser-read-release
  cancel-in-progress: false
jobs:
  release-machine-public-read:
    if: >-
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      ((github.event_name == 'issues' &&
        github.event.issue.user.login == 'chadkhalil21-svg' &&
        github.event.issue.title == 'Computer Browser: release IAM machine public read' &&
        github.event.issue.body == 'RELEASE_IAM_MACHINE_READ_APPROVED:2026-11-08') ||
       (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RELEASE_IAM_MACHINE_READ_APPROVED'))
    environment: computer-browser-production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify machine guardrails and new safe health route without cloud access
        run: |
          python -m unittest discover -s tests -p 'test_iam_machine_health.py' -v
          python -m unittest discover -s tests -p 'test_cloud_run_safe_health_route.py' -v
          python -m unittest discover -s tests -p 'test_iam_machine_health_release.py' -v
          python -m unittest discover -s tests -p 'test_machine_public_read.py' -v
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_BROWSER_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Check exact existing IAM-private machine service and build prerequisites
        id: preflight
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BROWSER_DEPLOY_SA: ${{ secrets.GCP_BROWSER_DEPLOY_SA }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GCP_PROJECT_ID" = "plenum-computer-browser"
          test "$BROWSER_DEPLOY_SA" = "plenum-browser-deploy@plenum-computer-browser.iam.gserviceaccount.com"
          test -n "$GITHUB_SHA"
          grep -q '@app.get("/health")' services/computer_browser/api.py
          grep -q '@app.post("/machine/v1/read")' services/computer_browser/api.py
          umask 077
          trap 'rm -f "$RUNNER_TEMP/machine-before.json" "$RUNNER_TEMP/machine-policy-before.json"' EXIT
          gcloud run services describe plenum-computer-browser-machine \
            --project="$GCP_PROJECT_ID" --region=us-east1 \
            --format=json > "$RUNNER_TEMP/machine-before.json"
          gcloud run services get-iam-policy plenum-computer-browser-machine \
            --project="$GCP_PROJECT_ID" --region=us-east1 \
            --format=json > "$RUNNER_TEMP/machine-policy-before.json"
          python - <<'PY'
          import json,os
          from services.computer_browser.iam_machine_guard import verify_service,verify_service_iam
          root=os.environ["RUNNER_TEMP"]
          m=json.load(open(root+"/machine-before.json"))
          p=json.load(open(root+"/machine-policy-before.json"))
          actual=m["spec"]["template"]["spec"]["containers"][0]["image"]
          verify_service(m, expected_image=actual)
          verify_service_iam(p)
          print("PASS: Existing machine service and exact IAM policy approved; IAP owner service untouched.")
          PY
          # Reuse the already configured builder and dedicated staging bucket; never use the private session vault.
          PROJECT_NUMBER="$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectNumber)')"
          test "$PROJECT_NUMBER" = "98614162800"
          BUILD_SOURCE_BUCKET="$GCP_PROJECT_ID-build-source-$PROJECT_NUMBER"
          gcloud storage buckets describe "gs://$BUILD_SOURCE_BUCKET" \
            --project="$GCP_PROJECT_ID" --format='value(name)' >/dev/null
          gcloud iam service-accounts describe \
            "plenum-browser-builder@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --project="$GCP_PROJECT_ID" --format='value(email)' >/dev/null
          echo "PASS: Builder, source bucket and immutable existing machine release validated."
      - name: Build corrected browser container using dedicated Cloud Build identity
        id: build
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_NUMBER=98614162800
          IMAGE_REPOSITORY="us-east1-docker.pkg.dev/$GCP_PROJECT_ID/plenum-browser/computer-browser"
          IMAGE_TAG="$IMAGE_REPOSITORY:machine-health-$GITHUB_SHA"
          BUILD_SA="plenum-browser-builder@$GCP_PROJECT_ID.iam.gserviceaccount.com"
          BUILD_SOURCE_BUCKET="$GCP_PROJECT_ID-build-source-$PROJECT_NUMBER"
          gcloud builds submit . \
            --project="$GCP_PROJECT_ID" --region=us-east1 \
            --service-account="projects/$GCP_PROJECT_ID/serviceAccounts/$BUILD_SA" \
            --gcs-source-staging-dir="gs://$BUILD_SOURCE_BUCKET/source" \
            --config=services/computer_browser/cloudbuild.yaml \
            --substitutions="_IMAGE=$IMAGE_TAG" --quiet
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG" \
            --project="$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "BLOCKED: Cannot verify immutable Artifact Registry digest. Existing service unchanged."
            exit 1
          fi
          echo "image_ref=$IMAGE_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "PASS: Source image built and verified by immutable registry digest."
      - name: Update only machine service container image, preserving all security settings
        id: update
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          IMAGE_REF: ${{ steps.build.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_REF"
          case "$IMAGE_REF" in
            us-east1-docker.pkg.dev/plenum-computer-browser/plenum-browser/computer-browser@sha256:*) ;;
            *) echo "Blocked: unexpected registry path"; exit 1 ;;
          esac
          gcloud run services update plenum-computer-browser-machine \
            --project="$GCP_PROJECT_ID" --region=us-east1 \
            --image="$IMAGE_REF" --quiet > /dev/null
          echo "PASS: IAM-only machine service image updated. Existing IAP owner browser untouched."
      - name: Verify signed GET /health 200, anonymous refusal and unchanged exact IAM policy
        id: verify
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BROWSER_DEPLOY_SA: ${{ secrets.GCP_BROWSER_DEPLOY_SA }}
          IMAGE_REF: ${{ steps.build.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/machine-id" "$RUNNER_TEMP/machine-header" "$RUNNER_TEMP/machine-health.json" "$RUNNER_TEMP/machine-anon" "$RUNNER_TEMP/machine-after.json" "$RUNNER_TEMP/machine-policy-after.json" "$RUNNER_TEMP/machine-read.json" "$RUNNER_TEMP/machine-read-anon"' EXIT
          gcloud run services describe plenum-computer-browser-machine \
            --project="$GCP_PROJECT_ID" --region=us-east1 \
            --format=json > "$RUNNER_TEMP/machine-after.json"
          gcloud run services get-iam-policy plenum-computer-browser-machine \
            --project="$GCP_PROJECT_ID" --region=us-east1 \
            --format=json > "$RUNNER_TEMP/machine-policy-after.json"
          SERVICE_URL="$(gcloud run services describe plenum-computer-browser-machine \
            --project="$GCP_PROJECT_ID" --region=us-east1 --format='value(status.url)')"
          case "$SERVICE_URL" in
            https://plenum-computer-browser-machine-*.run.app) ;;
            *) echo "Unexpected machine service URL"; exit 1 ;;
          esac
          gcloud auth print-identity-token \
            --impersonate-service-account="$BROWSER_DEPLOY_SA" \
            --audiences="$SERVICE_URL" --include-email > "$RUNNER_TEMP/machine-id" 2>/dev/null
          test -s "$RUNNER_TEMP/machine-id"
          printf 'Authorization: Bearer %s\n' "$(cat "$RUNNER_TEMP/machine-id")" > "$RUNNER_TEMP/machine-header"
          SIGNED_STATUS="$(curl --silent --show-error --max-time 40 --proto '=https' \
            --header @"$RUNNER_TEMP/machine-header" \
            --output "$RUNNER_TEMP/machine-health.json" --write-out '%{http_code}' \
            "$SERVICE_URL/health" || true)"
          ANON_STATUS="$(curl --silent --show-error --max-time 20 --proto '=https' \
            --output "$RUNNER_TEMP/machine-anon" --write-out '%{http_code}' \
            "$SERVICE_URL/health" || true)"
          echo "Signed Cloud Run /health: HTTP $SIGNED_STATUS"
          echo "Anonymous Cloud Run /health: HTTP $ANON_STATUS"
          READ_STATUS="$(curl --silent --show-error --max-time 60 --proto '=https' \
            --header @"$RUNNER_TEMP/machine-header" \
            --header 'Content-Type: application/json' \
            --data-binary '{"url":"https://example.com/"}' \
            --output "$RUNNER_TEMP/machine-read.json" --write-out '%{http_code}' \
            "$SERVICE_URL/machine/v1/read" || true)"
          READ_ANON_STATUS="$(curl --silent --show-error --max-time 20 --proto '=https' \
            --header 'Content-Type: application/json' \
            --data-binary '{"url":"https://example.com/"}' \
            --output "$RUNNER_TEMP/machine-read-anon" --write-out '%{http_code}' \
            "$SERVICE_URL/machine/v1/read" || true)"
          echo "Signed POST /machine/v1/read: HTTP $READ_STATUS"
          echo "Anonymous POST /machine/v1/read: HTTP $READ_ANON_STATUS"
          test "$READ_STATUS" = "200"
          test "$READ_ANON_STATUS" != "200"
          python - "$RUNNER_TEMP/machine-read.json" "$READ_ANON_STATUS" <<'PY'
          import json,sys
          body=json.load(open(sys.argv[1]))
          assert body.get("schema")=="plenum-machine-public-read-v1"
          assert body.get("machine_private_transport") is True
          assert body.get("remote_mutations_enabled") is False
          assert body.get("authenticated_website_used") is False
          result=body.get("result",{})
          assert result.get("final_url")=="https://example.com/"
          assert result.get("status")==200
          assert result.get("external_site_changed") is False
          assert result.get("authenticated_site_used") is False
          assert int(sys.argv[2]) not in range(200,300)
          print("PASS: Real Playwright read of public example.com through private IAM Cloud Run, no remote writes or accounts.")
          PY
          test "$SIGNED_STATUS" = "200"
          python - "$RUNNER_TEMP/machine-after.json" "$RUNNER_TEMP/machine-policy-after.json" \
              "$RUNNER_TEMP/machine-health.json" "$ANON_STATUS" "$IMAGE_REF" <<'PY'
          import json,sys
          from services.computer_browser.iam_machine_guard import verify_service,verify_service_iam,verify_health
          metadata,policy,health,anon,image=sys.argv[1:]
          read=lambda p:json.load(open(p))
          verify_service(read(metadata),expected_image=image)
          verify_service_iam(read(policy))
          assert int(anon) not in range(200,300), "Anonymous Cloud Run invocation unexpectedly permitted"
          assert verify_health(read(health)), "Unexpected machine health body"
          print("PASS: Private IAM-only Cloud Run /health live, anonymous blocked, exact service identity and IAM verified.")
          PY
      - name: Return sanitized result to owner issue
        if: always() && github.event_name == 'issues' && github.event.issue.user.login == 'chadkhalil21-svg'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            RESULT="PASS: New immutable IAM machine image deployed; signed GET /health returned 200 and signed POST /machine/v1/read navigated with Playwright to public example.com and returned HTTP 200. Anonymous GET and POST denied. Runtime/IAM verified, IAP unchanged. No private accounts, sessions or website writes."
          elif [ "$PREFLIGHT_OUTCOME" != "success" ]; then
            RESULT="BLOCKED BEFORE BUILD: Existing IAM-only machine security preflight or private build configuration failed; no Cloud Run deployment."
          elif [ "$BUILD_OUTCOME" != "success" ]; then
            RESULT="BLOCKED BEFORE DEPLOYMENT: Cloud Build or immutable image digest verification failed; existing machine service preserved."
          elif [ "$UPDATE_OUTCOME" != "success" ]; then
            RESULT="NOT VERIFIED: Cloud Run image update did not complete. Inspect workflow details and service revision status."
          else
            RESULT="NOT VERIFIED: Image deployed, but private /health or scoped Playwright read verification failed; inspect logs, do not broaden access."
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$RESULT"

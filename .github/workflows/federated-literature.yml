name: Federated Scientific Literature
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Public scientific query only; no private or unpublished research"
        required: true
        default: "photonic memory computing"
  push:
    paths:
      - ".github/workflows/federated-literature.yml"
      - "src/plenum_ai/federated_sources.py"
      - "tests/test_federated_sources.py"
permissions:
  contents: read
jobs:
  federated-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install standard-library metadata adapters
        run: python -m pip install -e .
      - name: Test response parsing, rate-limit errors and DOI deduplication
        run: python -m unittest discover -s tests -p "test_federated_sources.py" -v
      - name: Concurrently search three public research indices
        env:
          RESEARCH_QUERY: ${{ github.event.inputs.query }}
        shell: bash
        run: |
          if [ -z "$RESEARCH_QUERY" ]; then
            RESEARCH_QUERY="photonic memory computing"
          fi
          python -m plenum_ai.cli federated-literature --query "$RESEARCH_QUERY" --online --out reports/federated_literature.json
      - name: Check that actual sources are shown without invented metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/federated_literature.json").read_text())
          assert len(r["providers"]) == 3
          assert not r["scientific_truth_verified"]
          healthy=[p for p in r["providers"] if p["status"]=="retrieved_metadata"]
          print("Successful provider searches:",len(healthy),"/3")
          print("Records found:",len(r["records"]))
          if not healthy:
              raise SystemExit("All public providers unavailable; do not claim a verified live search")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: federated-public-science-metadata
          path: reports/
          retention-days: 14

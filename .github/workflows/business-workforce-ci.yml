name: Business Workforce | OpenHands and n8n Offline Contracts
on:
  pull_request:
    paths:
      - 'src/plenum_ai/openhands_coding_agent.py'
      - 'tests/test_openhands_native_transfer.py'
      - 'integrations/hermes/quarantine/plenum-public-provider-boundary/SKILL.md'
      - 'src/plenum_ai/openhands_goldfish_review.py'
      - 'tests/test_business_workforce_integration.py'
      - 'tests/test_openhands_bounded_repair.py'
      - 'tests/test_openhands_goldfish_review.py'
      - 'tools/verify_original_openhands_candidate.py'
      - 'src/plenum_ai/noaa_revision_agent.py'
      - 'tests/acceptance/noaa_numeric_proposal.py'
      - 'integrations/n8n/plenum-business-workforce.json'
      - 'docs/BUSINESS_WORKFORCE.md'
      - '.github/workflows/business-workforce-ci.yml'
      - 'integrations/n8n/docker-compose.codespace.yml'
      - 'integrations/n8n/start-codespace-workforce.sh'
  push:
    branches: [main]
    paths:
      - 'src/plenum_ai/openhands_coding_agent.py'
      - 'tests/test_openhands_native_transfer.py'
      - 'integrations/hermes/quarantine/plenum-public-provider-boundary/SKILL.md'
      - 'src/plenum_ai/openhands_goldfish_review.py'
      - 'tests/test_business_workforce_integration.py'
      - 'integrations/n8n/plenum-business-workforce.json'
      - '.github/workflows/business-workforce-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLENUM_EPHEMERAL_RUNNER: ''
      PLENUM_OPENHANDS_API_KEY: ''
      PLENUM_OPENHANDS_MODEL: ''
      PLENUM_OPENHANDS_BASE_URL: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Plenum only (no model, no n8n server, no SDK)
        run: python -m pip install -e .
      - name: Test n8n import schema and owner guardrails
        run: python -m unittest discover -s tests -p 'test_business_workforce_integration.py' -v
      - name: Verify one bounded OpenHands syntax repair and fail-closed second failure
        run: python -m unittest discover -s tests -p 'test_openhands_bounded_repair.py' -v
      - name: Verify pinned Google Goldfish review of actual patch after sandbox functional gate
        run: python -m unittest discover -s tests -p 'test_openhands_goldfish_review.py' -v
      - name: Qualify real NOAA regression and frozen acceptance in dependency-complete offline sandbox
        run: |
          python - <<'PY'
          import os, runpy, shutil, subprocess, tempfile
          from pathlib import Path
          v = runpy.run_path("tools/verify_original_openhands_candidate.py")
          image = v["prepare_sandbox_image"](v["NOAA_SOURCE"])
          with tempfile.TemporaryDirectory(prefix="plenum-noaa-ci-") as tmp:
              root = Path(tmp)
              os.chmod(root, 0o755)
              shutil.copytree("src/plenum_ai", root / "src/plenum_ai")
              (root / "tests/acceptance").mkdir(parents=True)
              shutil.copy2("tests/test_noaa_revision_agent.py", root / "tests")
              shutil.copy2("tests/acceptance/noaa_numeric_proposal.py", root / "tests/acceptance")
              shutil.copy2("tests/acceptance/noaa_nested_response.py", root / "tests/acceptance")
              for directory, pattern in (
                  ("/work/tests", "test_noaa_revision_agent.py"),
                  ("/work/tests/acceptance", "noaa_numeric_proposal.py"),
              ):
                  command = v["sandbox_command"](root, image, directory, pattern)
                  result = subprocess.run(command, capture_output=True, text=True,
                                          timeout=150, check=False,
                                          env={"PATH": os.environ["PATH"], "HOME": "/tmp"})
                  print(result.stderr)
                  if result.returncode:
                      raise SystemExit("NOAA offline regression or acceptance failed")
                  if directory.endswith("/acceptance"):
                      assert "Ran 2 tests" in result.stderr
              print("PASS: actual NOAA offline focused and independent acceptance suites; no inference.")
          PY
      - name: Validate Codespaces startup syntax and private Docker Compose
        env:
          N8N_ENCRYPTION_KEY: disposable-test-placeholder-not-a-production-secret
        run: |
          bash -n integrations/n8n/start-codespace-workforce.sh
          docker compose -f integrations/n8n/docker-compose.codespace.yml config --quiet
      - name: Produce no-cost OpenHands configuration report
        run: python -m plenum_ai.openhands_coding_agent --out reports/openhands-agent-review.json
      - name: Verify no agent or side effects were falsely claimed
        run: |
          python - <<'PY'
          import json
          data=json.load(open('reports/openhands-agent-review.json'))
          assert data['status']=='CONFIGURATION_ONLY'
          assert data['human_review_required'] is True
          assert not data['model_run_completed']
          assert not data['production_written']
          assert not data['external_accounts_changed']
          print('PASS: n8n import contract + OpenHands opt-in preflight, no LLM/paid provider.')
          PY
  native-learned-context:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      GOOGLE_API_KEY: ''
      PLENUM_OPENHANDS_API_KEY: ''
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Use installed pinned upstream SDK to render exact learned context
        run: |
          python -m pip install -e '.[openhands_tools]'
          python -m pip check
          python -c 'from importlib.metadata import version; assert version("openhands-sdk") == "1.60.1"; from openhands.sdk import AgentContext'
          python -m unittest discover -s tests -p 'test_openhands_native_transfer.py' -v

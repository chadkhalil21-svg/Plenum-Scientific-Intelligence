name: OpenMM Molecular Dynamics Reference Engine
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/openmm-reference.yml'
      - 'src/plenum_ai/openmm_engine.py'
      - 'tests/test_openmm_engine.py'
permissions:
  contents: read
concurrency:
  group: plenum-openmm-cpu-reference
  cancel-in-progress: true
jobs:
  molecular-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned official OpenMM Python scientific engine
        run: python -m pip install -e '.[dynamics]'
      - name: Test analytic potential and bounded parameters
        run: python -m unittest discover -s tests -p 'test_openmm_engine.py' -v
      - name: Execute two-particle harmonic dynamics on CPU reference
        run: python -m plenum_ai.cli openmm-reference --steps 100 --out reports/openmm_reference.json
      - name: Independently check numerical conservation without overstating biology
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('reports/openmm_reference.json').read_text())
          assert report['engine_version']=='8.6.1'
          assert report['platform']=='Reference CPU'
          assert report['steps']==100
          assert report['numerical_fixture_passed']
          assert abs(report['analytic_initial_potential_kj_mol']-1.25)<1e-6
          assert report['relative_total_energy_drift']<0.01
          assert not report['real_molecular_forcefield_used']
          assert not report['protein_dynamics_validated']
          assert not report['scientific_discovery_verified']
          print('OpenMM CPU dynamics checked:',report['relative_total_energy_drift'])
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openmm-cpu-molecular-dynamics-reference
          path: reports/
          if-no-files-found: warn
          retention-days: 14

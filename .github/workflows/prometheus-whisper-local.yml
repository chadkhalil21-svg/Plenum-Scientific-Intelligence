name: Prometheus | Pinned local speech recognition qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/checkpoint-maintainer-guide/narration.txt'
      - '.github/workflows/prometheus-whisper-local.yml'
permissions:
  contents: read
jobs:
  synthetic-speech:
    if: github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' && github.actor == 'chadkhalil21-svg' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'chadkhalil21-svg' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build exact official whisper.cpp release
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/whisper-qualification"
          mkdir -p "$root"
          git init "$root/upstream"
          git -C "$root/upstream" fetch --depth=1 https://github.com/ggml-org/whisper.cpp.git refs/tags/v1.9.6
          git -C "$root/upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$root/upstream" rev-parse HEAD)" = 96ec4d9823e9d0211944172da35f9f29134af990
          cmake -S "$root/upstream" -B "$root/build" -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DGGML_NATIVE=OFF
          cmake --build "$root/build" --target whisper-cli --parallel 2
      - name: Verify official MIT base English model and create fixed public documentation speech
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/whisper-qualification"
          curl --fail --location --silent --show-error --max-time 180 'https://huggingface.co/ggerganov/whisper.cpp/resolve/fb5ed9369c26eaf08392504d8446da431e0fffb9/ggml-base.en.bin' -o "$root/model.bin"
          echo "a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002  $root/model.bin" | sha256sum --check
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            cp docs/checkpoint-maintainer-guide/narration.txt "$root/expected.txt"
            test "$(wc -c < "$root/expected.txt")" -le 512
          else
            printf "%s\n" "The quick brown fox jumps over the lazy dog." > "$root/expected.txt"
          fi
          espeak-ng -v en-us -s 140 -w "$root/synthetic.wav" -f "$root/expected.txt"
          ffmpeg -hide_banner -loglevel error -i "$root/synthetic.wav" -ac 1 -ar 16000 -c:a pcm_s16le "$root/audio.wav"
      - name: Transcribe fixed repository-generated WAV in isolated network namespace
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/whisper-qualification"
          # Deliberately do not modify the adapter or authorize CI for real media.
          # This isolated child executes only the fixed repository-generated WAV.
          test -f "$root/audio.wav"
          test -f "$root/model.bin"
          sudo --preserve-env=PATH unshare --net -- env -i HOME="$root" PATH="$root/build/bin:/usr/bin:/bin" "$root/build/bin/whisper-cli" -m "$root/model.bin" -f "$root/audio.wav" -t 2 -otxt -osrt -of "$root/transcript"
          python - "$root" <<'PY'
          import hashlib, json, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          transcript = (root / "transcript.txt").read_text().strip()
          tokens = re.findall(r"[a-z]+", transcript.lower())
          expected = re.findall(r"[a-z]+", (root / "expected.txt").read_text().lower())
          # A bounded useful speech-recognition acceptance, not a general WER benchmark.
          # Retain exact-word acceptance; no relaxation of the previous gate.
          if tokens != expected:
              raise SystemExit("Fixed public narration transcript did not exactly match: " + repr(transcript))
          srt = (root / "transcript.srt").read_text()
          assert re.search(r"\d{2}:\d{2}:\d{2},\d{3} --> \d{2}:\d{2}:\d{2},\d{3}", srt)
          import os, shutil
          for name in ("expected.txt", "audio.wav", "transcript.txt", "transcript.srt"):
              shutil.copyfile(root / name, name)
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          report = {"schema":"plenum-whisper-public-fixture-v1",
                    "upstream_commit":"96ec4d9823e9d0211944172da35f9f29134af990",
                    "model_sha256":digest(root/"model.bin"),
                    "audio_sha256":digest(root/"audio.wav"),
                    "transcript":transcript, "exact_words":True,
                    "public_synthetic_fixture":True, "public_repository_documentation":os.environ.get("GITHUB_EVENT_NAME") == "pull_request",
                    "source_sha256":digest(root / "expected.txt"), "caption_sha256":digest(root / "transcript.srt"), "paid_inference":False,
                    "private_media_processed":False, "owner_runtime_verified":False}
          pathlib.Path("whisper-acceptance.json").write_text(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prometheus-whisper-local-acceptance
          path: |
            whisper-acceptance.json
            expected.txt
            audio.wav
            transcript.txt
            transcript.srt
          if-no-files-found: error

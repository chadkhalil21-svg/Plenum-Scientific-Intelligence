name: Public Universal Research and Creative Ideas Brief
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Public topic for cross-disciplinary inquiry (no private patents or secrets)'
        required: true
        default: 'scientific research and creativity'
  schedule:
    - cron: '21 13 * * 1,4'
  push:
    paths:
      - '.github/workflows/universal-brief.yml'
      - 'src/plenum_ai/universal_brief.py'
      - 'tests/test_universal_brief.py'
permissions:
  contents: read
concurrency:
  group: plenum-universal-research-brief
  cancel-in-progress: true
jobs:
  source-grounded-ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      PUBLIC_TOPIC: ${{ github.event.inputs.topic || 'scientific research and creativity' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install public-only research adapters
        run: python -m pip install -e .
      - name: Test independent sources and safe cross-domain idea questions
        run: python -m unittest discover -s tests -p 'test_universal_brief.py' -v
      - name: Query publicly accessible worldwide sources and generate cited inquiry proposals
        run: |
          python -m plenum_ai.cli universal-brief --topic "$PUBLIC_TOPIC" --online \
            --limit 8 --out reports/universal_brief.json
      - name: Audit source provenance and scientific-claim boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/universal_brief.json').read_text())
          s=r['public_snapshot']
          c=r['cross_domain_ideas']
          assert r['schema']=='plenum-universal-brief-v1'
          assert not r['AGI_achieved']
          assert not r['automatic_model_self_revision']
          assert not c['foundation_model_wrote_new_science']
          assert not c['scientific_discovery_verified']
          assert len(c['concepts']) <= 8
          print('Public feeds attempted:',s['providers_attempted'])
          print('Feeds with results:',s['providers_reporting_data'])
          print('Source-linked ideas:',c['concept_count'])
          for x in s['providers']:
              print(x['source'],x['status'],len(x['records']))
          for x in c['concepts']:
              assert all(ref['url'].startswith('https://') for ref in x['inspiration'])
              assert not x['novelty_or_patentability_verified']
          if s['providers_reporting_data'] == 0:
              raise SystemExit('All sources unavailable; no fabricated brief')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: universal-public-discovery-and-ideas
          path: reports/universal_brief.json
          if-no-files-found: warn
          retention-days: 14

  archive-public-brief:
    needs: source-grounded-ideas
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research-memory
          path: archive
      - uses: actions/download-artifact@v7
        with:
          name: universal-public-discovery-and-ideas
          path: reports/
      - name: Validate public links and append an immutable evidence record
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path("reports/universal_brief.json").read_text())
          assert r["schema"]=="plenum-universal-brief-v1"
          assert r["public_snapshot"]["providers_attempted"]<=32
          assert len(r["public_snapshot"]["records"])<=128
          assert r["cross_domain_ideas"]["concept_count"]<=8
          assert not r["cross_domain_ideas"]["scientific_discovery_verified"]
          assert not r["AGI_achieved"]
          folder=Path("archive/evidence/universal-brief")
          folder.mkdir(parents=True,exist_ok=True)
          dest=folder/("run-"+os.environ["RUN_ID"]+".json")
          if dest.exists(): raise FileExistsError("No prior report may be replaced")
          record={"schema":"plenum-public-universal-brief-memory-v1",
                  "run_id":os.environ["RUN_ID"],
                  "source_revision":os.environ["SOURCE_REVISION"],
                  "public_metadata_and_reviewable_questions":r,
                  "new_discoveries_verified":False,
                  "copyrighted_content_republished":False,
                  "auto_model_or_code_deployment":False}
          dest.write_text(json.dumps(record,indent=2,ensure_ascii=False)+"\n")
          print("Archived public cross-disciplinary evidence",dest)
          PY
      - name: Commit public questions only on separate research-memory branch
        run: |
          git -C archive config user.name "Plenum Public Research Radar"
          git -C archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C archive add evidence/universal-brief/
          git -C archive commit -m "Archive source-linked multidisciplinary research brief"
          git -C archive pull --rebase origin research-memory
          git -C archive push origin HEAD:research-memory

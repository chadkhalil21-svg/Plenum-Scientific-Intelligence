name: Bootstrap Private Auth0 MCP Cloud Run Address (Owner Approved)
on:
  issues:
    types: [opened]
permissions:
  contents: read
  id-token: write
  issues: write
concurrency:
  group: plenum-auth0-mcp-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap-private-mcp:
    if: >-
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      github.event.issue.user.login == 'chadkhalil21-svg' &&
      github.event.issue.title == 'Computer Browser: bootstrap private Auth0 MCP address' &&
      github.event.issue.body == 'BOOTSTRAP_PRIVATE_AUTH0_MCP_ONLY:2026-11-08'
    environment: computer-browser-production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Test fail-closed bootstrap policy and browser isolation offline
        run: |
          python -m unittest discover -s tests -p 'test_private_mcp_cloudrun_bootstrap.py' -v
          python -m unittest discover -s tests -p 'test_iam_machine_health.py' -v
      - name: Verify exact Auth0 tenant OIDC discovery before creating resources
        id: issuer
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/auth0-discovery.json"' EXIT
          curl --silent --show-error --fail --max-time 15 --proto '=https' \
            'https://dev-8sylxsg44yh5kkhh.us.auth0.com/.well-known/openid-configuration' > "$RUNNER_TEMP/auth0-discovery.json"
          python - "$RUNNER_TEMP/auth0-discovery.json" <<'PY'
          import json,sys
          from urllib.parse import urlsplit
          metadata=json.load(open(sys.argv[1]))
          expected='https://dev-8sylxsg44yh5kkhh.us.auth0.com/'
          assert metadata.get('issuer')==expected, 'Incorrect owner Auth0 issuer'
          jwks=metadata.get('jwks_uri','')
          parsed=urlsplit(jwks)
          assert parsed.scheme=='https' and parsed.netloc=='dev-8sylxsg44yh5kkhh.us.auth0.com'
          assert parsed.path and not parsed.query and not parsed.fragment
          assert metadata.get('authorization_endpoint','').startswith(expected)
          assert metadata.get('token_endpoint','').startswith(expected)
          print('PASS: User-provided Auth0 issuer and JWKS origin verified without private credentials.')
          PY
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_BROWSER_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify separate IAM machine and Cloud Build prerequisites
        id: preflight
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BROWSER_DEPLOY_SA: ${{ secrets.GCP_BROWSER_DEPLOY_SA }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GCP_PROJECT_ID" = 'plenum-computer-browser'
          test "$BROWSER_DEPLOY_SA" = 'plenum-browser-deploy@plenum-computer-browser.iam.gserviceaccount.com'
          umask 077
          trap 'rm -f "$RUNNER_TEMP/iam-machine.json" "$RUNNER_TEMP/iam-machine-policy.json"' EXIT
          gcloud run services describe plenum-computer-browser-machine \
            --project="$GCP_PROJECT_ID" --region=us-east1 --format=json > "$RUNNER_TEMP/iam-machine.json"
          gcloud run services get-iam-policy plenum-computer-browser-machine \
            --project="$GCP_PROJECT_ID" --region=us-east1 --format=json > "$RUNNER_TEMP/iam-machine-policy.json"
          python - <<'PY'
          import json,os
          from services.computer_browser.iam_machine_guard import verify_service, verify_service_iam
          base=os.environ['RUNNER_TEMP']
          m=json.load(open(base+'/iam-machine.json'))
          p=json.load(open(base+'/iam-machine-policy.json'))
          c=m['spec']['template']['spec']['containers'][0]
          env=c.get('env',[])
          enabled=any(e.get('name')=='MACHINE_IAM_PUBLIC_READ' and e.get('value')=='true' for e in env)
          verify_service(m,expected_image=c['image'],public_read_enabled=enabled)
          verify_service_iam(p)
          print('PASS: Existing separate IAM browser unchanged and protected.')
          PY
          gcloud iam service-accounts describe \
            "plenum-browser-machine-runtime@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --project="$GCP_PROJECT_ID" --format='value(email)' > /dev/null
          gcloud iam service-accounts describe \
            "plenum-browser-builder@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --project="$GCP_PROJECT_ID" --format='value(email)' > /dev/null
          gcloud artifacts repositories describe plenum-browser \
            --location=us-east1 --project="$GCP_PROJECT_ID" --format='value(name)' > /dev/null
          gcloud storage buckets describe "gs://$GCP_PROJECT_ID-build-source-98614162800" \
            --project="$GCP_PROJECT_ID" --format='value(name)' > /dev/null
          echo 'PASS: Existing, keyless, low-privilege staging runtime and exact builder available.'
      - name: Build a separately pinned minimal OAuth facade image
        id: build
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY="us-east1-docker.pkg.dev/$GCP_PROJECT_ID/plenum-browser/browser-oauth-mcp"
          IMAGE_TAG="$IMAGE_REPOSITORY:bootstrap-$GITHUB_SHA"
          BUILD_SA="plenum-browser-builder@$GCP_PROJECT_ID.iam.gserviceaccount.com"
          gcloud builds submit . \
            --project="$GCP_PROJECT_ID" --region=us-east1 \
            --service-account="projects/$GCP_PROJECT_ID/serviceAccounts/$BUILD_SA" \
            --gcs-source-staging-dir="gs://$GCP_PROJECT_ID-build-source-98614162800/source" \
            --config=services/computer_browser/facade.cloudbuild.yaml \
            --substitutions="_IMAGE=$IMAGE_TAG" --quiet
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG" \
            --project="$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'BLOCKED: missing SHA256 image digest'; exit 1; }
          echo "image_ref=$IMAGE_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"
          echo 'PASS: Minimal browser OAuth facade pinned by immutable image digest.'
      - name: Create only separate IAM-private, OAuth-disabled bootstrap service
        id: deploy
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          IMAGE_REF: ${{ steps.build.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          case "$IMAGE_REF" in
            us-east1-docker.pkg.dev/plenum-computer-browser/plenum-browser/browser-oauth-mcp@sha256:*) ;;
            *) echo 'BLOCKED: unexpected image registry'; exit 1 ;;
          esac
          # Never reuse the privileged builder or deployer as a runtime.
          # Existing machine-runtime has no project role or keys. This is a
          # TEMPORARY, IAM-private bootstrap only; dedicated identity required before public OAuth.
          RUNTIME_SA="plenum-browser-machine-runtime@$GCP_PROJECT_ID.iam.gserviceaccount.com"
          MACHINE_URL="$(gcloud run services describe plenum-computer-browser-machine \
            --project="$GCP_PROJECT_ID" --region=us-east1 --format='value(status.url)')"
          case "$MACHINE_URL" in https://plenum-computer-browser-machine-*.run.app) ;; *) exit 1 ;; esac
          # The fake owner and fake client intentionally cannot log in. Cloud Run
          # IAM also denies all unauthenticated calls. No cookies or passwords used.
          gcloud run deploy plenum-computer-browser-mcp \
            --project="$GCP_PROJECT_ID" --region=us-east1 --platform=managed \
            --image="$IMAGE_REF" \
            --service-account="$RUNTIME_SA" \
            --no-allow-unauthenticated \
            --ingress=all --port=8080 --min-instances=0 --max-instances=1 \
            --cpu=1 --memory=512Mi --concurrency=4 --timeout=40 \
            --set-env-vars="PLENUM_MCP_OAUTH_ISSUER=https://dev-8sylxsg44yh5kkhh.us.auth0.com/,PLENUM_MCP_OAUTH_JWKS_URL=https://dev-8sylxsg44yh5kkhh.us.auth0.com/.well-known/jwks.json,PLENUM_MCP_RESOURCE_URL=https://bootstrap.example.org/mcp,PLENUM_MCP_OWNER_SUB=auth0|bootstrap-locked-not-a-user,PLENUM_MCP_ALLOWED_CLIENT_ID=plenum-bootstrap-locked-not-a-client,PLENUM_MCP_MACHINE_URL=$MACHINE_URL" \
            --quiet > /dev/null
          SERVICE_URL="$(gcloud run services describe plenum-computer-browser-mcp \
            --project="$GCP_PROJECT_ID" --region=us-east1 --format='value(status.url)')"
          case "$SERVICE_URL" in https://plenum-computer-browser-mcp-*.run.app) ;; *) echo 'Unexpected Cloud Run service origin'; exit 1 ;; esac
          # Set the REAL resource URL only after Cloud Run has allocated its URL.
          # The owner/client remain IMPOSSIBLE bootstrap values; service remains IAM-private.
          gcloud run services update plenum-computer-browser-mcp \
            --project="$GCP_PROJECT_ID" --region=us-east1 \
            --update-env-vars="PLENUM_MCP_RESOURCE_URL=$SERVICE_URL/mcp" \
            --quiet > /dev/null
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo 'PASS: Separate IAM-private OAuth MCP bootstrap address allocated. NO private browsing enabled.'
      - name: Narrow Cloud Run test caller to deployer on facade service only
        id: caller
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BROWSER_DEPLOY_SA: ${{ secrets.GCP_BROWSER_DEPLOY_SA }}
        shell: bash
        run: |
          set -euo pipefail
          # This grant applies ONLY to this new facade for secure smoke checks.
          gcloud run services add-iam-policy-binding plenum-computer-browser-mcp \
            --project="$GCP_PROJECT_ID" --region=us-east1 \
            --member="serviceAccount:$BROWSER_DEPLOY_SA" \
            --role='roles/run.invoker' --quiet > /dev/null
      - name: Verify live private facade health and anonymous OAuth denial
        id: verify
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BROWSER_DEPLOY_SA: ${{ secrets.GCP_BROWSER_DEPLOY_SA }}
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          IMAGE_REF: ${{ steps.build.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/facade.json" "$RUNNER_TEMP/facade-iam.json" "$RUNNER_TEMP/facade-id-token" "$RUNNER_TEMP/facade-header" "$RUNNER_TEMP/facade-health.json" "$RUNNER_TEMP/facade-mcp-body" "$RUNNER_TEMP/facade-anon-body"' EXIT
          gcloud run services describe plenum-computer-browser-mcp \
            --project="$GCP_PROJECT_ID" --region=us-east1 --format=json > "$RUNNER_TEMP/facade.json"
          gcloud run services get-iam-policy plenum-computer-browser-mcp \
            --project="$GCP_PROJECT_ID" --region=us-east1 --format=json > "$RUNNER_TEMP/facade-iam.json"
          python - "$RUNNER_TEMP/facade.json" "$RUNNER_TEMP/facade-iam.json" "$IMAGE_REF" "$SERVICE_URL" "$BROWSER_DEPLOY_SA" <<'PY'
          import json,sys
          m,p,image,url,deployer=sys.argv[1:]
          svc=json.load(open(m)); iam=json.load(open(p))
          assert svc['metadata']['name']=='plenum-computer-browser-mcp'
          t=svc['spec']['template']['spec']; c=t['containers'][0]
          assert t['serviceAccountName']=='plenum-browser-machine-runtime@plenum-computer-browser.iam.gserviceaccount.com'
          assert c['image']==image
          env={v['name']:v.get('value') for v in c.get('env',[])}
          assert len(env)==6, 'Unexpected runtime environment'
          assert env['PLENUM_MCP_RESOURCE_URL']==url+'/mcp'
          assert env['PLENUM_MCP_OWNER_SUB']=='auth0|bootstrap-locked-not-a-user'
          assert env['PLENUM_MCP_ALLOWED_CLIENT_ID']=='plenum-bootstrap-locked-not-a-client'
          assert 'BROWSER_SESSION_KEY' not in env and 'COMPUTER_BROWSER_TOKEN' not in env
          assert svc['status']['url']==url
          members={x for b in iam.get('bindings',[]) for x in b.get('members',[])}
          assert 'allUsers' not in members and 'allAuthenticatedUsers' not in members
          invokers=[b for b in iam.get('bindings',[]) if b.get('role')=='roles/run.invoker']
          assert len(invokers)==1 and invokers[0]['members']==['serviceAccount:'+deployer]
          print('PASS: Exact private facade image, no real owner or client, one invoker only, no secrets.')
          PY
          gcloud auth print-identity-token \
            --impersonate-service-account="$BROWSER_DEPLOY_SA" \
            --audiences="$SERVICE_URL" --include-email > "$RUNNER_TEMP/facade-id-token" 2>/dev/null
          test -s "$RUNNER_TEMP/facade-id-token"
          printf 'X-Serverless-Authorization: Bearer %s\n' "$(cat "$RUNNER_TEMP/facade-id-token")" > "$RUNNER_TEMP/facade-header"
          AUTH_STATUS="$(curl --silent --show-error --max-time 20 --proto '=https' \
            --header @"$RUNNER_TEMP/facade-header" \
            --output "$RUNNER_TEMP/facade-health.json" --write-out '%{http_code}' \
            "$SERVICE_URL/health" || true)"
          ANON_STATUS="$(curl --silent --show-error --max-time 20 --proto '=https' \
            --output "$RUNNER_TEMP/facade-anon-body" --write-out '%{http_code}' \
            "$SERVICE_URL/health" || true)"
          MCP_STATUS="$(curl --silent --show-error --max-time 20 --proto '=https' \
            --header @"$RUNNER_TEMP/facade-header" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data-binary '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            --output "$RUNNER_TEMP/facade-mcp-body" --write-out '%{http_code}' \
            "$SERVICE_URL/mcp" || true)"
          echo "Cloud Run signed /health: HTTP $AUTH_STATUS"
          echo "Cloud Run anonymous /health: HTTP $ANON_STATUS"
          echo "Cloud Run IAM-authenticated but OAuth-unsigned /mcp: HTTP $MCP_STATUS"
          test "$AUTH_STATUS" = '200'
          test "$MCP_STATUS" = '401'
          python - "$RUNNER_TEMP/facade-health.json" "$ANON_STATUS" <<'PY'
          import json,sys
          b=json.load(open(sys.argv[1]))
          assert b['private_accounts_enabled'] is False
          assert b['remote_website_writes_enabled'] is False
          assert int(sys.argv[2]) not in range(200,300)
          print('PASS: Private facade is live, health works, OAuth refuses unsigned requests, IAM denies the public.')
          PY
      - name: Report non-secret release result to founder issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUER: ${{ steps.issuer.outcome }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          CALLER: ${{ steps.caller.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VERIFY" = 'success' ]; then
            RESULT="PASS: Separate IAM-private Auth0 MCP bootstrap deployed at $SERVICE_URL/mcp; signed health HTTP 200, anonymous Cloud Run denied, authenticated but unsigned MCP request HTTP 401. Owner/client are disabled placeholders. No private login or website action enabled. Next: register exact resource URL with Auth0; configure owner OAuth and dedicated facade runtime before permitting public access."
          elif [ "$ISSUER" != 'success' ]; then
            RESULT='BLOCKED BEFORE CLOUD BUILD: Auth0 tenant OIDC issuer/JWKS could not be verified. Correct domain before any deploy.'
          elif [ "$PREFLIGHT" != 'success' ]; then
            RESULT='BLOCKED BEFORE CLOUD BUILD: existing IAM private browser or deployment prerequisites did not pass; nothing deployed.'
          elif [ "$BUILD" != 'success' ]; then
            RESULT='BLOCKED BEFORE DEPLOYMENT: Minimal OAuth facade image build or immutable digest check failed.'
          elif [ "$DEPLOY" != 'success' ]; then
            RESULT='NOT VERIFIED: new IAM-private facade creation failed or remains partial. Original IAP/browser services unchanged; inspect Cloud Run.'
          elif [ "$CALLER" != 'success' ]; then
            RESULT='NOT VERIFIED: private facade created but exact-service test Invoker grant failed; do not make it public.'
          else
            RESULT='NOT VERIFIED: private facade deployed but IAM/OAuth live verification failed; do not make it public.'
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$RESULT"

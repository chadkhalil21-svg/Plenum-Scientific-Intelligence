name: Verify Private Browser Cloud Identity (No Deployment)
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
  id-token: write
jobs:
  verify-auth:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
       github.event.issue.user.login == 'chadkhalil21-svg' &&
       github.event.issue.title == 'Computer Browser: verify cloud identity')
    runs-on: ubuntu-latest
    environment: computer-browser-production
    timeout-minutes: 8
    steps:
      - name: Require configured project and private browser bucket
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BROWSER_PROFILE_BUCKET: ${{ vars.BROWSER_PROFILE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GCP_PROJECT_ID"
          test -n "$BROWSER_PROFILE_BUCKET"
          echo "Private browser configuration variables are present."
      - name: Verify GitHub-to-Google workload identity federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_BROWSER_DEPLOY_SA }}
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Verify Google Cloud API identity and required resource metadata only
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BROWSER_PROFILE_BUCKET: ${{ vars.BROWSER_PROFILE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_NUMBER="$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectNumber)')"
          test -n "$PROJECT_NUMBER"
          test "$BROWSER_PROFILE_BUCKET" = "$GCP_PROJECT_ID-profiles-$PROJECT_NUMBER"
          gcloud artifacts repositories describe plenum-browser \
            --project="$GCP_PROJECT_ID" --location=us-east1 --format='value(name)' >/dev/null
          gcloud secrets describe computer-browser-token --project="$GCP_PROJECT_ID" --format='value(name)' >/dev/null
          gcloud secrets describe computer-browser-session-key --project="$GCP_PROJECT_ID" --format='value(name)' >/dev/null
          gcloud storage buckets describe "gs://$BROWSER_PROFILE_BUCKET" \
            --project="$GCP_PROJECT_ID" --format='value(name)' >/dev/null
          gcloud storage buckets describe \
            "gs://$GCP_PROJECT_ID-build-source-$PROJECT_NUMBER" \
            --project="$GCP_PROJECT_ID" --format='value(name)' >/dev/null
          echo "PASS: GitHub OIDC authentication and private browser resource metadata verified."
      - name: Read-only verification of deployed private Cloud Run service
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=plenum-computer-browser
          REGION=us-east1
          URL="$(gcloud run services describe "$SERVICE" --project="$GCP_PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          # Cloud Run can return either a stable service URL or an alternate
          # per-project .a.run.app URL. Avoid assuming the CLI format is fixed.
          case "$URL" in
            https://*.run.app) echo "PASS: Authenticated Cloud Run service URL exists." ;;
            *) echo "BLOCKER: Service URL missing or unexpected"; exit 1 ;;
          esac
          DESCRIPTION="$(gcloud run services describe "$SERVICE" --project="$GCP_PROJECT_ID" --region="$REGION")"
          if printf '%s\n' "$DESCRIPTION" | grep -Eqi 'Iap Enabled: true'; then
            echo "PASS: Cloud Run has IAP enabled."
          else
            echo "BLOCKER: Cloud Run does not report IAP enabled."
            exit 1
          fi
          gcloud run services get-iam-policy "$SERVICE" --project="$GCP_PROJECT_ID" --region="$REGION" --format=json > "$RUNNER_TEMP/browser-invoker-iam.json"
          python - <<'PY'
          import json,os
          path=os.path.join(os.environ["RUNNER_TEMP"],"browser-invoker-iam.json")
          policy=json.load(open(path))
          for binding in policy.get("bindings",[]):
              if binding.get("role") in {"roles/run.invoker","roles/run.admin"}:
                  assert not ({"allUsers","allAuthenticatedUsers"} & set(binding.get("members",[]))), "Unexpected public Cloud Run invoker policy"
          print("PASS: No public invoker permissions on browser Cloud Run service.")
          PY
          echo "Cloud Run private service identity and security verified. Owner OAuth/IAP sign-in and ChatGPT connection remain untested."

          echo "NO DEPLOYMENT, NO BUILD, NO SECRET VALUES OR WEBSITE LOGINS ACCESSED."

      - name: Verify existing Auth0 portal revision against merged source (read-only)
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GCP_PROJECT_ID" = "plenum-computer-browser"
          umask 077
          FILE="$RUNNER_TEMP/plenum-owner-revision.json"
          trap 'rm -f "$FILE"' EXIT
          gcloud run services describe plenum-browser-owner-auth0 \
            --project="$GCP_PROJECT_ID" --region=us-east1 --format=json > "$FILE"
          python - <<'PY'
          import json,os
          from pathlib import Path
          obj=json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("plenum-owner-revision.json").read_text())
          assert obj["metadata"]["name"]=="plenum-browser-owner-auth0"
          assert obj["status"]["url"]=="https://plenum-browser-owner-auth0-2lak3vl73q-ue.a.run.app"
          template=obj["spec"]["template"]
          spec=template["spec"]
          assert spec["serviceAccountName"]=="plenum-browser-runtime@plenum-computer-browser.iam.gserviceaccount.com"
          img=spec["containers"][0]["image"]
          merged_sha="44962c76b264959abe3db2535a19b6a3411bf849"
          print("LIVE_OWNER_SOURCE_FIX_525_DEPLOYED:",
                "YES" if img.endswith(":"+merged_sha) else "NOT_VERIFIED")
          print("LIVE_OWNER_REVISION_READY:",bool(obj.get("status",{}).get("latestReadyRevisionName")))
          ann=template.get("metadata",{}).get("annotations",{})
          print("SERVICE_MIN_INSTANCES:",obj["metadata"].get("annotations",{}).get("run.googleapis.com/minScale",ann.get("autoscaling.knative.dev/minScale","NOT_REPORTED")))
          print("OWNER_BROWSER_COST_PROVEN_ZERO: NO")
          print("Official Google Cloud Free Tier is monthly/account-shared; project metadata cannot prove remaining unused allowance or exclude Artifact Registry, storage and network charges.")
          print("READ_ONLY_PRIVATE_BROWSER_AUDIT: SUCCESS")
          PY

name: Autonomous Research
on:
  push:
    paths:
      - '.github/workflows/research.yml'
  workflow_dispatch:
    inputs:
      query:
        description: "Public scientific question, no proprietary or personal information"
        required: true
        default: "artificial intelligence for scientific discovery"
  schedule:
    - cron: "17 9 * * *"
permissions:
  contents: read
concurrency:
  group: bounded-public-research
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Load persistent research-memory snapshot (read-only)
        uses: actions/checkout@v7
        with:
          ref: research-memory
          path: prior-knowledge
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Retrieve scientific source inventory
        env:
          REQUESTED_QUERY: ${{ github.event.inputs.query }}
        shell: bash
        run: |
          if [ -z "$REQUESTED_QUERY" ]; then
            QUERY="artificial intelligence for scientific discovery"
          else
            QUERY="$REQUESTED_QUERY"
          fi
          python -m plenum_ai.cli mission --query "$QUERY" --memory-dir prior-knowledge/memory/entries --simulation heat --out reports/mission.json
      - name: Independent narrow improvement benchmark
        run: python -m plenum_ai.cli improve --out reports/improvement.json
      - name: Verify live source retrieval and numerical benchmark
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/mission.json").read_text())
          print("Literature source status:", report["source_status"])
          if report["source_status"] != "retrieved_metadata":
              print("Fresh literature retrieval unavailable; this record is flagged, never invented")
          assert report["source_status"] in ("retrieved_metadata", "no_results", "source_unavailable")
          assert report["numeric_benchmark_verified"]
          PY
      - name: Prepare checked research memory and independent improvement audit
        run: |
          python -m plenum_ai.cli memory-record --mission reports/mission.json --improvement reports/improvement.json --out reports/memory_entry.json
          python - <<'PY'
          import json
          from pathlib import Path
          e = json.loads(Path("reports/improvement.json").read_text())
          assert e["independent_audit"]["passed"], e["independent_audit"]
          assert e["deployed"] is False
          print("Independent synthetic benchmark audit verified.")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: research-and-improvement
          path: reports/
          retention-days: 14
  persist-public-memory:
    if: github.ref == 'refs/heads/main'
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v7
        with:
          name: research-and-improvement
          path: staged
      - name: Validate incoming record before publication
        run: |
          PYTHONPATH=src python -m plenum_ai.cli memory-ingest --file staged/memory_entry.json --dir new-records/memory/entries
      - name: Commit ONLY public research metadata to isolated memory branch
        run: |
          git config user.name "plenum-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin research-memory
          git switch -C research-memory origin/research-memory
          mkdir -p memory/entries
          cp new-records/memory/entries/*.json memory/entries/
          git add memory/entries/
          if ! git diff --cached --quiet; then
            git commit -m "Archive public scientific metadata and independent benchmark audit"
            git push origin HEAD:refs/heads/research-memory
          else
            echo "No new records"
          fi

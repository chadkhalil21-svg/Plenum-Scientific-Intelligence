name: Autonomous Research
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Public scientific question, no proprietary or personal information"
        required: true
        default: "artificial intelligence for scientific discovery"
  schedule:
    - cron: "17 9 * * *"
permissions:
  contents: read
concurrency:
  group: bounded-public-research
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Retrieve scientific source inventory
        env:
          REQUESTED_QUERY: ${{ github.event.inputs.query }}
        shell: bash
        run: |
          if [ -z "$REQUESTED_QUERY" ]; then
            QUERY="artificial intelligence for scientific discovery"
          else
            QUERY="$REQUESTED_QUERY"
          fi
          python -m plenum_ai.cli research --query "$QUERY" --out reports/research.json
      - name: Independent narrow improvement benchmark
        run: python -m plenum_ai.cli improve --out reports/improvement.json
      - uses: actions/upload-artifact@v7
        with:
          name: research-and-improvement
          path: reports/
          retention-days: 14

name: PaperQA2 | Real Offline Public Research Retrieval
on:
  pull_request:
    paths:
      - 'src/plenum_ai/paperqa_public_retrieval.py'
      - 'src/plenum_ai/paperqa_hash_study.py'
      - 'tests/test_paperqa_hash_study.py'
      - 'tests/test_paperqa_public_retrieval.py'
      - '.github/workflows/paperqa-public-retrieval.yml'
  push:
    branches: [main]
    paths:
      - 'src/plenum_ai/paperqa_public_retrieval.py'
      - 'src/plenum_ai/paperqa_hash_study.py'
      - 'tests/test_paperqa_hash_study.py'
      - 'tests/test_paperqa_public_retrieval.py'
      - '.github/workflows/paperqa-public-retrieval.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-public-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      GOOGLE_API_KEY: ''
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Offline no-library plan and negative tests
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -p 'test_paperqa_public_retrieval.py' -v
          python -m plenum_ai.paperqa_public_retrieval --out reports/paperqa-public-plan.json
      - name: Install only reviewed upstream PaperQA2 optional package
        run: python -m pip install -e '.[paperqa]'
      - name: Actually index and retrieve public sources using PaperQA2 sparse embeddings, forbidding internet
        run: |
          python -m plenum_ai.paperqa_public_retrieval \
            --execute --out reports/paperqa-real-retrieval.json
      - name: Compare two existing upstream sparse-embedding configurations on a balanced exploratory question set
        run: |
          python -m unittest discover -s tests -p 'test_paperqa_hash_study.py' -v
          python -m plenum_ai.paperqa_hash_study \
            --execute --out reports/paperqa-dimensional-study.json
      - name: Validate independent paired scoring without claiming generalization
        run: |
          python - <<'PY'
          import json
          d=json.load(open('reports/paperqa-dimensional-study.json'))
          assert d['results_measured'] is True
          assert len(d['results'])==2
          for arm in d['results'].values():
              assert arm['attempted']==8 and 0<=arm['correct']<=8
          assert d['model_calls']==0 and d['paid_api_calls']==0
          assert not d['AGI_demonstrated']
          print('Paired exploratory retrieval:',{k:v['correct'] for k,v in d['results'].items()})
          PY
      - name: Require independently checked original retrieval outputs and no inference
        run: |
          python - <<'PY'
          import json
          d=json.load(open('reports/paperqa-real-retrieval.json'))
          assert d['retrieval_verified'] and d['independently_scored']
          assert d['attempted']==2 and 0<=d['correct']<=2
          assert not d['AGI_demonstrated'] and not d['private_documents']
          assert d['model_calls']==0 and d['paid_api_calls']==0
          print('PaperQA2 real public source retrieval:',d['correct'],'/',d['attempted'])
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: paperqa-original-public-retrieval-evidence
          path: |
            reports/paperqa-public-plan.json
            reports/paperqa-real-retrieval.json
          retention-days: 30

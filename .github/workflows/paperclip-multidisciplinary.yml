name: Paperclip multidisciplinary public continuation
on:
  pull_request:
    paths:
      - 'integrations/paperclip/pipeline_*.py'
      - '.github/workflows/paperclip-multidisciplinary.yml'
      - '.github/workflows/paperclip-native-integration.yml'
permissions:
  contents: read
jobs:
  science:
    if: github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' && github.actor == 'chadkhalil21-svg' && github.event.pull_request.head.repo.full_name == github.repository && github.run_attempt == 1
    uses: ./.github/workflows/paperclip-native-integration.yml
    with:
      pipeline_stage: science
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
  engineering:
    needs: science
    uses: ./.github/workflows/paperclip-native-integration.yml
    with:
      pipeline_stage: engineering
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
  commercial:
    needs: engineering
    uses: ./.github/workflows/paperclip-native-integration.yml
    with:
      pipeline_stage: commercial
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

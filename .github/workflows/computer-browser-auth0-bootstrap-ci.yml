name: Verify OAuth MCP Private Bootstrap Policy (No Deployment)
on:
  pull_request:
    paths:
      - '.github/workflows/computer-browser-auth0-private-facade-bootstrap.yml'
      - '.github/workflows/computer-browser-auth0-bootstrap-ci.yml'
      - 'services/computer_browser/facade.cloudbuild.yaml'
      - 'tests/test_private_mcp_cloudrun_bootstrap.py'
      - 'docs/COMPUTER_BROWSER_AUTH0_BOOTSTRAP.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/computer-browser-auth0-private-facade-bootstrap.yml'
      - '.github/workflows/computer-browser-auth0-bootstrap-ci.yml'
      - 'services/computer_browser/facade.cloudbuild.yaml'
      - 'tests/test_private_mcp_cloudrun_bootstrap.py'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify zero-public-access and owner-gated address-only bootstrap
        run: python -m unittest discover -s tests -p 'test_private_mcp_cloudrun_bootstrap.py' -v
      - name: No cloud credentials, no deployment, no website action in policy CI
        run: |
          python - <<'PY'
          import pathlib
          s=pathlib.Path('.github/workflows/computer-browser-auth0-bootstrap-ci.yml').read_text()
          assert 'google-github-actions/auth@' not in s
          assert 'id-token: write' not in s
          assert 'gcloud run deploy' not in s
          print('PASS: Static release checks use no Google credentials or live service.')
          PY

name: Verify Private Computer Browser OAuth Resource Boundary (No Deployment)
on:
  pull_request:
    paths:
      - 'services/computer_browser/oauth_resource_boundary.py'
      - 'services/computer_browser/mcp_resource_server.py'
      - 'tests/test_browser_oauth_resource_boundary.py'
      - '.github/workflows/computer-browser-oauth-boundary-ci.yml'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'services/computer_browser/oauth_resource_boundary.py'
      - 'services/computer_browser/mcp_resource_server.py'
      - 'tests/test_browser_oauth_resource_boundary.py'
      - '.github/workflows/computer-browser-oauth-boundary-ci.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oauth-facade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install official SDK and only the OAuth facade dependency set
        run: python -m pip install -e '.[browser_mcp]'
      - name: Exercise RSA verification, owner scopes, machine isolation and HTTP auth guardrails
        run: python -m unittest discover -s tests -p 'test_browser_oauth_resource_boundary.py' -v
      - name: Confirm live Cloud Run / GitHub issue / real website actions were NOT executed
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('services/computer_browser/mcp_resource_server.py').read_text()
          assert 'transport="streamable-http"' in s
          assert 'auth_server_provider=' not in s
          assert 'get_access_token' in s
          assert not any(line.strip().startswith(('gcloud ', 'gh issue ', 'curl ')) for line in s.splitlines())
          print("PASS: No Cloud Run deployment, GitHub issue, browser login, or external website write in CI.")
          PY

name: Plenum Chief | Founder Public Workforce Inbox
on:
  issues:
    types: [opened]
  pull_request:
    paths:
      - 'src/plenum_ai/workforce_public_inbox.py'
      - 'tests/test_workforce_public_inbox.py'
      - '.github/workflows/workforce-public-inbox.yml'
permissions:
  contents: read
concurrency:
  group: plenum-public-inbox-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false
jobs:
  scope-and-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_workforce_public_inbox.py' -v
  public-task:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == 'chadkhalil21-svg' &&
      github.event.repository.full_name == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      github.event.issue.title == '[Plenum Workforce] public research'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing Plenum public research tools only
        run: python -m pip install -e .
      - name: Receive founder request, reuse approved worker, check output, persist issue status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m plenum_ai.workforce_public_inbox --event "$GITHUB_EVENT_PATH"
      - name: Attach only bounded public work results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-workforce-task-${{ github.event.issue.number }}
          path: reports/workforce
          if-no-files-found: ignore
          retention-days: 7

name: Plenum Chief | Founder Public Workforce Inbox
on:
  issues:
    types: [opened]
  pull_request:
    paths:
      - 'src/plenum_ai/workforce_public_inbox.py'
      - 'tests/test_workforce_public_inbox.py'
      - 'src/plenum_ai/workforce_team_dispatch.py'
      - 'tests/test_workforce_team_dispatch.py'
      - 'src/plenum_ai/telegram_workforce_status.py'
      - 'tests/test_telegram_workforce_status.py'
      - 'src/plenum_ai/hermes_issue_bridge.py'
      - 'tests/test_hermes_issue_bridge.py'
      - 'integrations/hermes/plugins/plenum-public-workforce/**'
      - '.github/workflows/workforce-public-inbox.yml'
permissions:
  contents: read
concurrency:
  group: plenum-founder-public-issue-${{ github.event.issue.number || github.event.client_payload.issue_number || github.ref }}
  cancel-in-progress: false
jobs:
  scope-and-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_workforce_public_inbox.py' -v
      - run: python -m unittest discover -s tests -p 'test_workforce_team_dispatch.py' -v
      - run: python -m unittest discover -s tests -p 'test_telegram_workforce_status.py' -v
      - run: python -m unittest discover -s tests -p 'test_hermes_issue_bridge.py' -v
  public-task:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == 'chadkhalil21-svg' &&
      github.event.repository.full_name == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      github.event.issue.title == '[Plenum Workforce] public research'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing Plenum worker packages; science extras only for science assignment
        run: |
          python -m pip install -e .
          python - <<'PY'
          import json, os, subprocess, sys
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          body=(event.get('issue') or {}).get('body') or ''
          if body.startswith('PLENUM_PUBLIC_WORKFORCE_V2\nkind: public_science\n'):
              subprocess.check_call([sys.executable,'-m','pip','install','-e','.[numerical,orchestration]'])
          PY
      - name: Receive founder request, reuse approved worker, check output, persist issue status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m plenum_ai.workforce_public_inbox --event "$GITHUB_EVENT_PATH"
      - name: Attach only bounded public work results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-workforce-task-${{ github.event.issue.number }}
          path: reports/workforce
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify the founder's Telegram group when explicitly connected (no task text or private data)
        if: always()
        continue-on-error: true
        env:
          PLENUM_TELEGRAM_BOT_TOKEN: ${{ secrets.PLENUM_TELEGRAM_BOT_TOKEN }}
          PLENUM_TELEGRAM_CHAT_ID: ${{ vars.PLENUM_TELEGRAM_CHAT_ID }}
        run: |
          if test -s "reports/workforce/status-${{ github.event.issue.number }}.json"; then
            python -m plenum_ai.telegram_workforce_status \
              --status-file "reports/workforce/status-${{ github.event.issue.number }}.json"
          else
            echo "No validated public task outcome to notify"
          fi

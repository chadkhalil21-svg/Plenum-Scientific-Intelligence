name: OpenHands | Actual Sandbox File Tool
on:
  pull_request:
    paths:
      - 'src/plenum_ai/openhands_tool_test.py'
      - 'tests/test_openhands_tool_test.py'
      - '.github/workflows/openhands-tool-functional.yml'
  push:
    branches: [main]
    paths:
      - 'src/plenum_ai/openhands_tool_test.py'
      - 'tests/test_openhands_tool_test.py'
      - '.github/workflows/openhands-tool-functional.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-upstream-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      GOOGLE_API_KEY: ''
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Ensure default Plenum path runs without OpenHands dependency or AI inference
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -p 'test_openhands_tool_test.py' -v
          python -m plenum_ai.openhands_tool_test --out reports/openhands-tool-preflight.json
      - name: Install only previously verified pinned OpenHands SDK
        run: |
          python -m pip install -e '.[openhands_tools]'
          python -m pip check
      - name: Run actual upstream tool create, edit and unauthorized-write rejection in disposable workspace
        run: |
          python -m plenum_ai.openhands_tool_test \
            --execute --out reports/openhands-tool-evidence.json
      - name: Verify original tool observation and zero model or external API use
        run: |
          python - <<'PY'
          import json
          data=json.load(open('reports/openhands-tool-evidence.json'))
          assert data['tool_execution_verified'] is True
          assert data['authorized_create_and_edit'] is True
          assert data['unauthorized_write_blocked'] is True
          assert data['syntax_verified'] is True
          assert data['workspace_deleted_on_exit'] is True
          assert not data['agent_executed'] and not data['generated_code_executed']
          assert data['inference_calls']==0 and data['external_api_calls']==0
          assert not data['AGI_demonstrated']
          print('OpenHands true tool execution verified, not autonomous coding')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openhands-disposable-tool-evidence
          path: reports/
          retention-days: 30

name: Curated Scientific Skills Review
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/scientific-skills-review.yml"
      - "src/plenum_ai/skill_catalog.py"
      - "tests/test_skill_catalog.py"
permissions:
  contents: read
jobs:
  read-only-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Confirm skill references cannot execute code
        run: python -m unittest discover -s tests -p "test_skill_catalog.py" -v
      - name: Fetch only one pinned reviewed-candidate reference for human inspection
        run: |
          python -m plenum_ai.cli scientific-skills --out reports/skill_catalog.json
          python -m plenum_ai.cli scientific-skills --inspect rdkit --out reports/rdkit_skill_review.json
      - name: Verify fetched upstream documentation is untrusted reference only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path("reports/rdkit_skill_review.json").read_text())
          assert len(doc["sha256"])==64
          assert doc["executed"] is False
          assert doc["status"]=="untrusted_document_for_human_review_only"
          assert len(json.loads(Path("reports/skill_catalog.json").read_text())["skills"])==6
          print("Pinned RDKit skill fetched for review; no instructions executed.")
          PY
      - name: Read-only free NVIDIA scan of the same pinned RDKit candidate
        run: |
          python -m pip install --disable-pip-version-check "git+https://github.com/NVIDIA/SkillSpector.git@3c2c5d7a1ee148d228398070b91d3beaf0d73b11"
          mkdir -p reports/skill-scans reports/skill-scan-input/rdkit
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          record=json.loads(Path("reports/rdkit_skill_review.json").read_text(encoding="utf-8"))
          content=record["text"].encode("utf-8")
          assert hashlib.sha256(content).hexdigest()==record["sha256"]
          Path("reports/skill-scan-input/rdkit/SKILL.md").write_bytes(content)
          print("Using existing pinned RDKit document; no new URL or code execution.")
          PY
          skillspector scan reports/skill-scan-input/rdkit/SKILL.md --no-llm --format json --output reports/skill-scans/rdkit-static.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("reports/skill-scans/rdkit-static.json").read_text(encoding="utf-8"))
          assert isinstance(report,dict)
          print("Original skill review now includes independent no-LLM scanner JSON.")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: pinned-scientific-skills-review
          path: reports/
          retention-days: 14

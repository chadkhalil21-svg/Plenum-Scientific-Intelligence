name: Prometheus Hermes unfamiliar research engineering
on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/prometheus-hermes-discovery-resilience.yml'
permissions:
  contents: read
concurrency:
  group: prometheus-hermes-discovery-resilience-once
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'prometheus-hermes-discovery-resilience' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Freeze real source and held-out outcome tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hermes-evidence" "$RUNNER_TEMP/hermes-work" "$RUNNER_TEMP/hermes-home" "$RUNNER_TEMP/hermes-grade/tests"
          test "$(git hash-object src/plenum_ai/world_horizon.py)" = 0424f24610ae9b4555cdf40a49e77a8bcdc65ed8
          cp src/plenum_ai/world_horizon.py "$RUNNER_TEMP/hermes-work/world_horizon.py"
          cp -a src "$RUNNER_TEMP/hermes-grade/"
          cp tests/test_world_horizon.py "$RUNNER_TEMP/hermes-grade/tests/"
          cat > "$RUNNER_TEMP/hermes-grade/tests/test_discovery_resilience.py" <<'PY'
          import json,unittest
          from plenum_ai.world_horizon import parse_public
          from plenum_ai.chief_contract_plan import selected_paper_ids
          TOPIC="Survey public concrete corrosion papers"
          def parse(rows):
              return parse_public("crossref_journals",json.dumps({"message":{"items":rows}}).encode(),query=TOPIC)
          class Resilience(unittest.TestCase):
              def test_malformed_neighbor_does_not_destroy_valid_record(self):
                  good={"title":["Concrete corrosion study"],"DOI":"10.1234/VALID","container-title":["Journal"],"published":{"date-parts":[[2026]]}}
                  for bad in (None,42,[],{"title":42,"DOI":"10.1234/wrong"},{"title":[42],"DOI":"10.1234/wrong"},{"title":["Concrete corrosion"],"DOI":None},{"title":["Concrete corrosion"],"DOI":"10.1234/bad","published":"invalid"},{"title":["Concrete corrosion"],"DOI":"10.1234/bad","container-title":42}):
                      with self.subTest(bad=bad):
                          rows=parse([bad,good])
                          self.assertEqual([r["url"] for r in rows],["https://doi.org/10.1234/valid"])
                          self.assertEqual(selected_paper_ids({"paper_survey":TOPIC},{"schema":"plenum-public-horizon-snapshot-v1","topic":TOPIC,"category":"journals","independent_breakthrough_verified":False,"records":rows}),["10.1234/valid"])
              def test_preserve_existing_boundary(self):
                  rows=parse([{"title":["Concrete corrosion"],"DOI":"10.1234/bad;id"},{"title":["Unrelated concrete"],"DOI":"10.1234/unrelated"},{"title":["Concrete corrosion"],"DOI":"10.1234/ONE"},{"title":["Concrete corrosion"],"DOI":"10.1234/one"}])
                  self.assertEqual([r["url"] for r in rows],["https://doi.org/10.1234/one"])
              def test_invalid_envelope_fails_not_empty_success(self):
                  for envelope in ([],{"message":"bad"},{"message":{"items":"bad"}}):
                      with self.subTest(envelope=envelope),self.assertRaises((ValueError,TypeError,AttributeError)):
                          parse_public("crossref_journals",json.dumps(envelope).encode(),query=TOPIC)
          PY
          sha256sum src/plenum_ai/world_horizon.py "$RUNNER_TEMP/hermes-grade/tests/"*.py > "$RUNNER_TEMP/hermes-evidence/frozen-inputs.txt"
          sudo chown -R 10000:10000 "$RUNNER_TEMP/hermes-work" "$RUNNER_TEMP/hermes-home"
      - name: Pull versioned official upstream runtime and existing local model
        run: |
          set -euo pipefail
          docker pull nousresearch/hermes-agent@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f
          docker run --init --rm --network none --user 10000:10000 --cap-drop ALL --security-opt no-new-privileges --entrypoint /opt/hermes/.venv/bin/hermes-agent nousresearch/hermes-agent@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f --version > "$RUNNER_TEMP/hermes-evidence/hermes-version.txt"
          grep -Eq '(^|[^0-9])0[.]23[.]4([^0-9]|$)' "$RUNNER_TEMP/hermes-evidence/hermes-version.txt"
          docker pull ollama/ollama@sha256:7e8c7ba387b11b09dcce1eff1118b1ab433564ed263434a7730c209f2ee346f4
          docker pull python:3.12-slim
          docker image inspect nousresearch/hermes-agent@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/hermes-evidence/hermes-image.json"
          docker image inspect ollama/ollama@sha256:7e8c7ba387b11b09dcce1eff1118b1ab433564ed263434a7730c209f2ee346f4 --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/hermes-evidence/ollama-image.json"
          docker run -d --name plenum-hermes-ollama -p 127.0.0.1:11434:11434 -e OLLAMA_CONTEXT_LENGTH=65536 -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_NO_CLOUD=1 --memory=9g --cpus=3 ollama/ollama@sha256:7e8c7ba387b11b09dcce1eff1118b1ab433564ed263434a7730c209f2ee346f4
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags && break; sleep 2; done
          docker exec plenum-hermes-ollama ollama pull qwen3.5:4b
          curl -fsS http://127.0.0.1:11434/api/tags > "$RUNNER_TEMP/hermes-evidence/model.json"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert any(m["name"]=="qwen3.5:4b" and m["digest"]=="d8b0f5e9760cd1682034f292d7ef72ec46f432149be0df7574bf2d6e92e38c04" for m in d["models"])' "$RUNNER_TEMP/hermes-evidence/model.json"
          docker network create --internal plenum-hermes-internal
          docker network connect --alias ollama plenum-hermes-internal plenum-hermes-ollama
          docker network disconnect bridge plenum-hermes-ollama
          test "$(docker network inspect plenum-hermes-internal --format '{{.Internal}}')" = true
      - name: Confirm frozen acceptance exposes original defect
        run: |
          set -euo pipefail
          set +e
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --read-only --user 65534:65534 --pids-limit 64 --memory 768m -e PYTHONPATH=/work/src:/work/tests -e PYTHONDONTWRITEBYTECODE=1 -v "$RUNNER_TEMP/hermes-grade:/work:ro" -w /work python:3.12-slim python -B -m unittest discover -s tests -p test_discovery_resilience.py -v > "$RUNNER_TEMP/hermes-evidence/baseline-verdict.txt" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -q 'test_malformed_neighbor_does_not_destroy_valid_record' "$RUNNER_TEMP/hermes-evidence/baseline-verdict.txt"
          grep -Eq 'FAILED \(.*(errors|failures)=' "$RUNNER_TEMP/hermes-evidence/baseline-verdict.txt"
          ! grep -q 'Failed to import test module' "$RUNNER_TEMP/hermes-evidence/baseline-verdict.txt"
      - id: execute
        name: Native specialist independently repairs provider record resilience
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/hermes-config.yaml" <<'YAML'
          model:
            provider: custom
            model: qwen3.5:4b
            base_url: http://ollama:11434/v1
            api_key: local-only
            context_length: 65536
          platform_toolsets:
            cli: [file]
          security:
            allow_lazy_installs: false
          terminal:
            backend: local
            cwd: /opt/data/work
          agent:
            max_turns: 8
          YAML
          sudo install -o 10000 -g 10000 -m 0600 "$RUNNER_TEMP/hermes-config.yaml" "$RUNNER_TEMP/hermes-home/config.yaml"
          set +e
          timeout 720 docker run --init --name plenum-hermes-native --network plenum-hermes-internal --user 10000:10000 --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 3g --cpus 1 --workdir /opt/data/work -e HERMES_WRITE_SAFE_ROOT=/opt/data/work -e HOME=/opt/data -e HERMES_HOME=/opt/data -e OPENAI_API_KEY=local-only -e HERMES_SKIP_CONFIG_MIGRATION=1 -v "$RUNNER_TEMP/hermes-home:/opt/data" -v "$RUNNER_TEMP/hermes-work:/opt/data/work" --entrypoint /opt/hermes/.venv/bin/hermes nousresearch/hermes-agent@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f chat --oneshot --toolsets file --max-turns 8 -q 'You are the existing Plenum Engineering specialist. The scholarly discovery system must retain valid topic-matched Crossref records when individual provider records are malformed, without admitting malformed records, weakening existing independent acceptance, or treating a malformed response envelope as success. Diagnose the actual source in /opt/data/work/world_horizon.py and implement the necessary repair in that file. Preserve existing non-Crossref behavior, allowlists, limits and public read-only scope. Decide your own repair. No other files, commands or external actions. Verify by rereading. Stop if access is denied.' > "$RUNNER_TEMP/hermes-native-output.txt" 2>&1
          rc=$?
          set -e
          printf '{"native_exit":%s}\n' "$rc" > "$RUNNER_TEMP/hermes-evidence/native-exit.json"
          exit "$rc"
      - name: Independently grade actual candidate, preserve evidence even on timeout
        if: always() && steps.execute.outcome != 'skipped'
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/hermes-work/world_horizon.py"
          test -f "$source" && test ! -L "$source"
          test "$(stat -c %s "$source")" -le 60000
          test "$(stat -c %h "$source")" -eq 1
          diff -u src/plenum_ai/world_horizon.py "$source" > "$RUNNER_TEMP/hermes-evidence/candidate.patch" || test "$?" -eq 1
          ! cmp -s src/plenum_ai/world_horizon.py "$source"
          cp "$source" "$RUNNER_TEMP/hermes-grade/src/plenum_ai/world_horizon.py"
          chmod -R a+rX "$RUNNER_TEMP/hermes-grade"
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --read-only --user 65534:65534 --pids-limit 64 --memory 768m -e PYTHONPATH=/work/src:/work/tests -e PYTHONDONTWRITEBYTECODE=1 -v "$RUNNER_TEMP/hermes-grade:/work:ro" -w /work python:3.12-slim python -B -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/hermes-evidence/independent-verdict.txt"
      - name: Preserve bounded public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-hermes-discovery-resilience
          path: ${{ runner.temp }}/hermes-evidence/
      - name: Clean temporary isolated containers
        if: always()
        run: |
          docker rm -f plenum-hermes-native plenum-hermes-ollama || true
          docker network rm plenum-hermes-internal || true

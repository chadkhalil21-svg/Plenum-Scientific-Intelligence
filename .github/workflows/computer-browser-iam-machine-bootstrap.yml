name: Bootstrap IAM Machine Runtime Service Account (Owner Gate)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter IAM_MACHINE_RUNTIME_APPROVED (service account only; no project roles)'
        required: true
        type: string
  issues:
    types: [opened]
permissions:
  contents: read
  id-token: write
  issues: write
concurrency:
  group: plenum-iam-machine-runtime-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    if: >-
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirmation == 'IAM_MACHINE_RUNTIME_APPROVED') ||
       (github.event_name == 'issues' &&
        github.event.issue.user.login == 'chadkhalil21-svg' &&
        github.event.issue.title == 'Computer Browser: bootstrap IAM machine runtime' &&
        github.event.issue.body == 'IAM_MACHINE_RUNTIME_APPROVED:2026-11-07'))
    environment: computer-browser-production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_BROWSER_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Validate exact target and look up existing identity
        id: lookup
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DEPLOY_SA: ${{ secrets.GCP_BROWSER_DEPLOY_SA }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GCP_PROJECT_ID" = "plenum-computer-browser"
          test "$DEPLOY_SA" = "plenum-browser-deploy@plenum-computer-browser.iam.gserviceaccount.com"
          SA="plenum-browser-machine-runtime@plenum-computer-browser.iam.gserviceaccount.com"
          ERROR="$RUNNER_TEMP/machine-lookup-error"
          trap 'rm -f "$ERROR"' EXIT
          if gcloud iam service-accounts describe "$SA" --project="$GCP_PROJECT_ID" \
                --format='value(email)' >/dev/null 2>"$ERROR"; then
            echo "status=existing" >> "$GITHUB_OUTPUT"
            echo "Target service account already exists; checking narrowly scoped access."
          elif grep -Eqi 'NOT_FOUND|does not exist|not found' "$ERROR" &&
               ! grep -Eqi 'PERMISSION_DENIED|permission' "$ERROR"; then
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "Target service account absent. Authorized exact-identity creation may proceed."
          else
            echo "BLOCKED: Unable to verify missing vs inaccessible service account; no IAM changes."
            exit 1
          fi
      - name: Create ONLY the dedicated no-role machine service account if absent
        id: create
        if: steps.lookup.outputs.status == 'missing'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # This creates an identity; it does not grant any project-wide roles.
          if ! gcloud iam service-accounts create plenum-browser-machine-runtime \
               --project="$GCP_PROJECT_ID" \
               --display-name='Plenum Browser Machine Runtime' \
               --description='Private IAM-only browser health check; no project roles or keys' \
               --quiet >/dev/null 2>&1; then
            echo "BLOCKED: GitHub deployer lacks permission to create the exact new service account."
            exit 1
          fi
          echo "PASS: New dedicated service account created without project IAM roles or keys."
      - name: Check or assign Service Account User on exact runtime resource only
        id: attach
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DEPLOY_SA: ${{ secrets.GCP_BROWSER_DEPLOY_SA }}
        shell: bash
        run: |
          set -euo pipefail
          SA="plenum-browser-machine-runtime@$GCP_PROJECT_ID.iam.gserviceaccount.com"
          MEMBER="serviceAccount:$DEPLOY_SA"
          POLICY="$RUNNER_TEMP/machine-account-resource-policy.json"
          trap 'rm -f "$POLICY"' EXIT
          gcloud iam service-accounts describe "$SA" --project="$GCP_PROJECT_ID" \
             --format='value(email)' >/dev/null
          if ! gcloud iam service-accounts get-iam-policy "$SA" \
               --project="$GCP_PROJECT_ID" --format=json >"$POLICY" 2>/dev/null; then
            echo "BLOCKED: Could not inspect exact service-account resource's IAM policy."
            exit 1
          fi
          if python - "$POLICY" "$MEMBER" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          members=[m for b in p.get("bindings",[])
                   if b.get("role")=="roles/iam.serviceAccountUser" and not b.get("condition")
                   for m in b.get("members",[])]
          sys.exit(0 if sys.argv[2] in members else 1)
          PY
          then
            echo "Service Account User binding already present on exact runtime identity."
          else
            if ! gcloud iam service-accounts add-iam-policy-binding "$SA" \
                 --project="$GCP_PROJECT_ID" \
                 --member="$MEMBER" --role='roles/iam.serviceAccountUser' \
                 --quiet >/dev/null 2>&1; then
              echo "BLOCKED: deployer cannot update service-account resource policy. No project IAM changed."
              exit 1
            fi
          fi
          gcloud iam service-accounts get-iam-policy "$SA" \
            --project="$GCP_PROJECT_ID" --format=json > "$POLICY"
          python - "$POLICY" "$MEMBER" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          matches=[b for b in p.get("bindings",[])
                   if b.get("role")=="roles/iam.serviceAccountUser" and not b.get("condition")
                   and sys.argv[2] in b.get("members",[])]
          assert matches, "Exact-resource Service Account User binding not verified"
          print("PASS: deployment identity has Service Account User on machine runtime account only.")
          PY
      - name: Post sanitized result to initiating owner's issue
        if: always() && github.event_name == 'issues' && github.event.issue.user.login == 'chadkhalil21-svg'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LOOKUP: ${{ steps.lookup.outcome }}
          CREATED: ${{ steps.create.outcome }}
          ATTACH: ${{ steps.attach.outcome }}
        run: |
          set -euo pipefail
          if [ "$ATTACH" = "success" ]; then
            RESULT="PASS: Dedicated no-project-role machine runtime service account exists; deployer has exact-resource Service Account User permission. No keys or project-wide roles granted."
          elif [ "$LOOKUP" != "success" ]; then
            RESULT="BLOCKED: Existing GitHub identity could not distinguish absent from inaccessible runtime service account. No changes made."
          elif [ "$CREATED" = "failure" ]; then
            RESULT="BLOCKED: GitHub deployer cannot create the dedicated service account with current permissions. No new project roles were granted."
          else
            RESULT="BLOCKED: Exact-resource Service Account User permission could not be verified or set. No project IAM roles changed."
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$RESULT"

name: Computer Browser IAP OAuth Redirect Audit (No Secrets)
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  observe-owner-iap-redirect:
    if: >-
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      github.event.issue.user.login == 'chadkhalil21-svg' &&
      ((github.event.issue.title == 'Computer Browser: audit live IAP OAuth redirect' &&
        github.event.issue.body == 'PUBLIC_IAP_REDIRECT_DIAG:2026-11-08') ||
       (github.event.issue.title == 'Computer Browser: diagnose Google OAuth authorization' &&
        github.event.issue.body == 'PUBLIC_GOOGLE_OAUTH_STATUS:2026-11-08'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Inspect only no-cookie, no-token IAP OAuth request and optional anonymous Google response
        env:
          OWNER_ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [ "$OWNER_ISSUE_TITLE" = 'Computer Browser: diagnose Google OAuth authorization' ]; then
            python scripts/check_browser_iap_redirect.py --check-google > "$RUNNER_TEMP/plenum-iap-redirect-result.json"
          else
            python scripts/check_browser_iap_redirect.py > "$RUNNER_TEMP/plenum-iap-redirect-result.json"
          fi
      - name: Post only sanitized booleans and status to founder issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          python - <<'PY' > "$RUNNER_TEMP/plenum-iap-summary.md"
          import json, os
          from pathlib import Path
          result_path = Path(os.environ["RUNNER_TEMP"]) / "plenum-iap-redirect-result.json"
          if not result_path.exists():
              print("BLOCKED: Read-only public IAP redirect probe did not run.")
          else:
              result = json.loads(result_path.read_text())
              status = result.get("status","unavailable")
              print("Read-only IAP -> Google OAuth redirect audit: " + str(status))
              for field in (
                  "attached_client_matches_founder_registered_client",
                  "client_id_present",
                  "callback_matches_same_client_iap_redirect",
                  "recognized_google_oauth_path",
                  "response_type_is_code",
                  "state_parameter_present",
                  "scope_parameter_present",
                  "http_status",
                  "google_request_status",
                  "google_known_error_class",
                  "google_response_may_differ_without_user_cookies",
                  "hop",
              ):
                  if field in result:
                      print("- " + field + ": " + str(result[field]))
              print("\nNo Google login attempted, no IAM configuration changes and no OAuth URL, client ID, state, cookies or tokens disclosed. A matching public redirect does not establish successful user authentication.")
          PY
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/plenum-iap-summary.md"

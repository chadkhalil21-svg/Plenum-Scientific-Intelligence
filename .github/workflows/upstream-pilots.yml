name: Verify Reused OpenHands and PaperQA Libraries
on:
  pull_request:
    paths:
      - 'src/plenum_ai/upstream_pilots.py'
      - 'tests/test_upstream_pilots.py'
      - '.github/workflows/upstream-pilots.yml'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'src/plenum_ai/upstream_pilots.py'
      - 'tests/test_upstream_pilots.py'
      - '.github/workflows/upstream-pilots.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e .
          python -m unittest discover -s tests -p 'test_upstream_pilots.py' -v
          python -m plenum_ai.upstream_pilots --provider openhands --out reports/openhands-plan.json
          python -m plenum_ai.upstream_pilots --provider paperqa --out reports/paperqa-plan.json
  optional-real-sdk-import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: openhands
            extra: openhands_sdk
            python: '3.12'
          - provider: paperqa
            extra: paperqa
            python: '3.11'
    env:
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install only the pinned optional public library
        run: python -m pip install -e '.[${{ matrix.extra }}]'
      - name: Verify upstream exports without creating agents or querying documents
        run: |
          python -m plenum_ai.upstream_pilots \
            --provider "${{ matrix.provider }}" --verify-library \
            --out "reports/${{ matrix.provider }}-api.json"
      - name: Refuse model calls, indexing, untrusted commands or AGI claims
        env:
          SDK_PROVIDER: ${{ matrix.provider }}
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open(f"reports/{os.environ['SDK_PROVIDER']}-api.json"))
          assert d['api_import_verified'] is True
          assert d['model_calls'] == d['external_api_calls'] == 0
          for flag in ('agent_executed','documents_indexed','deployment','AGI_demonstrated'):
              assert d[flag] is False
          print("Verified pinned upstream Python API, with no agent or LLM execution")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upstream-sdk-${{ matrix.provider }}
          path: reports/
          retention-days: 14

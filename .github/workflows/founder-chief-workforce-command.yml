name: Plenum Chief | Founder Model-Directed Specialist Command
on:
  issues:
    types: [opened]
  pull_request:
    paths:
      - 'src/plenum_ai/chief_workforce_command.py'
      - 'tests/test_chief_workforce_command.py'
      - 'src/plenum_ai/chief_team_mission.py'
      - 'tests/test_chief_team_mission.py'
      - 'tests/test_chief_data_mission.py'
      - 'src/plenum_ai/chief_contract_plan.py'
      - 'tests/test_chief_contract_plan.py'
      - 'tests/test_chief_contract_efficiency.py'
      - 'tests/test_chief_plan_diagnostics.py'
      - 'src/plenum_ai/chief_domain_transfer.py'
      - 'tests/test_chief_bounded_goal_quality.py'
      - 'src/plenum_ai/mission_checkpoint.py'
      - 'src/plenum_ai/ambient_quality_insights.py'
      - 'tests/test_google_egm_aqua_quality.py'
      - '.github/workflows/founder-chief-workforce-command.yml'
permissions:
  contents: read
concurrency:
  group: plenum-${{ github.event_name == 'pull_request' && github.workflow || 'founder-public-issue' }}-${{ github.event.issue.number || github.event.client_payload.issue_number || github.ref }}
  cancel-in-progress: false
jobs:
  policy-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original worker reuse, founder identity and public-only authorization
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -p 'test_chief_workforce_command.py' -v
          python -m unittest discover -s tests -p 'test_chief_team_mission.py' -v
          python -m pip install -e '.[numerical]'
          python -m unittest discover -s tests -p 'test_chief_data_mission.py' -v
          python -m unittest discover -s tests -p 'test_chief_contract_plan.py' -v
          python -m unittest discover -s tests -p 'test_chief_contract_efficiency.py' -v
          python -m unittest discover -s tests -p 'test_chief_plan_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_chief_domain_transfer.py' -v
          python -m unittest discover -s tests -p 'test_chief_bounded_goal_quality.py' -v
          python -m unittest discover -s tests -p 'test_google_egm_aqua_quality.py' -v
  founder-command:
    if: >-
      github.event_name == 'issues' &&
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      github.event.issue.user.login == 'chadkhalil21-svg' &&
      (github.event.issue.title == '[Plenum Chief] public assignment' ||
       github.event.issue.title == '[Plenum Chief] public mission')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      issues: write
      actions: read  # verify exact same-run attempt-one metadata for a checkpoint retry
    env:
      PLENUM_TASK_KIND: ${{ github.event.issue.title }}
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: First validate founder and PUBLIC task without starting a model
        run: |
          python -m pip install -e .
          if [ "$PLENUM_TASK_KIND" = '[Plenum Chief] public mission' ]; then
            python -m plenum_ai.chief_team_mission --event "$GITHUB_EVENT_PATH"
          else
            python -m plenum_ai.chief_workforce_command --event "$GITHUB_EVENT_PATH"
          fi
      - name: Install existing dependencies only for validated task scope
        id: scope
        run: |
          python - <<'PY'
          import glob,json,os,subprocess,sys
          from plenum_ai.public_issue_wake import original_chief_worker_extras
          paths=glob.glob('reports/workforce-chief/chief-result-*.json')
          assert len(paths)==1, 'Missing preflight founder scope record'
          data=json.load(open(paths[0],encoding='utf-8'))
          assert data['status']=='SOURCE_READY_NOT_EXECUTED'
          # Original explicitly scoped contract pairs (NOAA / DOI / cooling)
          # already have independently validated deterministic dependencies.
          # Do not install or pull Qwen when no planner can be necessary.
          needs_model=(data.get('planned_model_team_mission') is True or
                       (data.get('planned_data_mission') is True
                        and data.get('planned_contract_mission') is not True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('needs_local_model='+str(needs_model).lower()+'\n')
              out.write('team_planner='+str(data.get('planned_model_team_mission') is True).lower()+'\n')
          if needs_model:
              subprocess.check_call([sys.executable,'-m','pip','install','-e','.[chief_of_staff]'])
          extras=original_chief_worker_extras(data)
          if extras:
              subprocess.check_call([sys.executable,'-m','pip','install','-e',extras])
          else:
              print('Existing standard-library workers only; no extra model/dependencies installed')
          PY
      - name: Restore ORIGINAL completed specialist artifacts on an exact same-run failed-job retry
        if: github.run_attempt > 1
        uses: actions/download-artifact@v4
        with:
          name: chief-founder-public-${{ github.event.issue.number }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: reports/workforce-chief
      - name: Reserve ORIGINAL native owner execution before any model or specialist
        id: native-reservation
        env:
          GH_TOKEN: ${{ github.token }}
          PLENUM_PUBLIC_ISSUE: ${{ github.event.issue.number }}
        run: >-
          python -m plenum_ai.public_issue_wake --issue-number "$PLENUM_PUBLIC_ISSUE"
          --execute --reserve-native-issue
      - name: Start existing bounded Qwen only for a new data plan
        id: data_model
        if: steps.native-reservation.outputs.authorized == 'true' && steps.scope.outputs.needs_local_model == 'true'
        env:
          PLENUM_TEAM_PLANNER: ${{ steps.scope.outputs.team_planner }}
        run: |
          if find reports/workforce-chief -maxdepth 1 \( -name 'chief-data-plan-*.json' -o -name 'chief-contract-plan-*.json' -o -name 'chief-team-plan-*.json' \) -print -quit | read -r saved; then
            echo 'Saved immutable plan will be validated and reused; no model started'
            exit 0
          fi
          model=qwen3:1.7b
          memory=5g
          if [ "$PLENUM_TEAM_PLANNER" = "true" ]; then
            model=qwen3.5:4b
            memory=8g
          fi
          docker pull ollama/ollama:latest
          docker run -d --rm --name plenum-chief-data-qwen \
            -p 127.0.0.1:11434:11434 -e OLLAMA_CONTEXT_LENGTH=2048 \
            -e OLLAMA_NUM_PARALLEL=1 --memory="$memory" --cpus=3 ollama/ollama:latest
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          docker exec plenum-chief-data-qwen ollama pull "$model"
          docker exec plenum-chief-data-qwen ollama list
          if [ "$PLENUM_TEAM_PLANNER" = "true" ]; then
            digest=$(docker exec plenum-chief-data-qwen ollama list | awk '$1=="qwen3.5:4b" {print $2}')
            test "$digest" = d8b0f5e9760c
          fi
      - name: Dispatch original specialists within validated task scope
        if: steps.native-reservation.outputs.authorized == 'true'
        env:
          PLENUM_EPHEMERAL_RUNNER: confirmed
          PLENUM_CHIEF_MODEL_URL: http://127.0.0.1:11434
        run: |
          if [ "$PLENUM_TASK_KIND" = '[Plenum Chief] public mission' ]; then
            timeout 600 python -m plenum_ai.chief_team_mission \
              --event "$GITHUB_EVENT_PATH" --execute --out-dir reports/workforce-chief
          else
            timeout 700 python -m plenum_ai.chief_workforce_command \
              --event "$GITHUB_EVENT_PATH" --execute --out-dir reports/workforce-chief
          fi
      - name: Independent local AQuA-informed review of REAL Chief output
        if: >-
          success() && steps.native-reservation.outputs.authorized == 'true' &&
          github.event.issue.title == '[Plenum Chief] public mission'
        run: >-
          python -m plenum_ai.ambient_quality_insights
          --issue "${{ github.event.issue.number }}"
          --root reports/workforce-chief
      - name: Durable founder status, no task text or credentials in comment
        if: always() && steps.native-reservation.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from urllib.request import Request,urlopen
          issue=int(os.environ['GH_ISSUE'])
          run=os.environ['GITHUB_RUN_ID']
          p=Path('reports/workforce-chief')/('chief-result-'+str(issue)+'.json')
          if p.is_file():
              item=json.loads(p.read_text())
              status=item.get('status','BLOCKED')
              if item.get('mode') == 'multi':
                  lines=['team='+','.join(item.get('specialists',[])[:3])[:180]
                         +'; executed='+str(item.get('executed_workers',0))
                         +'; worker_artifacts_technically_verified='+str(item.get('worker_artifacts_technically_verified',False))
                         +'; founder_objective_verified='+str(item.get('founder_objective_verified',False))
                         +'; named_subject_screen='+str(item.get('named_entity_evidence','NOT_EVALUATED'))[:65]
                         +'; scopes='+','.join(str(x.get('verified_scope',''))[:48]
                                             for x in item.get('worker_results',[])[:3])]
                  options=[x['id'] for x in item.get('candidate_sources',[])[:3]
                           if x.get('activation')=='SOURCE_REFERENCE_ONLY_NOT_INSTALLED']
                  if options:
                      lines[0]+='; upstream_references_not_installed='+','.join(options)[:140]
              else:
                  keys=['specialist','chief_delegated','specialist_executed',
                        'independent_verified','worker_verified_scope']
                  lines=['; '.join(k+'='+str(item.get(k))[:110] for k in keys)]
          else:
              status='BLOCKED_CHIEF_OR_VERIFICATION'
              lines=['No independently verified model/worker result']
          q=Path('reports/workforce-chief')/('ambient-quality-'+str(issue)+'.json')
          if q.is_file() and not q.is_symlink():
              quality=json.loads(q.read_text(encoding='utf-8'))
              if (quality.get('original_issue_number')==issue and
                  quality.get('schema')=='plenum-chief-offline-ambient-quality-v1'):
                  lines.append('Independent offline task-outcome gate: '+
                               str(quality.get('disposition','UNVERIFIED'))[:90])
          # Planned full-objective claims require the separate artifact reader.
          if (p.is_file() and item.get('dispatcher')=='original_chief_extractive_team_plan'
                  and item.get('founder_objective_verified') is True):
              accepted=(q.is_file() and not q.is_symlink()
                        and quality.get('original_issue_number')==issue
                        and quality.get('independent_planned_artifact_readback_passed') is True)
              if not accepted:
                  status='BLOCKED_OBJECTIVE_RELEVANCE'
                  lines[0]=lines[0].replace('founder_objective_verified=True','founder_objective_verified=False')
                  lines.append('Independent planned artifact readback did not pass')
          if (p.is_file() and item.get('status')=='VERIFIED_BOUNDED_CONTRACT_MISSION'
                  and item.get('founder_objective_verified') is True):
              accepted=(q.is_file() and not q.is_symlink()
                        and quality.get('original_issue_number')==issue
                        and quality.get('independent_contract_artifact_readback_passed') is True)
              if not accepted:
                  status='BLOCKED_CONTRACT_INTEGRITY'
                  lines[0]=lines[0].replace('founder_objective_verified=True','founder_objective_verified=False')
                  lines.append('Independent contract artifact readback did not pass')
          attempt=os.environ.get('GITHUB_RUN_ATTEMPT','1')
          if not attempt.isdecimal() or len(attempt)>3:
              raise ValueError('Invalid original GitHub run attempt')
          marker='<!-- plenum-founder-chief-run:'+run+':attempt:'+attempt+' -->'
          body=(marker+'\n**Chief status: '+status+'**\n'+'\n'.join(lines[:2])+
                '\nAttempt: '+attempt+
                '\nRun: https://github.com/'+os.environ['GH_REPO']+
                '/actions/runs/'+run+
                '\nPublic-only research or drafts; no credentials or external account changes.')
          root='https://api.github.com/repos/'+os.environ['GH_REPO']+'/issues/'+str(issue)+'/comments'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json',
                   'User-Agent':'PlenumChiefFounderWorkforce/1',
                   'X-GitHub-Api-Version':'2022-11-28'}
          # Original #693 bounded GitHub REST pagination; the reservation
          # itself can turn 99 comments into a full first page.
          prior=[]
          for page in range(1,6):
              req=Request(root+f'?per_page=100&page={page}',headers=headers)
              with urlopen(req,timeout=15) as response:
                  # Original weekly_founder_brief transport bound (#693).
                  raw=response.read(4_000_001)
              if len(raw)>4_000_000:
                  raise ValueError('Original GitHub response exceeds bounded audit limit')
              batch=json.loads(raw)
              if (not isinstance(batch,list) or len(batch)>100
                      or any(not isinstance(c,dict) or not isinstance(c.get('body'),str)
                             or (c.get('user') is not None and not isinstance(c['user'],dict))
                             for c in batch)):
                  raise ValueError('Untrusted original Chief comment page')
              prior.extend(batch)
              if len(batch)<100:
                  break
          else:
              raise ValueError('Original Chief comments exceed safe bounded pagination')
          if not any((c.get('user') or {}).get('login')=='github-actions[bot]'
                     and isinstance(c.get('body'),str)
                     and c['body'].splitlines()[:1]==[marker]
                     for c in prior if isinstance(c,dict)):
              data=json.dumps({'body':body}).encode()
              req=Request(root,data=data,method='POST',headers={
                  **headers,'Content-Type':'application/json'})
              with urlopen(req,timeout=15) as response:
                  assert response.status==201
              print('Founder receipt recorded')
          else:
              print('Founder receipt already recorded')
          PY
      - name: Retain bounded public Chief evidence only
        if: always() && steps.native-reservation.outputs.authorized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chief-founder-public-${{ github.event.issue.number }}
          path: |
            reports/workforce-chief/chief-result-*.json
            reports/workforce-chief/chief-checkpoint-*.json
            reports/workforce-chief/chief-data-plan-*.json
            reports/workforce-chief/chief-contract-plan-*.json
            reports/workforce-chief/chief-team-plan-*.json
            reports/workforce-chief/chief-recovery-*.json
            reports/workforce-chief/ambient-quality-*.json
            reports/workforce-chief/workers/**
          overwrite: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Destroy temporary data-planning model
        if: always() && steps.native-reservation.outputs.authorized == 'true' && steps.scope.outputs.needs_local_model == 'true'
        run: docker rm -f plenum-chief-data-qwen 2>/dev/null || true

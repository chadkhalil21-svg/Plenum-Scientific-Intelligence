name: Plenum Chief | Founder Model-Directed Specialist Command
on:
  issues:
    types: [opened]
  pull_request:
    paths:
      - 'src/plenum_ai/chief_workforce_command.py'
      - 'tests/test_chief_workforce_command.py'
      - 'src/plenum_ai/chief_team_mission.py'
      - 'tests/test_chief_team_mission.py'
      - '.github/workflows/founder-chief-workforce-command.yml'
permissions:
  contents: read
concurrency:
  group: founder-chief-model-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false
jobs:
  policy-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original worker reuse, founder identity and public-only authorization
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -p 'test_chief_workforce_command.py' -v
          python -m unittest discover -s tests -p 'test_chief_team_mission.py' -v
  founder-command:
    if: >-
      github.event_name == 'issues' &&
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      github.event.issue.user.login == 'chadkhalil21-svg' &&
      (github.event.issue.title == '[Plenum Chief] public assignment' ||
       github.event.issue.title == '[Plenum Chief] public mission')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      issues: write
    env:
      PLENUM_TASK_KIND: ${{ github.event.issue.title }}
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: First validate founder and PUBLIC task without starting a model
        run: |
          python -m pip install -e .
          if [ "$PLENUM_TASK_KIND" = '[Plenum Chief] public mission' ]; then
            python -m plenum_ai.chief_team_mission --event "$GITHUB_EVENT_PATH"
          else
            python -m plenum_ai.chief_workforce_command --event "$GITHUB_EVENT_PATH"
          fi
      - name: Install original numerical extras only for science scope
        run: |
          python - <<'PY'
          import glob,json,subprocess,sys
          paths=glob.glob('reports/workforce-chief/chief-result-*.json')
          assert len(paths)==1, 'Missing preflight founder scope record'
          data=json.load(open(paths[0],encoding='utf-8'))
          assert data['status']=='SOURCE_READY_NOT_EXECUTED'
          if ('public_science' in data.get('expected_team',[])
                  or data.get('expected_independent_kind') == 'public_science'):
              subprocess.check_call([sys.executable,'-m','pip','install','-e','.[numerical,orchestration]'])
          else:
              print('Existing standard-library workers only; no extra model/dependencies installed')
          PY
      - name: Dispatch original specialists deterministically for known public task scopes
        run: |
          if [ "$PLENUM_TASK_KIND" = '[Plenum Chief] public mission' ]; then
            timeout 600 python -m plenum_ai.chief_team_mission \
              --event "$GITHUB_EVENT_PATH" --execute --out-dir reports/workforce-chief
          else
            timeout 700 python -m plenum_ai.chief_workforce_command \
              --event "$GITHUB_EVENT_PATH" --execute --out-dir reports/workforce-chief
          fi
      - name: Durable founder status, no task text or credentials in comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from urllib.request import Request,urlopen
          issue=int(os.environ['GH_ISSUE'])
          run=os.environ['GITHUB_RUN_ID']
          p=Path('reports/workforce-chief')/('chief-result-'+str(issue)+'.json')
          if p.is_file():
              item=json.loads(p.read_text())
              status=item.get('status','BLOCKED')
              if item.get('mode') == 'multi':
                  lines=['team='+','.join(item.get('specialists',[])[:3])[:180]
                         +'; executed='+str(item.get('executed_workers',0))
                         +'; independently_verified='+str(item.get('independent_verified',False))
                         +'; scopes='+','.join(str(x.get('verified_scope',''))[:60]
                                             for x in item.get('worker_results',[])[:3])]
                  options=[x['id'] for x in item.get('candidate_sources',[])[:3]
                           if x.get('activation')=='SOURCE_REFERENCE_ONLY_NOT_INSTALLED']
                  if options:
                      lines[0]+='; upstream_references_not_installed='+','.join(options)[:140]
              else:
                  keys=['specialist','chief_delegated','specialist_executed',
                        'independent_verified','worker_verified_scope']
                  lines=['; '.join(k+'='+str(item.get(k))[:110] for k in keys)]
          else:
              status='BLOCKED_CHIEF_OR_VERIFICATION'
              lines=['No independently verified model/worker result']
          marker='<!-- plenum-founder-chief-run:'+run+' -->'
          body=(marker+'\n**Chief status: '+status+'**\n'+lines[0]+
                '\nRun: https://github.com/'+os.environ['GH_REPO']+
                '/actions/runs/'+run+
                '\nPublic-only research or drafts; no credentials or external account changes.')
          root='https://api.github.com/repos/'+os.environ['GH_REPO']+'/issues/'+str(issue)+'/comments'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json',
                   'User-Agent':'PlenumChiefFounderWorkforce/1',
                   'X-GitHub-Api-Version':'2022-11-28'}
          req=Request(root+'?per_page=100',headers=headers)
          with urlopen(req,timeout=15) as response:
              prior=json.loads(response.read(100001))
          if not any(marker in (c.get('body') or '') for c in prior if isinstance(c,dict)):
              data=json.dumps({'body':body}).encode()
              req=Request(root,data=data,method='POST',headers={
                  **headers,'Content-Type':'application/json'})
              with urlopen(req,timeout=15) as response:
                  assert response.status==201
              print('Founder receipt recorded')
          else:
              print('Founder receipt already recorded')
          PY
      - name: Retain bounded public Chief evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chief-founder-public-${{ github.event.issue.number }}
          path: |
            reports/workforce-chief/chief-result-*.json
            reports/workforce-chief/workers/*/issue-*/code/**
            reports/workforce-chief/workers/*/issue-*/creative/**
            reports/workforce-chief/workers/*/issue-*/public-science-summary.json
            reports/workforce-chief/workers/*/workforce-public-*.json
          if-no-files-found: ignore
          retention-days: 7

name: Plenum Chief | Founder Model-Directed Specialist Command
on:
  issues:
    types: [opened]
  pull_request:
    paths:
      - 'src/plenum_ai/chief_workforce_command.py'
      - 'tests/test_chief_workforce_command.py'
      - '.github/workflows/founder-chief-workforce-command.yml'
permissions:
  contents: read
concurrency:
  group: founder-chief-model-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false
jobs:
  policy-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original worker reuse, founder identity and public-only authorization
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -p 'test_chief_workforce_command.py' -v
  founder-command:
    if: >-
      github.event_name == 'issues' &&
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      github.event.issue.user.login == 'chadkhalil21-svg' &&
      github.event.issue.title == '[Plenum Chief] public assignment'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      issues: write
    env:
      PLENUM_EPHEMERAL_RUNNER: confirmed
      PLENUM_CHIEF_MODEL_URL: http://127.0.0.1:11434
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: First validate founder and PUBLIC task without starting a model
        run: |
          python -m pip install -e .
          python -m plenum_ai.chief_workforce_command --event "$GITHUB_EVENT_PATH"
      - name: Start free disposable local Qwen, not a paid inference API
        run: |
          docker pull ollama/ollama:latest
          docker run -d --rm --name plenum-founder-chief-qwen \
            --memory=5g --cpus=3 -p 127.0.0.1:11434:11434 \
            -e OLLAMA_CONTEXT_LENGTH=8192 -e OLLAMA_NUM_PARALLEL=1 \
            ollama/ollama:latest
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          docker exec plenum-founder-chief-qwen ollama pull qwen3:1.7b
      - name: Reuse pinned Deep Agents and previously validated Plenum workers
        run: |
          python -m pip install -e '.[chief_of_staff,numerical,orchestration]'
          python -m pip check
      - name: Model-driven Chief delegates one founder request and verifies actual worker
        run: |
          timeout 700 python -m plenum_ai.chief_workforce_command \
            --event "$GITHUB_EVENT_PATH" --execute --out-dir reports/workforce-chief
      - name: Durable founder status, no task text or credentials in comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from urllib.request import Request,urlopen
          issue=int(os.environ['GH_ISSUE'])
          run=os.environ['GITHUB_RUN_ID']
          p=Path('reports/workforce-chief')/('chief-result-'+str(issue)+'.json')
          if p.is_file():
              item=json.loads(p.read_text())
              status=item.get('status','BLOCKED')
              keys=['specialist','chief_delegated','specialist_executed',
                    'independent_verified','worker_verified_scope']
              lines=['; '.join(k+'='+str(item.get(k))[:110] for k in keys)]
          else:
              status='BLOCKED_CHIEF_OR_VERIFICATION'
              lines=['No independently verified model/worker result']
          marker='<!-- plenum-founder-chief-run:'+run+' -->'
          body=(marker+'\n**Chief status: '+status+'**\n'+lines[0]+
                '\nRun: https://github.com/'+os.environ['GH_REPO']+
                '/actions/runs/'+run+
                '\nPublic-only research or drafts; no credentials or external account changes.')
          root='https://api.github.com/repos/'+os.environ['GH_REPO']+'/issues/'+str(issue)+'/comments'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json',
                   'User-Agent':'PlenumChiefFounderWorkforce/1',
                   'X-GitHub-Api-Version':'2022-11-28'}
          req=Request(root+'?per_page=100',headers=headers)
          with urlopen(req,timeout=15) as response:
              prior=json.loads(response.read(100001))
          if not any(marker in (c.get('body') or '') for c in prior if isinstance(c,dict)):
              data=json.dumps({'body':body}).encode()
              req=Request(root,data=data,method='POST',headers={
                  **headers,'Content-Type':'application/json'})
              with urlopen(req,timeout=15) as response:
                  assert response.status==201
              print('Founder receipt recorded')
          else:
              print('Founder receipt already recorded')
          PY
      - name: Retain bounded public Chief evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chief-founder-public-${{ github.event.issue.number }}
          path: reports/workforce-chief/chief-result-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove ephemeral model
        if: always()
        run: docker rm -f plenum-founder-chief-qwen 2>/dev/null || true

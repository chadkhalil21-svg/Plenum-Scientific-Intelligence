name: Plenum Public Workforce | Free Event Wake
on:
  repository_dispatch:
    types: [plenum_public_issue_wakeup]
  # Reuse the ORIGINAL owner-approved public issue itself as immediate
  # event-driven wake; no competing scheduler, agent or second host.
  issue_comment:
    types: [created, edited]
  pull_request:
    paths:
      - 'integrations/cloudflare/**'
      - 'src/plenum_ai/owner_private_memory_client.py'
      - 'tests/test_owner_private_memory_client.py'
      - 'src/plenum_ai/public_issue_wake.py'
      - 'src/plenum_ai/role_skill_router.py'
      - 'tests/test_public_issue_wake.py'
      - 'tests/test_role_skill_router.py'
      - '.github/workflows/plenum-free-public-wake.yml'
permissions:
  contents: read
concurrency:
  # Same repository-wide issue lock as original public inbox workflow.
  group: plenum-${{ github.event_name == 'pull_request' && github.workflow || 'founder-public-issue' }}-${{ github.event.issue.number || github.event.client_payload.issue_number || github.ref }}
  cancel-in-progress: false
jobs:
  focused-scope-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_public_issue_wake.py' -v
      - run: python -m unittest discover -s tests -p 'test_owner_private_memory_client.py' -v
      - run: python -m unittest discover -s tests -p 'test_role_skill_router.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test integrations/cloudflare/plenum-github-wake-worker.test.mjs integrations/cloudflare/plenum-private-continuity.test.mjs integrations/cloudflare/plenum-private-memory-check.test.mjs integrations/cloudflare/plenum-free-coding-ai.test.mjs
      # The real Cloudflare preview build failed after source-only CI passed.
      # Check the real upstream Wrangler bundler/config, no token or deployment.
      - name: Verify existing Worker bundles with official Wrangler without deployment
        working-directory: integrations/cloudflare
        run: npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/plenum-worker-bundle
  resume-original-task:
    if: >-
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      (github.event_name == 'repository_dispatch' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.user.login == 'chadkhalil21-svg' &&
        github.event.comment.user.login == 'chadkhalil21-svg' &&
        startsWith(github.event.comment.body, '<!-- plenum-minister-legacy-public-backlog-v1 -->')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      PLENUM_PUBLIC_ISSUE: ${{ github.event.client_payload.issue_number || github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Wake only missing ORIGINAL founder public tasks or exact Chief missions
        run: python -m plenum_ai.public_issue_wake --issue-number "$PLENUM_PUBLIC_ISSUE" --execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plenum-public-wake-${{ github.run_id }}
          path: reports/public-wake/
          if-no-files-found: ignore
          retention-days: 3

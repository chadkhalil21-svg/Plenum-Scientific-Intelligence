name: Funded Labs and Clinical Research Signals
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Public research topic; never private patent material"
        required: true
        default: "photonic sensing"
  schedule:
    - cron: "05 11 * * *"
  push:
    paths:
      - ".github/workflows/research-frontiers.yml"
      - "src/plenum_ai/research_frontiers.py"
      - "tests/test_research_frontiers.py"
permissions:
  contents: read
concurrency:
  group: plenum-research-frontier-signals
  cancel-in-progress: false
jobs:
  collect-public-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      TOPIC: ${{ github.event.inputs.topic || 'photonic sensing' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Verify independent NSF and ClinicalTrials API fixtures and failure handling
        run: python -m unittest discover -s tests -p test_research_frontiers.py -v
      - name: Retrieve public-funded project and registered clinical research metadata
        shell: bash
        run: python -m plenum_ai.cli research-frontiers --query "$TOPIC" --online --out reports/frontiers.json
      - name: Preserve original signal meanings and report every API outage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('reports/frontiers.json').read_text())
          assert x['schema']=='plenum-research-frontiers-v1'
          assert len(x['providers'])==2
          assert not x['laboratory_breakthrough_confirmed']
          assert not x['clinical_efficacy_established']
          for p in x['providers']:
              print(p['name'],p['status'],'records',len(p['records']),p.get('error_type'))
          if not any(p['status']=='retrieved_metadata' for p in x['providers']):
              raise RuntimeError('Both research signals are unavailable; no live success claimed')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: public-nsf-and-clinical-research-signals
          path: reports/frontiers.json
          retention-days: 14
  archive-public-signals:
    needs: collect-public-metadata
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research-memory
          path: public-memory
      - uses: actions/download-artifact@v7
        with:
          name: public-nsf-and-clinical-research-signals
          path: reports
      - name: Append one immutable public-source snapshot, never private text
        env:
          RUN_ID: ${{ github.run_id }}
          GIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          source=json.loads(Path('reports/frontiers.json').read_text())
          assert source['schema']=='plenum-research-frontiers-v1'
          assert not source['laboratory_breakthrough_confirmed']
          assert not source['clinical_efficacy_established']
          folder=Path('public-memory/evidence/frontiers')
          folder.mkdir(parents=True,exist_ok=True)
          path=folder/('run-'+os.environ['RUN_ID']+'.json')
          if path.exists(): raise FileExistsError('Immutable evidence file already exists')
          record={'schema':'plenum-public-frontier-signals-v1',
                  'run_id':os.environ['RUN_ID'],
                  'source_revision':os.environ['GIT_SHA'],
                  'results':source,
                  'independently_verified_laboratory_results':False}
          path.write_text(json.dumps(record,indent=2)+'\n')
          print('Source-linked public frontier signal saved:',path)
          PY
      - name: Commit evidence to public memory branch only
        run: |
          git -C public-memory config user.name "Plenum Research Ledger"
          git -C public-memory config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C public-memory add evidence/frontiers
          git -C public-memory commit -m "Archive NSF funding and clinical study registration signals"
          git -C public-memory push origin HEAD:research-memory

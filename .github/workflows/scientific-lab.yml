name: Verified Scientific Simulation Lab
on:
  workflow_dispatch:
    inputs:
      question:
        description: "Public research question; no unpublished patents or private data"
        required: true
        default: "Evaluate validated orbital, chemical, thermal and molecular models"
  push:
    paths:
      - '.github/workflows/scientific-lab.yml'
      - 'src/plenum_ai/lab.py'
      - 'tests/test_lab.py'
      - 'src/plenum_ai/world_model_probe.py'
      - 'tests/test_world_model_probe.py'
      - 'docs/JEPA_WORLD_MODELS_AND_SIMULATION.md'
permissions:
  contents: read
concurrency:
  group: verified-scientific-lab
  cancel-in-progress: true
jobs:
  solvers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install scientific libraries
        run: python -m pip install -e ".[science,ml,orchestration,astronomy]"
      - name: Run complete independent tests
        run: python -m unittest discover -s tests -v
      - name: Execute science tools
        shell: bash
        env:
          QUESTION: ${{ github.event.inputs.question }}
        run: |
          if [ -z "$QUESTION" ]; then
            QUESTION="Evaluate validated orbital, chemical, thermal and molecular models"
          fi
          python -m plenum_ai.cli lab --query "$QUESTION" --domains mechanics,chemistry,materials,electronics,molecules --out reports/scientific_lab.json
          python -m plenum_ai.cli solver-benchmark --out reports/solver_benchmark.json
      - name: Evaluate action-conditioned dynamics on sealed synthetic holdouts
        run: python -m plenum_ai.world_model_probe --output reports/world_model_synthetic_probe.json
      - name: Verify standards, provenance and no deployment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("reports/scientific_lab.json").read_text())
          b=json.loads(Path("reports/solver_benchmark.json").read_text())
          assert len(a["results"]) == 5
          assert a["known_model_checks_passed"]
          assert a["scientific_discovery_verified"] is False
          assert a["self_modified"] is False
          assert len(b["methods"]) == 3
          assert b["candidate_deployed"] is False
          assert b["least_calls_in_known_fixtures"]
          w=json.loads(Path("reports/world_model_synthetic_probe.json").read_text())
          assert w["schema"]=="plenum-world-model-synthetic-probe-v1"
          assert w["JEPA_model_trained"] is False
          assert w["real_world_digital_twin_verified"] is False
          assert w["general_intelligence_demonstrated"] is False
          for horizon in ("1","8","32"):
              nominal=w["heldout_action_sequences"][horizon]
              shifted=w["shifted_physics"][horizon]
              assert 0 < nominal["action_conditioned_rmse"] < nominal["action_blind_rmse"]
              assert shifted["action_conditioned_rmse"] > nominal["action_conditioned_rmse"]
          for horizon in ("1","8","32"):
              effect=w["counterfactual_action_reversal"][horizon]
              shifted_effect=w["shifted_counterfactual"][horizon]
              assert 0 < effect["action_conditioned_effect_rmse"] < effect["action_blind_effect_rmse"]
              assert shifted_effect["action_conditioned_effect_rmse"] > effect["action_conditioned_effect_rmse"]
          assert w["real_observational_data_used"] is False
          print("Solvers and heldout simulated action-intervention effects verified; not JEPA or AGI.")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: multidisciplinary-scientific-results
          path: reports/
          retention-days: 14

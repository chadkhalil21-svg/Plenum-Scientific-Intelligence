name: Inspect Evals | Real CPU Science Baseline
on:
  pull_request:
    paths:
      - 'src/plenum_ai/inspect_public_benchmark.py'
      - 'tests/test_inspect_public_benchmark.py'
      - '.github/workflows/inspect-science-baseline.yml'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'src/plenum_ai/inspect_public_benchmark.py'
      - 'tests/test_inspect_public_benchmark.py'
      - '.github/workflows/inspect-science-baseline.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inspect-real-science-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify bounded historical science benchmark protocol without downloading models
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -p 'test_inspect_public_benchmark.py' -v
          python -m plenum_ai.inspect_public_benchmark --out reports/inspect-science-plan.json
          python -m pip install --dry-run "inspect-evals==0.27.0" "transformers==5.22.1" "huggingface_hub>=1.2,<2"
      - uses: actions/upload-artifact@v7
        with:
          name: inspect-science-precommit
          path: reports/inspect-science-plan.json
          retention-days: 21
  model-inference:
    needs: offline-preflight
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release Inspect ARC science baseline'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install reviewed Inspect and Inspect Evals plus CPU-only local-model libraries
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[inspection]'
          python -m pip install "inspect-evals==0.27.0" "transformers==5.22.1" "accelerate>=1.1,<2" "huggingface_hub>=1.2,<2" safetensors
          python -m pip check
      - name: Verify immutable public checkpoint and download only pinned weights
        run: |
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import HfApi, snapshot_download
          from plenum_ai.hf_model import APPROVED_MODEL, APPROVED_REVISION
          from plenum_ai.inspect_public_benchmark import plan
          assert plan()['model_revision']==APPROVED_REVISION
          info=HfApi().model_info(APPROVED_MODEL,revision=APPROVED_REVISION)
          assert info.sha==APPROVED_REVISION
          path=snapshot_download(repo_id=APPROVED_MODEL,revision=APPROVED_REVISION)
          Path('reports').mkdir(exist_ok=True)
          Path('reports/model-path.txt').write_text(str(path),encoding='utf-8')
          print('Frozen Qwen model revision verified, without paid inference.')
          PY
      - name: Run official ARC Easy questions with actual CPU inference
        run: |
          MODEL_PATH="$(cat reports/model-path.txt)"
          inspect eval inspect_evals/arc_easy --model hf/local \
            -M "model_path=$MODEL_PATH" -M device=cpu -M do_sample=false -M enable_thinking=false \
            --limit 12 --max-connections 1 --max-tokens 48 --temperature 0 \
            --log-dir reports/inspect-real-logs --display none
      - name: Run official ARC Challenge questions with actual CPU inference
        run: |
          MODEL_PATH="$(cat reports/model-path.txt)"
          inspect eval inspect_evals/arc_challenge --model hf/local \
            -M "model_path=$MODEL_PATH" -M device=cpu -M do_sample=false -M enable_thinking=false \
            --limit 12 --max-connections 1 --max-tokens 48 --temperature 0 \
            --log-dir reports/inspect-real-logs --display none
      - name: Independently audit original Inspect scores
        run: |
          python -m plenum_ai.inspect_public_benchmark \
            --audit-dir reports/inspect-real-logs \
            --out reports/inspect-science-audit.json
          python - <<'PY'
          import json
          d=json.load(open('reports/inspect-science-audit.json'))
          assert d['total_attempted']==24 and d['independently_scored']
          assert not d['AGI_demonstrated'] and not d['automatic_promotion']
          print('Real Inspect scores:',d['domain_scores'])
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inspect-real-science-original-results
          path: |
            reports/inspect-science-audit.json
            reports/inspect-real-logs/
          retention-days: 90
  archive-independent-audit:
    needs: model-inference
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research-memory
          path: ledger
      - uses: actions/download-artifact@v7
        with:
          name: inspect-real-science-original-results
          path: reports/
      - name: Append public science result only after independent checks
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('reports/inspect-science-audit.json').read_text())
          assert d['independently_scored'] and d['total_attempted']==24
          assert d['AGI_demonstrated'] is False and d['automatic_promotion'] is False
          root=Path('ledger/evidence/inspect-real-science')
          root.mkdir(parents=True,exist_ok=True)
          output=root/('run-'+os.environ['RUN_ID']+'.json')
          if output.exists():raise FileExistsError('Cannot overwrite existing scientific evidence')
          d['source_sha']=os.environ['SOURCE_SHA']
          output.write_text(json.dumps(d,indent=2)+'\n')
          print('Archived measured baseline:',output)
          PY
      - name: Commit evidence only, never weights or private research
        run: |
          git -C ledger config user.name 'Plenum Scientific Evidence'
          git -C ledger config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C ledger add evidence/inspect-real-science/
          git -C ledger commit -m 'Archive independently scored Inspect science baseline'
          git -C ledger pull --rebase origin research-memory
          git -C ledger push origin HEAD:research-memory

  original-gpqa-three-sciences:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release original GPQA three-domain')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      HF_TOKEN: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Reuse original Inspect GPQA task and pinned locally inferred Qwen; no additional evaluator
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[inspection]'
          python -m pip install 'inspect-evals==0.27.0' 'transformers==5.22.1' 'accelerate>=1.1,<2' 'huggingface_hub>=1.2,<2' safetensors
          python -m pip check
          python - <<'PY'
          from importlib import metadata
          import acp.helpers
          assert metadata.version('inspect-ai')=='0.3.287'
          assert metadata.version('inspect-evals')=='0.27.0'
          assert metadata.version('agent-client-protocol')=='0.12.1'
          from inspect_evals.gpqa import gpqa_diamond
          assert callable(gpqa_diamond)
          print('Original externally scored GPQA Diamond already available in Inspect Evals.')
          PY
      - name: Fetch the same frozen public Qwen3-0.6B checkpoint, no API keys
        run: |
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import HfApi,snapshot_download
          from plenum_ai.hf_model import APPROVED_MODEL,APPROVED_REVISION
          assert APPROVED_MODEL=='Qwen/Qwen3-0.6B'
          assert HfApi().model_info(APPROVED_MODEL,revision=APPROVED_REVISION).sha==APPROVED_REVISION
          Path('reports').mkdir(exist_ok=True)
          Path('reports/original-gpqa-model-path.txt').write_text(
              snapshot_download(repo_id=APPROVED_MODEL,revision=APPROVED_REVISION),
              encoding='utf-8')
          print('Frozen previously established public model revision verified.')
          PY
      - name: Run three independent original expert science cases with fixed benchmark answers
        run: |
          MODEL_PATH="$(cat reports/original-gpqa-model-path.txt)"
          for DOMAIN in Biology Chemistry Physics; do
            inspect eval inspect_evals/gpqa_diamond --model hf/local \
              -M "model_path=$MODEL_PATH" -M device=cpu -M do_sample=false -M enable_thinking=false \
              -T high_level_domain="$DOMAIN" -T cot=false \
              --limit 1 --epochs 1 --max-samples 1 --max-connections 1 \
              --max-tokens 256 --max-retries 0 --temperature 0 --time-limit 500 \
              --log-dir "reports/inspect-original-gpqa-logs/$DOMAIN" --display none
          done
      - name: Preserve original scorer results including all wrong answers
        run: |
          python - <<'PY'
          from inspect_ai.log import list_eval_logs,read_eval_log
          from inspect_ai.scorer import CORRECT,INCORRECT
          from plenum_ai.hf_model import APPROVED_REVISION
          import hashlib,json
          from pathlib import Path
          cases={}
          all_ids=set()
          for domain in ('Biology','Chemistry','Physics'):
              logs=list_eval_logs(log_dir='reports/inspect-original-gpqa-logs/'+domain)
              assert len(logs)==1, 'One original log per domain required'
              log=read_eval_log(logs[0].name)
              assert log.status=='success' and not log.error
              assert log.eval.task in ('gpqa_diamond','inspect_evals/gpqa_diamond')
              assert log.eval.model=='hf/local'
              assert str(log.eval.model_args.get('model_path','')).endswith(APPROVED_REVISION)
              assert len(log.samples or [])==1
              sample=log.samples[0]
              original_scores=list((sample.scores or {}).values())
              assert len(original_scores)==1 and original_scores[0].value in (CORRECT,INCORRECT)
              ident=str(sample.id)
              assert ident and ident not in all_ids
              all_ids.add(ident)
              cases[domain]={
                  'original_task_id':ident,
                  'original_scorer_correct':original_scores[0].value==CORRECT,
                  'original_eval_sha256':hashlib.sha256(Path(logs[0].name).read_bytes()).hexdigest(),
              }
          report={
              'schema':'plenum-three-original-gpqa-diamond-v1',
              'upstream_evaluator':'inspect_evals/gpqa_diamond 0.27.0, original independent choice scorer',
              'model':'Qwen/Qwen3-0.6B',
              'revision':APPROVED_REVISION,
              'real_inference_executed':True,
              'attempted':3,
              'correct':sum(int(x['original_scorer_correct']) for x in cases.values()),
              'by_domain':cases,
              'dataset':'Original OpenAI GPQA Diamond fixed-choice public dataset, pinned upstream checksum',
              'paid_api_calls':0,
              'scientific_discovery':False,
              'tool_using_agent_demonstrated':False,
              'AGI_demonstrated':False,
              'limitations':['Exactly one public expert science question per domain; not statistical model ranking',
                'Possible prior training exposure','No autonomous scientific task execution or learning demonstrated'],
          }
          Path('reports/original-gpqa-three-sciences.json').write_text(
              json.dumps(report,indent=2)+'\n')
          print('Original GPQA science:',report['correct'],'/3; per domain',
                {k:v['original_scorer_correct'] for k,v in cases.items()})
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-gpqa-three-domain-independent-grades
          path: |
            reports/original-gpqa-three-sciences.json
            reports/inspect-original-gpqa-logs/
          retention-days: 90

  original-gpqa-archived-score-recovery:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release GPQA archive-only scorer recovery')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Recover original already scored GPQA logs from prior immutable Actions run
        uses: actions/download-artifact@v7
        with:
          name: original-gpqa-three-domain-independent-grades
          run-id: 42563122617
          repository: chadkhalil21-svg/Plenum-Scientific-Intelligence
          github-token: ${{ github.token }}
          path: reports/
      - name: Install ONLY the established original Inspect log reader; no model or eval execution
        run: python -m pip install -e '.[inspection]'
      - name: Audit existing original science scores, without any model inference
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          from hashlib import sha256
          import json
          from inspect_ai.log import list_eval_logs, read_eval_log
          from inspect_ai.scorer import CORRECT, INCORRECT
          from plenum_ai.hf_model import APPROVED_REVISION
          results={}
          root=Path("reports/inspect-original-gpqa-logs").resolve()
          assert root.is_dir(), "Archived original run logs missing"
          for domain in ("Biology","Chemistry","Physics"):
              folder=root/domain
              logs=list_eval_logs(log_dir=str(folder))
              assert len(logs)==1, "Original logs must contain exactly one case per domain"
              log=read_eval_log(logs[0].name)
              assert log.status=="success" and not log.error
              assert log.eval.task in ("gpqa_diamond","inspect_evals/gpqa_diamond")
              assert log.eval.model=="hf/local"
              assert str(log.eval.model_args.get("model_path","")).endswith(APPROVED_REVISION)
              assert len(log.samples or [])==1
              sample=log.samples[0]
              assert sample.metadata["high_level_domain"]==domain
              scores=list((sample.scores or {}).values())
              assert len(scores)==1 and scores[0].value in (CORRECT, INCORRECT)
              uri=logs[0].name
              disk=Path(unquote(urlsplit(uri).path)) if uri.startswith("file:") else Path(uri)
              assert disk.is_file() and disk.resolve().is_relative_to(root), "Archived original log path invalid"
              results[domain]={
                  "sample_id":str(sample.id),
                  "original_scorer_correct":scores[0].value==CORRECT,
                  "eval_sha256":sha256(disk.read_bytes()).hexdigest(),
              }
          assert len({v["sample_id"] for v in results.values()})==3
          report={
              "schema":"plenum-gpqa-original-three-sciences-archived-scores-v1",
              "upstream":"Original Inspect Evals GPQA Diamond task and scorer 0.27.0",
              "source_scored_run_id":42563122617,
              "source_artifact_id":13650326627,
              "model":"Qwen/Qwen3-0.6B",
              "frozen_revision":APPROVED_REVISION,
              "no_new_model_inference":True,
              "model_attempts_in_source_run":3,
              "original_cases_attempted":3,
              "original_cases_correct":sum(int(v["original_scorer_correct"]) for v in results.values()),
              "by_domain":results,
              "paid_model_api_calls":0,
              "original_scientific_discovery":False,
              "general_intelligence_demonstrated":False,
              "limitations":[
                  "Three public historically available questions, one per domain",
                  "May overlap published pretraining data",
                  "Not statistically adequate for model rankings",
                  "Does not demonstrate autonomous science or reliable tool use"
              ]
          }
          Path("reports/original-gpqa-three-sciences.json").write_text(json.dumps(report,indent=2)+"\n")
          print("RECOVERED ORIGINAL GPQA:",report["original_cases_correct"],"/3",
                {k:v["original_scorer_correct"] for k,v in results.items()})
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recovered-original-gpqa-three-science-scores-no-inference
          path: reports/original-gpqa-three-sciences.json
          retention-days: 90

  qwen35-official-science-paired:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release Qwen3.5-4B original paired science')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HF_TOKEN: ''
      LOCAL_API_KEY: 'local-only'
      LOCAL_BASE_URL: 'http://127.0.0.1:18080/v1'
      OPENAI_API_KEY: ''
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Reuse existing original Inspect science grader, not another evaluator
        run: |
          python -m pip install -e '.[inspection]'
          python -m pip install 'inspect-evals==0.27.0' 'huggingface_hub>=1.2,<2' 'openai>=2,<3'
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          from inspect_evals.gpqa import gpqa_diamond
          import acp.helpers
          assert version('inspect-ai')=='0.3.287' and version('inspect-evals')=='0.27.0'
          assert callable(gpqa_diamond)
          PY
      - name: Download SHA256 pinned official llama.cpp CPU binary and existing published quantization
        run: |
          mkdir -p reports/bin
          curl -fsSL --retry 2 --max-time 150 https://github.com/ggml-org/llama.cpp/releases/download/b11146/llama-b11146-bin-ubuntu-x64.tar.gz -o reports/llama-b11146.tar.gz
          echo 'c150306eb16b5ab696f76a8bdf810c35fd98a24e82158742e6fa28f420ff8410  reports/llama-b11146.tar.gz' | sha256sum -c
          tar -xzf reports/llama-b11146.tar.gz -C reports/bin
          find reports/bin -type f -name llama-server -executable | head -1 > reports/llama-server-path.txt
          test -s reports/llama-server-path.txt
          python - <<'PY'
          from huggingface_hub import HfApi,hf_hub_download
          from pathlib import Path
          from hashlib import sha256
          repo='unsloth/Qwen3.5-4B-GGUF'
          revision=HfApi().model_info(repo).sha
          model=Path(hf_hub_download(repo_id=repo,filename='Qwen3.5-4B-Q4_K_M.gguf',revision=revision))
          if sha256(model.read_bytes()).hexdigest()!='00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4':
              raise SystemExit('Quantized-model checksum mismatch; inference forbidden')
          Path('reports/model-path.txt').write_text(str(model))
          Path('reports/quant-commit.txt').write_text(revision)
          print('Verified Qwen3.5-4B Q4_K_M and exact source revision',revision)
          PY
      - name: Start existing llama.cpp model API bound only to loopback
        run: |
          SERVER="$(cat reports/llama-server-path.txt)"
          MODEL="$(cat reports/model-path.txt)"
          export LD_LIBRARY_PATH="$(dirname "$SERVER")"
          "$SERVER" --help > reports/server-help.txt 2>&1
          grep -F -- '--reasoning' reports/server-help.txt >/dev/null
          "$SERVER" -m "$MODEL" --host 127.0.0.1 --port 18080 --ctx-size 4096 --threads 2 --gpu-layers 0 --jinja --reasoning off --alias qwen35-4b > reports/server.log 2>&1 &
          python - <<'PY'
          import json,time,urllib.request
          for _ in range(110):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18080/health',timeout=2) as r:
                      if json.loads(r.read()).get('status')=='ok':break
              except Exception:pass
              time.sleep(2)
          else:raise SystemExit('Original model local server not ready; no grade claimed')
          print('Original 4B pretrained model listening on localhost only')
          PY
      - name: Score EXACT same original biology chemistry physics questions, only NEW model
        run: |
          for DOMAIN in Biology Chemistry Physics; do
            inspect eval inspect_evals/gpqa_diamond --model openai-api/local/qwen35-4b -T high_level_domain="$DOMAIN" -T cot=false --limit 1 --epochs 1 --max-samples 1 --max-connections 1 --max-tokens 256 --max-retries 0 --temperature 0 --time-limit 390 --log-dir "reports/qwen35-original-gpqa/$DOMAIN" --display none
          done
      - name: Preserve original independent grades and difference from PREEXISTING Qwen0.6 evidence
        run: |
          python - <<'PY'
          from inspect_ai.log import list_eval_logs,read_eval_log
          from inspect_ai.scorer import CORRECT,INCORRECT
          from pathlib import Path
          from urllib.parse import urlsplit,unquote
          from hashlib import sha256
          import json
          reference={'Biology':('rec2ZTsqazBZ3LTWZ',False),'Chemistry':('rec0Arme2jcXQZnAW',True),'Physics':('rec06pnAkLOr2t2mp',False)}
          rows={}
          for domain,(id,old) in reference.items():
              logs=list_eval_logs(log_dir='reports/qwen35-original-gpqa/'+domain)
              assert len(logs)==1
              log=read_eval_log(logs[0].name)
              assert log.status=='success' and not log.error
              assert log.eval.model=='openai-api/local/qwen35-4b'
              assert len(log.samples or [])==1
              sample=log.samples[0]
              assert str(sample.id)==id and sample.metadata['high_level_domain']==domain
              scores=list((sample.scores or {}).values())
              assert len(scores)==1 and scores[0].value in (CORRECT,INCORRECT)
              uri=logs[0].name
              file=Path(unquote(urlsplit(uri).path)) if uri.startswith('file:') else Path(uri)
              assert file.is_file()
              rows[domain]={'original_id':id,'prior_qwen06_correct':old,'qwen35_4b_correct':scores[0].value==CORRECT,'native_eval_sha256':sha256(file.read_bytes()).hexdigest()}
          right=sum(x['qwen35_4b_correct'] for x in rows.values())
          d={'schema':'plenum-qwen35-original-gpqa-three-paired-v1',
             'candidate':'Qwen/Qwen3.5-4B, Unsloth GGUF Q4_K_M',
             'quant_sha256':'00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4',
             'model_source_revision':Path('reports/quant-commit.txt').read_text(),
             'original_engine':'ggml-org/llama.cpp b11146, official binary digest verified',
             'original_scorer':'inspect_evals/gpqa_diamond 0.27.0',
             'previous_reference':'main evidence/inspect-gpqa/2026-11-09-original-three-sciences.json',
             'previous_model_NOT_rerun':True,'same_original_three_IDs':True,
             'prior_qwen06_3_questions_correct':1,'candidate_qwen35_3_questions_correct':right,
             'paired_difference':right-1,'rows':rows,
             'paid_model_api_calls':0,'auto_model_promotion':False,'AGI_demonstrated':False,
             'limitations':['Three public examples cannot prove statistical improvement or AGI',
             'Quantized 4B and nonquantized 0.6B are not controlled for architecture or inference compute',
             'No novel science or autonomous tool selection has yet been shown']}
          Path('reports/qwen35-original-paired-score.json').write_text(json.dumps(d,indent=2)+'\n')
          print('Original Qwen3.5-4B independent scores:',right,'/3; existing older Qwen3-0.6B 1/3, no repeated baseline inference')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qwen35-4b-original-paired-scientific-evidence
          path: |
            reports/qwen35-original-paired-score.json
            reports/qwen35-original-gpqa/
            reports/server.log
            reports/quant-commit.txt
          retention-days: 90

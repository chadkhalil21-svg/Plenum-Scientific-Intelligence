name: Inspect Evals | Real CPU Science Baseline
on:
  pull_request:
    paths:
      - 'src/plenum_ai/inspect_public_benchmark.py'
      - 'tests/test_inspect_public_benchmark.py'
      - '.github/workflows/inspect-science-baseline.yml'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'src/plenum_ai/inspect_public_benchmark.py'
      - 'tests/test_inspect_public_benchmark.py'
      - '.github/workflows/inspect-science-baseline.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inspect-real-science-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify bounded historical science benchmark protocol without downloading models
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -p 'test_inspect_public_benchmark.py' -v
          python -m plenum_ai.inspect_public_benchmark --out reports/inspect-science-plan.json
          python -m pip install --dry-run "inspect-evals==0.27.0" "transformers==5.22.1" "huggingface_hub>=1.2,<2"
      - uses: actions/upload-artifact@v7
        with:
          name: inspect-science-precommit
          path: reports/inspect-science-plan.json
          retention-days: 21
  model-inference:
    needs: offline-preflight
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release Inspect ARC science baseline'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install reviewed Inspect and Inspect Evals plus CPU-only local-model libraries
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[inspection]'
          python -m pip install "inspect-evals==0.27.0" "transformers==5.22.1" "accelerate>=1.1,<2" "huggingface_hub>=1.2,<2" safetensors
          python -m pip check
      - name: Verify immutable public checkpoint and download only pinned weights
        run: |
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import HfApi, snapshot_download
          from plenum_ai.hf_model import APPROVED_MODEL, APPROVED_REVISION
          from plenum_ai.inspect_public_benchmark import plan
          assert plan()['model_revision']==APPROVED_REVISION
          info=HfApi().model_info(APPROVED_MODEL,revision=APPROVED_REVISION)
          assert info.sha==APPROVED_REVISION
          path=snapshot_download(repo_id=APPROVED_MODEL,revision=APPROVED_REVISION)
          Path('reports').mkdir(exist_ok=True)
          Path('reports/model-path.txt').write_text(str(path),encoding='utf-8')
          print('Frozen Qwen model revision verified, without paid inference.')
          PY
      - name: Run official ARC Easy questions with actual CPU inference
        run: |
          MODEL_PATH="$(cat reports/model-path.txt)"
          inspect eval inspect_evals/arc_easy --model hf/local \
            -M "model_path=$MODEL_PATH" -M device=cpu -M do_sample=false \
            --limit 12 --max-connections 1 --max-tokens 48 --temperature 0 \
            --log-dir reports/inspect-real-logs --display none
      - name: Run official ARC Challenge questions with actual CPU inference
        run: |
          MODEL_PATH="$(cat reports/model-path.txt)"
          inspect eval inspect_evals/arc_challenge --model hf/local \
            -M "model_path=$MODEL_PATH" -M device=cpu -M do_sample=false \
            --limit 12 --max-connections 1 --max-tokens 48 --temperature 0 \
            --log-dir reports/inspect-real-logs --display none
      - name: Independently audit original Inspect scores
        run: |
          python -m plenum_ai.inspect_public_benchmark \
            --audit-dir reports/inspect-real-logs \
            --out reports/inspect-science-audit.json
          python - <<'PY'
          import json
          d=json.load(open('reports/inspect-science-audit.json'))
          assert d['total_attempted']==24 and d['independently_scored']
          assert not d['AGI_demonstrated'] and not d['automatic_promotion']
          print('Real Inspect scores:',d['domain_scores'])
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inspect-real-science-original-results
          path: |
            reports/inspect-science-audit.json
            reports/inspect-real-logs/
          retention-days: 90
  archive-independent-audit:
    needs: model-inference
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research-memory
          path: ledger
      - uses: actions/download-artifact@v7
        with:
          name: inspect-real-science-original-results
          path: reports/
      - name: Append public science result only after independent checks
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('reports/inspect-science-audit.json').read_text())
          assert d['independently_scored'] and d['total_attempted']==24
          assert d['AGI_demonstrated'] is False and d['automatic_promotion'] is False
          root=Path('ledger/evidence/inspect-real-science')
          root.mkdir(parents=True,exist_ok=True)
          output=root/('run-'+os.environ['RUN_ID']+'.json')
          if output.exists():raise FileExistsError('Cannot overwrite existing scientific evidence')
          d['source_sha']=os.environ['SOURCE_SHA']
          output.write_text(json.dumps(d,indent=2)+'\n')
          print('Archived measured baseline:',output)
          PY
      - name: Commit evidence only, never weights or private research
        run: |
          git -C ledger config user.name 'Plenum Scientific Evidence'
          git -C ledger config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C ledger add evidence/inspect-real-science/
          git -C ledger commit -m 'Archive independently scored Inspect science baseline'
          git -C ledger pull --rebase origin research-memory
          git -C ledger push origin HEAD:research-memory

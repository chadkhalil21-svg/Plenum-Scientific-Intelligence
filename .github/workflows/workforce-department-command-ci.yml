name: Plenum Nine Department | Founder Public Command Safety
on:
  pull_request:
    paths:
      - 'src/plenum_ai/workforce_department_command.py'
      - 'tests/test_workforce_department_command.py'
      - 'integrations/n8n/plenum-business-workforce.json'
      - '.github/workflows/business-workforce-n8n-agent-trial.yml'
      - '.github/workflows/workforce-department-command-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/plenum_ai/workforce_department_command.py'
      - 'tests/test_workforce_department_command.py'
permissions:
  contents: read
jobs:
  one-existing-department-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve all nine original roles and refuse unauthorized tasks
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -p test_workforce_department_command.py -v

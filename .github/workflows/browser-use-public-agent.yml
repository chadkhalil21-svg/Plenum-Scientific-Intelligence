name: Optional Browser Use AI Public Agent (Founder Approved)
on:
  issues:
    types: [opened]
  pull_request:
    paths:
      - 'tools/browser-use/**'
      - 'tests/test_browser_use_public_agent.py'
      - '.github/workflows/browser-use-public-agent.yml'
permissions:
  contents: read
  issues: write
jobs:
  policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate public founder task boundary and 2GiB probe syntax without installing model dependencies
        run: |
          python -m unittest discover -s tests -p test_browser_use_public_agent.py -v
          python -m py_compile tools/browser-use/owner_2g_fit_probe.py
  owner-public-agent:
    if: >-
      github.event_name == 'issues' &&
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      github.event.issue.user.login == 'chadkhalil21-svg' &&
      github.event.issue.title == 'Computer Browser: optional Browser Use public agent' &&
      github.event.issue.body == 'RUN_BROWSER_USE_PUBLIC:example.com:MAX_STEPS_5:2026-11-08'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require dedicated zero-priced model key before agent startup
        id: preflight
        env:
          BROWSER_USE_OPENROUTER_FREE_KEY: ${{ secrets.BROWSER_USE_OPENROUTER_FREE_KEY }}
        run: |
          if [ -n "$BROWSER_USE_OPENROUTER_FREE_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Dedicated OpenRouter free-model key exists (not printed); no paid fallback.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'No free-model key; no agent install, inference, or browser startup.'
          fi
      - name: Install pinned open-source Browser Use only when model configured
        if: steps.preflight.outputs.ready == 'true'
        run: |
          python -m pip install --disable-pip-version-check 'browser-use==0.13.14' 'uv==0.9.7'
          browser-use install
      - name: Run at most 5 public browser agent steps with no credentials
        if: steps.preflight.outputs.ready == 'true'
        env:
          BROWSER_USE_OPENROUTER_FREE_KEY: ${{ secrets.BROWSER_USE_OPENROUTER_FREE_KEY }}
          BROWSER_TASK_AUTHOR: ${{ github.event.issue.user.login }}
          BROWSER_TASK_TITLE: ${{ github.event.issue.title }}
          BROWSER_TASK_BODY: ${{ github.event.issue.body }}
          BROWSER_REPORT_PATH: ${{ runner.temp }}/plenum-browser-use-report.json
          ANONYMIZED_TELEMETRY: 'false'
        timeout-minutes: 3
        run: python tools/browser-use/public_agent.py
      - name: Report status only to exact founder issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          READY: ${{ steps.preflight.outputs.ready }}
          REPORT_PATH: ${{ runner.temp }}/plenum-browser-use-report.json
        shell: bash
        run: |
          if [ "$READY" != 'true' ]; then
            gh issue comment "$ISSUE" --body 'NOT CONFIGURED: optional Browser Use agent has no dedicated BROWSER_USE_OPENROUTER_FREE_KEY secret. No paid model fallback, no agent/model steps executed, and no TinyFish or Browser Use hosted subscription required. Only zero-priced OpenRouter free router is eligible; owner must supply an API key privately via GitHub Actions secrets.'
          elif [ ! -s "$REPORT_PATH" ]; then
            gh issue comment "$ISSUE" --body 'BLOCKED: Browser Use optional agent did not produce a verified public result. Inspect only the isolated setup stage, not website credentials. No account actions enabled.'
          else
            STATUS="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status","unknown"))' "$REPORT_PATH")"
            case "$STATUS" in
              verified_public_heading)
                gh issue comment "$ISSUE" --body 'PASS: Browser Use with OpenRouter zero-priced free model completed the isolated public example.com heading in <=5 agent steps, without a paid model, private accounts, site write, Browser Use hosted cloud, or TinyFish.' ;;
              *)
                gh issue comment "$ISSUE" --body 'NOT VERIFIED: Browser Use agent was installed/run but did not independently establish the expected public heading. No authenticated account access or site writes were approved.' ;;
            esac
          fi

  owner-local-ollama:
    if: >-
      github.event_name == 'issues' &&
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      github.event.issue.user.login == 'chadkhalil21-svg' &&
      (
        (github.event.issue.title == 'Computer Browser: optional Browser Use local Ollama' &&
         github.event.issue.body == 'RUN_BROWSER_USE_LOCAL_OLLAMA:arxiv.org:SKILLOPT_TITLE:MAX_STEPS_4:2026-11-12') ||
        (github.event.issue.title == 'Computer Browser: free public research' &&
         startsWith(github.event.issue.body, '{"schema":"plenum-browser-use-public-research-v1",'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned existing Browser Use and isolated Chromium
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check 'browser-use==0.13.14' 'uv==0.9.7'
          command -v uvx
          browser-use install
      - name: Start original free local Qwen on loopback
        timeout-minutes: 8
        run: |
          docker pull ollama/ollama:latest
          docker run -d --rm --name plenum-browser-use-local-ollama \
            --memory=5g --cpus=3 -p 127.0.0.1:11434:11434 \
            -e OLLAMA_CONTEXT_LENGTH=8192 -e OLLAMA_NUM_PARALLEL=1 \
            ollama/ollama:latest
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          docker exec plenum-browser-use-local-ollama ollama pull qwen3:1.7b
      - name: Run one genuine founder-scoped SkillOpt paper-title research task without paid inference
        timeout-minutes: 5
        env:
          PLENUM_BROWSER_FREE_LOCAL: confirmed
          BROWSER_TASK_AUTHOR: ${{ github.event.issue.user.login }}
          BROWSER_TASK_TITLE: ${{ github.event.issue.title }}
          BROWSER_TASK_BODY: ${{ github.event.issue.body }}
          BROWSER_REPORT_PATH: ${{ runner.temp }}/plenum-browser-use-local-report.json
          ANONYMIZED_TELEMETRY: 'false'
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          GOOGLE_API_KEY: ''
        run: python tools/browser-use/public_agent.py
      - name: Report actual local Browser Use result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          REPORT_PATH: ${{ runner.temp }}/plenum-browser-use-local-report.json
        run: |
          if [ ! -s "$REPORT_PATH" ]; then
            gh issue comment "$ISSUE" --body "BLOCKED: local Browser Use worker did not produce a result. Consult this original job. No paid provider or private account access was authorized."
          else
            STATUS="$(python -c 'import json,sys;print(json.load(open(sys.argv[1])).get("status","unknown"))' "$REPORT_PATH")"
            if [ "$STATUS" = verified_public_heading ]; then
              gh issue comment "$ISSUE" --body "PASS LIMITED: Browser Use with local Qwen/Ollama navigated the real SkillOpt arXiv paper, independently matched its visible title, and completed the task in <=4 model-directed steps, no model API key. This does NOT prove general browser autonomy or authenticated websites."
            elif [ "$STATUS" = completed_public_research_unverified_facts ]; then
              # The public research response is untrusted external-page text;
              # publish it as a concise quotation, never as project instructions.
              python - "$REPORT_PATH" > "$RUNNER_TEMP/public-research-response.txt" <<'PY'
          import json,sys
          record=json.load(open(sys.argv[1]))
          text=record.get("answer_untrusted","")
          url=record.get("task_source","")
          assert record.get("model_navigation_and_completion_verified") is True
          assert record.get("factual_answer_independently_verified") is False
          assert isinstance(text,str) and len(text)<=850 and isinstance(url,str)
          print("PUBLIC AGENT COMPLETE (source visit and model task completion verified; factual answer NOT independently verified).")
          print("Original public source: "+url)
          print("Untrusted source-based answer (review before use): "+text)
          print("No private login, site write, paid model key or guaranteed fact-check.")
          PY
              gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/public-research-response.txt"
            else
              gh issue comment "$ISSUE" --body "NOT VERIFIED: Browser Use with free local Qwen/Ollama returned $STATUS. Do not retry unchanged model, install paid API, or count task as completed."
            fi
          fi
      - name: Archive sanitized output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-local-browser-use-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/plenum-browser-use-local-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Destroy temporary model container
        if: always()
        run: docker rm -f plenum-browser-use-local-ollama 2>/dev/null || true


  owner-inference-fit-2g:
    # Novel resource-fit verification, NOT another public research demonstration.
    # Both cgroup memory caps SUM TO 1792 MiB, leaving 256 MiB for the owner
    # server and HTTPS pinned proxy within the existing Cloud Run 2048 MiB.
    if: >-
      github.event_name == 'issues' &&
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      github.event.issue.user.login == 'chadkhalil21-svg' &&
      github.event.issue.title == 'Computer Browser: verify 2GiB private inference fit' &&
      github.event.issue.body == 'CHECK_OWNER_2GI_QWEN3_0_6B_FIT:2026-11-13'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build disposable exact-upstream Chromium + Browser Use in public GitHub runner
        timeout-minutes: 9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plenum-2g-fit" "$RUNNER_TEMP/plenum-2g-result"
          cat > "$RUNNER_TEMP/plenum-2g-fit/Dockerfile" <<'DOCKER'
          FROM mcr.microsoft.com/playwright/python:v1.64.1-noble
          ENV ANONYMIZED_TELEMETRY=false BROWSER_USE_SETUP_LOGGING=false HF_HUB_DISABLE_TELEMETRY=1
          RUN python -m pip install --disable-pip-version-check --no-cache-dir \
              'browser-use==0.13.14' 'playwright==1.64.1'
          DOCKER
          docker build -q -t plenum-public-fit-browser:20261113 \
            -f "$RUNNER_TEMP/plenum-2g-fit/Dockerfile" \
            "$RUNNER_TEMP/plenum-2g-fit" > "$RUNNER_TEMP/plenum-2g-build.log" 2>&1
          echo "Disposable upstream browser image built; no GCP artifact, cookies or account data."
      - name: Load original free Ollama with small Qwen under strict 1GiB model cap
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          docker pull ollama/ollama:latest > /dev/null
          docker run -d --name plenum-2g-local-model \
            --memory=1024m --memory-swap=1024m --cpus=1 \
            -p 127.0.0.1:11434:11434 \
            -e OLLAMA_CONTEXT_LENGTH=4096 -e OLLAMA_NUM_PARALLEL=1 \
            -e OLLAMA_KEEP_ALIVE=30s \
            ollama/ollama:latest > /dev/null
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags > /dev/null
          docker exec plenum-2g-local-model ollama pull qwen3:0.6b \
            > "$RUNNER_TEMP/plenum-2g-pull.log" 2>&1
          echo "Small open-source model pulled in strictly capped local container."
      - name: Prove combined Chromium, Browser Use and local Qwen action under 2GiB
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          # Keep the browser/Browser Use Python process strictly below 768 MiB.
          # No GitHub API key, cloud secret, Google account, encrypted session
          # or other private data is passed into either model or browser.
          docker run --name plenum-2g-public-browser \
            --memory=768m --memory-swap=768m --cpus=1 \
            --network=host --shm-size=96m \
            -e ANONYMIZED_TELEMETRY=false -e BROWSER_USE_SETUP_LOGGING=false \
            -e OPENAI_API_KEY= -e ANTHROPIC_API_KEY= -e GOOGLE_API_KEY= \
            -v "$GITHUB_WORKSPACE/tools/browser-use/owner_2g_fit_probe.py:/work/fit_probe.py:ro" \
            -v "$RUNNER_TEMP/plenum-2g-result:/out" \
            plenum-public-fit-browser:20261113 \
            python /work/fit_probe.py \
            > "$RUNNER_TEMP/plenum-2g-raw-hidden.log" 2>&1 || true
          test -f "$RUNNER_TEMP/plenum-2g-result/result.json" || \
            echo '{"status":"FAIL_BROWSER_OOM_OR_DID_NOT_START"}' \
              > "$RUNNER_TEMP/plenum-2g-result/result.json"
          echo "Cgroup-limited private-data-free joint trial completed. Raw traces not published."
      - name: Report independently bounded fit status (no raw model or page output)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/plenum-2g-result/result.json"
          if [ -s "$FILE" ]; then
            STATUS="$(python - "$FILE" <<'PY'
          import json,sys
          try:
              obj=json.load(open(sys.argv[1]))
              s=obj.get("status","UNKNOWN")
              assert s in {
                  "PASS_JOINT_RUNTIME_AND_3_STEP_MODEL",
                  "FAIL_SMALL_MODEL_ACTION_OR_READBACK",
                  "FAIL_BROWSER_OR_MODEL_RUNTIME",
                  "FAIL_BROWSER_OOM_OR_DID_NOT_START",
                  "FAIL_UPSTREAM_TOOL_CONTRACT","FAIL_READ_ONLY_TOOL_POLICY",
                  "FAIL_ACTION_ESCALATION"
              }
          except Exception:
              s="INVALID_SANITIZED_REPORT"
          print(s)
          PY
            )"
          else
            STATUS="MODEL_PULL_OR_IMAGE_BUILD_BLOCKED"
          fi
          MODEL_OOM="$(docker inspect --format '{{.State.OOMKilled}}' \
            plenum-2g-local-model 2>/dev/null || echo UNKNOWN)"
          BROWSER_OOM="$(docker inspect --format '{{.State.OOMKilled}}' \
            plenum-2g-public-browser 2>/dev/null || echo UNKNOWN)"
          MODEL_PEAK="$(docker exec plenum-2g-local-model \
            sh -c 'cat /sys/fs/cgroup/memory.peak' 2>/dev/null || echo 0)"
          if [[ ! "$MODEL_PEAK" =~ ^[0-9]+$ ]]; then MODEL_PEAK=0; fi
          MODEL_PEAK_MIB="$((MODEL_PEAK / 1048576))"
          BROWSER_PEAK_MIB="$(python - "$FILE" <<'PY'
          import json,sys
          try:
              x=json.load(open(sys.argv[1])).get("browser_peak_mib","unavailable")
              print(x if isinstance(x,(float,int)) else "unavailable")
          except Exception:
              print("unavailable")
          PY
          )"
          DIAGNOSTIC="$(python - "$FILE" <<'PY'
          import json,re,sys
          try:
              r=json.load(open(sys.argv[1]))
              stage=r.get("failure_stage","UNKNOWN")
              kind=r.get("exception_class","UNKNOWN")
              if not isinstance(stage,str) or not re.fullmatch(r"[A-Z_]{2,48}",stage):
                  stage="INVALID"
              if not isinstance(kind,str) or not re.fullmatch(r"[A-Za-z]{2,48}",kind):
                  kind="INVALID"
              print("stage="+stage+";class="+kind)
          except Exception:
              print("stage=UNKNOWN;class=UNKNOWN")
          PY
          )"
          if [ "$STATUS" = "PASS_JOINT_RUNTIME_AND_3_STEP_MODEL" ] &&
             [ "$MODEL_OOM" = "false" ] && [ "$BROWSER_OOM" = "false" ]; then
            LABEL="CONDITIONAL RESOURCE FIT ONLY"
          else
            LABEL="NOT FIT VERIFIED"
          fi
          gh issue comment "$ISSUE" --body \
            "$LABEL — original Playwright 1.64.1 / Browser Use 0.13.14 / Qwen3 0.6B, Qwen container max 1024MiB, browser+Python max 768MiB, 256MiB held back for original owner host. Result=$STATUS; model OOM=$MODEL_OOM; browser OOM=$BROWSER_OOM; model cgroup peak MiB=$MODEL_PEAK_MIB; browser cgroup peak MiB=$BROWSER_PEAK_MIB; $DIAGNOSTIC. No private account, model API charge, or new GCP deployment. Even a PASS does NOT prove owner Cloud Run fit, general task quality, or zero cloud billing. Original acceptance remains issue #310."
      - name: Destroy both disposable inference/browser containers
        if: always()
        shell: bash
        run: |
          docker rm -f plenum-2g-local-model plenum-2g-public-browser >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/plenum-2g-raw-hidden.log" \
            "$RUNNER_TEMP/plenum-2g-pull.log" \
            "$RUNNER_TEMP/plenum-2g-build.log"

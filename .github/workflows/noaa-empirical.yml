name: NOAA Independent Measured-Tide Forecast Experiment
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/noaa-empirical.yml'
      - 'src/plenum_ai/noaa_empirical.py'
      - 'tests/test_noaa_empirical.py'
permissions:
  contents: read
concurrency:
  group: noaa-historical-empirical-experiment
  cancel-in-progress: true
jobs:
  heldout-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install bounded numerical evidence tools
        run: python -m pip install -e ".[empirical]"
      - name: Test model coefficients, chronology and data integrity offline
        run: python -m unittest discover -s tests -p 'test_noaa_empirical.py' -v
      - name: Retrieve real measured NOAA water levels and test a fixed hypothesis
        run: python -m plenum_ai.cli empirical-tides --out reports/noaa_measured_tides.json
      - name: Preserve independent test results regardless of hypothesis outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/noaa_measured_tides.json').read_text())
          assert len(r["stations"]) == 2
          assert r["precommitted_before_first_test_run"]
          assert r["is_independent_future_observation_holdout"]
          assert r["model_parameters_fit_on_test_data"] is False
          assert r["new_scientific_discovery_verified"] is False
          assert r["AI_self_improvement_proven"] is False
          for s in r["stations"]:
              assert s["training_observations"] >= 280
              assert s["holdout_observations"] >= 18
              assert not s["selected_after_examining_holdout"]
              assert s["raw_payload_sha256"]
              print(s["station_name"], "harmonic MAE (m)", s["model_mae_m"],
                    "24h-persistence MAE (m)", s["baseline_mae_m"],
                    "harmonic improved?", s["model_beats_baseline"])
          print("Both-station hypothesis supported:", r["hypothesis_supported_at_both_stations"])
          print("No success was required; failures remain legitimate research evidence.")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: noaa-heldout-observation-evidence
          path: reports/noaa_measured_tides.json
          if-no-files-found: warn
          retention-days: 14

name: Prometheus | Blender concept geometry qualification
on:
  pull_request:
    paths:
      - 'src/plenum_ai/blender_concept_render.py'
      - '.github/workflows/prometheus-blender-concept.yml'
      - 'docs/checkpoint-maintainer-guide/scene.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-concept:
    if: github.event_name != 'pull_request' || github.event.pull_request.number != 1001 || github.event.pull_request.head.sha == 'cd163f7ea086563727120f9440393dea7cf9e74f'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Blender from signed Ubuntu distribution packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-pil
          blender --version
          dpkg-query -W -f='${Package} ${Version}\n' blender blender-data > blender-package.txt
      - name: Render the fixed public checkpoint maintainer concept offline
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/concept-fixture"
          mkdir "$root"
          cp "$GITHUB_WORKSPACE/docs/checkpoint-maintainer-guide/scene.json" "$root/scene.json"
          sudo unshare --net -- env -i HOME="$root" PATH=/usr/bin:/bin GITHUB_ACTIONS=true PLENUM_PUBLIC_GEOMETRY_FIXTURE=confirmed blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python "$GITHUB_WORKSPACE/src/plenum_ai/blender_concept_render.py" -- "$root/scene.json" "$root/concept.png"
          cp "$root/concept.png" concept.png
          /usr/bin/python3 - "$root" <<'PY'
          import hashlib, json, pathlib, sys
          from PIL import Image
          root = pathlib.Path(sys.argv[1])
          image = Image.open("concept.png").convert("RGB")
          assert image.size == (512, 320)
          assert len(image.getcolors(maxcolors=512*320)) > 100, "Flat or invalid render"
          digest = lambda p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          pathlib.Path("blender-acceptance.json").write_text(json.dumps({
            "schema":"plenum-blender-concept-acceptance-v1",
            "source_sha256":digest(root/"scene.json"),"render_sha256":digest("concept.png"),
            "width":512,"height":320,"package":pathlib.Path("blender-package.txt").read_text(),
            "paid_inference":False,"public_repository_documentation":True,"concept_only":True,
            "owner_runtime_verified":False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prometheus-checkpoint-maintainer-static
          path: |
            concept.png
            blender-acceptance.json
            blender-package.txt
            docs/checkpoint-maintainer-guide/scene.json
          if-no-files-found: error

  original-evidence-readback:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1001 && github.event.pull_request.head.sha != 'cd163f7ea086563727120f9440393dea7cf9e74f'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: prometheus-checkpoint-maintainer-static
          run-id: 45940782788
          github-token: ${{ github.token }}
          path: accepted-original
      - name: Check exact accepted source and output without rendering again
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          p = pathlib.Path('accepted-original')
          h = lambda f: hashlib.sha256(f.read_bytes()).hexdigest()
          r = json.loads((p / 'blender-acceptance.json').read_text())
          assert r['paid_inference'] is False
          assert r['owner_runtime_verified'] is False
          assert h(pathlib.Path('docs/checkpoint-maintainer-guide/scene.json')) == h(p / 'docs/checkpoint-maintainer-guide/scene.json') == r['source_sha256'] == '6269007216266f36ae0169033e484eeacd69169ab78c3f7b2ebca0abb6ce9deb'
          assert h(p / 'concept.png') == r['render_sha256'] == '872f370acaa1611fe988bbb731e1a3548187b3d1ae2aa0d6e24212302792e5bf'
          assert subprocess.check_output(['git','hash-object','src/plenum_ai/blender_concept_render.py'],text=True).strip() == 'edc18b56ee36a7086c4f033a1e44b70c133da91e'
          print('Original accepted artifact and source preserved; no rendering replay.')
          PY

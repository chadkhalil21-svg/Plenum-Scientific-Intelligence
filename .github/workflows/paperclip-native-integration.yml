name: Paperclip native workforce integration
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [plenum_public_issue_wakeup]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing owner-created public Paperclip qualification issue
        required: true
        type: string
  pull_request:
    paths:
      - 'integrations/paperclip/**'
      - 'src/plenum_ai/chief_domain_transfer.py'
      - 'src/plenum_ai/chief_contract_plan.py'
      - 'tests/test_chief_domain_transfer.py'
      - '.github/workflows/paperclip-native-integration.yml'
permissions:
  contents: read
concurrency:
  group: paperclip-mission-${{ github.event.issue.number || github.event.client_payload.issue_number || inputs.issue_number || github.ref }}
  cancel-in-progress: false
jobs:
  authorize:
    if: >-
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      ((github.event_name == 'issues' &&
        (github.event.issue.title == '[Plenum Paperclip] public coastal qualification' || github.event.issue.title == '[Plenum Paperclip] public evidence mission') &&
        github.event.issue.user.login == 'chadkhalil21-svg' &&
        github.event.sender.login == 'chadkhalil21-svg') ||
       (github.event_name == 'issue_comment' &&
        (github.event.issue.title == '[Plenum Paperclip] public coastal qualification' || github.event.issue.title == '[Plenum Paperclip] public evidence mission') &&
        github.event.issue.user.login == 'chadkhalil21-svg' &&
        github.event.comment.user.login == 'chadkhalil21-svg' &&
        github.event.comment.body == '<!-- plenum-paperclip-recovery-v1 -->') ||
       github.event_name == 'repository_dispatch' ||
       (github.event_name == 'workflow_dispatch' && github.actor == 'chadkhalil21-svg' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      created_at: ${{ steps.gate.outputs.created_at }}
      scope: ${{ steps.gate.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: gate
        name: Reserve original public qualification once before model startup
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || github.event.client_payload.issue_number || inputs.issue_number }}
        run: PYTHONPATH=src python3 integrations/paperclip/event_gate.py --issue "$ISSUE"
  native-integration:
    needs: authorize
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.authorize.outputs.authorized == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"mode":"off","kind":"legacy"},{"mode":"local","kind":"legacy"},{"mode":"local","kind":"budget"},{"mode":"local","kind":"objective"}]' || '[{"mode":"local","kind":"event"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: startup
        name: Start upstream release on isolated loopback, no provider credentials
        run: |
          set -eu
          image=ghcr.io/paperclipai/paperclip:2026.1106.0
          docker pull "$image"
          revision=$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          test "$revision" = d69631b01b9c658f80bf8bed389863dce82643e1
          docker run -d --name plenum-paperclip-integration \
            -e GITHUB_ACTIONS=true -e HOST=127.0.0.1 -e PAPERCLIP_BIND=loopback -e PAPERCLIP_HOME=/paperclip \
            -e PAPERCLIP_DEPLOYMENT_MODE=local_trusted \
            -e PAPERCLIP_DEPLOYMENT_EXPOSURE=private \
            -e PAPERCLIP_PUBLIC_URL=http://localhost:3100 \
            -e BETTER_AUTH_SECRET="$(openssl rand -hex 32)" \
            -e PAPERCLIP_TOOL_ACTION_SIGNING_SECRET="$(openssl rand -hex 32)" \
            --mount "type=volume,src=plenum-paperclip-test-volume,dst=/paperclip" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/plenum,readonly" \
            "$image"
          for i in $(seq 1 90); do
            if docker exec plenum-paperclip-integration curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - id: checkpoint
        name: Runtime-volume checkpoint qualification (injected provider failures)
        run: docker exec --user node -e PYTHONPATH=/plenum/src plenum-paperclip-integration python3 /plenum/integrations/paperclip/checkpoint_smoke.py --root /paperclip/plenum-mission-evidence
      - name: Start original local Qwen on private shared loopback
        if: matrix.mode == 'local'
        run: |
          set -eu
          docker pull ollama/ollama:latest
          docker run -d --name plenum-paperclip-qwen --network container:plenum-paperclip-integration \
            -e OLLAMA_HOST=127.0.0.1:11434 -e OLLAMA_CONTEXT_LENGTH=2048 -e OLLAMA_NUM_PARALLEL=1 \
            --memory=8g --cpus=3 --mount type=volume,src=plenum-paperclip-qwen-cache,dst=/root/.ollama ollama/ollama:latest
          for i in $(seq 1 45); do
            if docker exec plenum-paperclip-integration curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          timeout 300 docker exec plenum-paperclip-qwen ollama pull qwen3.5:4b
          digest=$(docker exec plenum-paperclip-qwen ollama list | awk '$1=="qwen3.5:4b" {print $2}')
          test "$digest" = d8b0f5e9760c
          echo "Original Qwen model digest prefix verified: $digest"
      - id: mission
        name: Native Minister assigns sequential five-division mission
        env:
          MODE: ${{ matrix.mode }}
          ISSUE_CREATED: ${{ needs.authorize.outputs.created_at }}
          EVENT_SCOPE: ${{ needs.authorize.outputs.scope }}
          KIND: ${{ matrix.kind }}
        run: |
          set -eu
          case "$KIND" in
            legacy) scope='{"kind":"coastal"}' ;;
            budget) scope='{"kind":"bibliography_budget","dois":["10.1145/3442188.3445922"],"budget":{"model":"@cf/zai-org/glm-4.7-flash","neurons_used_today":100,"neurons_reserved":200,"input_tokens_upper_bound":3000,"output_tokens_upper_bound":1000}}' ;;
            objective) scope='{"kind":"public_objective","objective":"Find the words common to both delivery summaries and the middle value after sorting the observations.","dois":["10.1007/s10791-026-10743-4","10.1016/j.jss.2026.113142"],"inputs":{"documents":["supplier delivery quality","delivery supplier testing"],"samples":[17,-3,8,42,12,19]},"operation_commitment":"b06f527ce3646bcbc14a7970066456b64e9396c24e7a6102beefcf6340985428"}' ;;
            event) scope="$EVENT_SCOPE"; test -n "$scope" ;;
            *) exit 1 ;;
          esac
          if [ "$KIND" = objective ]; then
            docker exec --user node -e PYTHONPATH=/plenum/src -e PLENUM_CI_SUPERVISOR_PROOF=confirmed -e PLENUM_MISSION_SCOPE="$scope" -e PLENUM_ISSUE_CREATED_AT="$ISSUE_CREATED" -e PLENUM_PAPERCLIP_MODEL="$MODE" plenum-paperclip-integration python3 /plenum/integrations/paperclip/supervise_native.py event
            docker exec --user node -e PYTHONPATH=/plenum/src plenum-paperclip-integration python3 /plenum/integrations/paperclip/event_native.py resume
          else
            docker exec --user node -e PYTHONPATH=/plenum/src -e PLENUM_MISSION_SCOPE="$scope" -e PLENUM_ISSUE_CREATED_AT="$ISSUE_CREATED" -e PLENUM_PAPERCLIP_MODEL="$MODE" plenum-paperclip-integration python3 /plenum/integrations/paperclip/supervise_native.py event
          fi
      - name: Qualify consecutive persistent model-directed missions and bounded recovery
        if: matrix.mode == 'local' && matrix.kind == 'budget'
        run: python3 integrations/paperclip/persistent_native_smoke.py local
      - name: Remove local model before independent restart readback
        if: matrix.mode == 'local' && matrix.kind != 'budget'
        run: docker rm -fv plenum-paperclip-qwen
      - id: restart
        name: Restart same upstream server and independently reread evidence without external provider calls
        run: |
          set -eu
          docker restart plenum-paperclip-integration
          for i in $(seq 1 90); do
            if docker exec plenum-paperclip-integration curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then
              docker exec --user node -e PYTHONPATH=/plenum/src plenum-paperclip-integration python3 /plenum/integrations/paperclip/event_native.py readback
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Qualify two consecutive persistent missions and both restart readbacks
        if: matrix.mode == 'off'
        run: python3 integrations/paperclip/persistent_native_smoke.py
      - name: Collect only public task evidence
        if: always()
        env:
          STARTUP: ${{ steps.startup.outcome }}
          CHECKPOINT: ${{ steps.checkpoint.outcome }}
          MISSION: ${{ steps.mission.outcome }}
          RESTART: ${{ steps.restart.outcome }}
        run: |
          mkdir -p reports/paperclip-native
          if docker cp plenum-paperclip-integration:/paperclip/plenum-mission-evidence/. reports/paperclip-native/; then
            export EVIDENCE_COPY=success
          else
            export EVIDENCE_COPY=unavailable
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path("reports/paperclip-native")
          data={"schema":"plenum-paperclip-ci-diagnostic-v1","run_id":os.environ["GITHUB_RUN_ID"],
                "commit":os.environ["GITHUB_SHA"],"startup":os.environ["STARTUP"],
                "checkpoint":os.environ["CHECKPOINT"],"mission":os.environ["MISSION"],
                "restart":os.environ["RESTART"],"evidence_copy":os.environ["EVIDENCE_COPY"],
                "qualification_present":(root/"qualification.json").is_file() or (root/"event-native-mission.json").is_file(),
                "failure_receipts":len(list(root.glob("failure-*.json")))}
          (root/"ci-diagnostic.json").write_text(json.dumps(data,indent=2)+"\n")
          print(json.dumps(data))
          if all(data[k]=="success" for k in ("startup","checkpoint","mission","restart")):
              marker=root/"event-native-mission.json"
              directory=root
              if marker.is_file():
                  from uuid import UUID
                  row=json.loads(marker.read_text())
                  assert all(str(UUID(row[k]))==row[k] for k in ("company","mission"))
                  directory=root/row["company"]/row["mission"]
              assert all((directory/name).is_file() for name in ("qualification.json","event-timing.json","restart-timing.json")), "Missing actual qualification artifact"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paperclip-native-public-evidence-${{ matrix.mode }}-${{ matrix.kind }}
          path: reports/paperclip-native/
          if-no-files-found: error
          retention-days: 7
      - name: Remove isolated instance and test database
        if: always()
        run: |
          docker rm -fv plenum-paperclip-qwen 2>/dev/null || true
          docker rm -fv plenum-paperclip-integration 2>/dev/null || true
          docker volume rm plenum-paperclip-test-volume 2>/dev/null || true
          docker volume rm plenum-paperclip-qwen-cache 2>/dev/null || true
  fresh-runner-acceptance:
    needs: [authorize, native-integration]
    if: ${{ !cancelled() && needs.native-integration.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: paperclip-native-public-evidence-*
          path: reports/fresh-runner-input
      - name: Finish independent acceptance on a new runner without model, provider calls or board credentials
        env:
          PYTHONPATH: src
          EXPECTED_SCOPE: ${{ needs.authorize.outputs.scope }}
          EVENT: ${{ github.event_name }}
        run: python3 integrations/paperclip/fresh_runner_acceptance.py reports/fresh-runner-input reports/fresh-runner-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: paperclip-fresh-runner-acceptance
          path: reports/fresh-runner-result.json
          if-no-files-found: error
          retention-days: 7
  terminal-receipt:
    needs: [authorize, native-integration, fresh-runner-acceptance]
    if: always() && github.event_name != 'pull_request' && needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Record bounded outcome without redispatch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || github.event.client_payload.issue_number || inputs.issue_number }}
          NATIVE_RESULT: ${{ needs.native-integration.result }}
          ACCEPTANCE_RESULT: ${{ needs.fresh-runner-acceptance.result }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          issue=int(os.environ["ISSUE"])
          native=os.environ["NATIVE_RESULT"]
          acceptance=os.environ["ACCEPTANCE_RESULT"]
          result="success" if native==acceptance=="success" else "failure"
          assert 0<issue<10**9 and result in ("success","failure","cancelled","skipped")
          run=os.environ["GITHUB_RUN_ID"]
          body={"body":f"<!-- plenum-public-workforce-run:{run}:terminal -->\nNative bounded Paperclip qualification and fresh-runner acceptance: {result} (native={native}, independent={acceptance}). See https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run}. No automatic redispatch."}
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{issue}/comments"
          req=urllib.request.Request(url,data=json.dumps(body).encode(),headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Content-Type":"application/json","User-Agent":"PlenumPaperclipQualification/1"})
          with urllib.request.urlopen(req,timeout=15) as res:
              assert res.status==201
          PY

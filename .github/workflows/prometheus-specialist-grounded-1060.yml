name: Prometheus documentation grounded specialist 1060
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/prometheus-specialist-grounded-1060.yml'
permissions:
  contents: read
concurrency:
  group: plenum-original-staged-1060
  cancel-in-progress: false
jobs:
  reserve:
    if: github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' && github.actor == 'chadkhalil21-svg' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'prometheus-1060-specialist-grounded' && github.event.pull_request.base.ref == 'prometheus-1060-independent-correction' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      actions: read
    outputs:
      reserved: ${{ steps.reserve.outputs.reserved }}
    steps:
      - id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=chadkhalil21-svg/Plenum-Scientific-Intelligence
          gh api "repos/$repo/issues/1060" | jq -e '.user.login=="chadkhalil21-svg" and .state=="open" and .title=="[Plenum Prometheus] Independent native 4B recovery assignment: strict public health JSON"' >/dev/null
          gh api "repos/$repo/actions/runs/46096572989/jobs?per_page=100" | jq -e 'any(.jobs[]; .id==140829188246 and .conclusion=="failure" and any(.steps[]; .name=="Retrieve terminal exhausted correction evidence" and .conclusion=="failure") and any(.steps[]; .name=="Start original free local inference" and .conclusion=="skipped") and any(.steps[]; .name=="Run original native agent with staged action feedback and independent grader" and .conclusion=="skipped"))' >/dev/null
          gh api --paginate "repos/$repo/issues/1060/comments?per_page=100" | jq -s add | jq -e 'any(.[]; (.body|contains("plenum-specialist-grounded-1060-reserved-v1:46096572989"))) and all(.[]; (.body|contains("plenum-specialist-preflight-recovery-v1")|not))' >/dev/null
          gh api --method POST "repos/$repo/issues/1060/comments" -f body="<!-- plenum-specialist-preflight-recovery-v1:$GITHUB_RUN_ID --> One continuation after exact verified pre-inference failure, no replay." >/dev/null
          echo reserved=true >> "$GITHUB_OUTPUT"
  engineering:
    needs: reserve
    if: needs.reserve.outputs.reserved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen source and independent acceptance identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object src/plenum_ai/business_public_watch.py)" = 9e0eb29087a67c802f8746fbb0ee2307fc41f848
          test "$(git hash-object tests/acceptance/strict_health_1060.py)" = 19e063e369f9f2ce487c39f7ce6dbfd43115c6be
          gh api repos/chadkhalil21-svg/Plenum-Scientific-Intelligence/issues/1060 > "$RUNNER_TEMP/issue1060.json"
      - name: Retrieve exact consumed original 1060 archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 90 --max-filesize 2000000 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/chadkhalil21-svg/Plenum-Scientific-Intelligence/actions/artifacts/15237492648/zip -o "$RUNNER_TEMP/1060.zip"
          echo "7e98553af13282475856adf3b1788ebaa16c9f28f96d6a1e6a1a959bfc621255  $RUNNER_TEMP/1060.zip" | sha256sum -c -
      - name: Retrieve exact independently rejected candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 90 --max-filesize 2000000 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/chadkhalil21-svg/Plenum-Scientific-Intelligence/actions/artifacts/15236834524/zip -o "$RUNNER_TEMP/rejected1060.zip"
          echo "f5ecd52815d14a7d63a9f58754fd592c4ee7fdbdd203e4b650666aa0f73fdda3  $RUNNER_TEMP/rejected1060.zip" | sha256sum -c -
      - name: Retrieve terminal exhausted correction evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 90 --max-filesize 2000000 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/chadkhalil21-svg/Plenum-Scientific-Intelligence/actions/artifacts/15243189534/zip -o "$RUNNER_TEMP/exhausted1060.zip"
          echo "1185c80e273bdb91e0268a4fb641b691f7f67a3c9048b39244cca3a38e22a411  $RUNNER_TEMP/exhausted1060.zip" | sha256sum -c -
          PYTHONPATH=tools python -c 'import sys; from pathlib import Path; from miniswe_api_grounding import bind_exhaustion,reference; assert len(bind_exhaustion(Path(sys.argv[1]))[0])==12; assert len(reference(Path("src/plenum_ai/business_public_watch.py").read_bytes()))==2' "$RUNNER_TEMP/exhausted1060.zip"
      - name: Install existing upstream native executor
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/mini-venv"
          "$RUNNER_TEMP/mini-venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: 'mini-swe-agent==2.4.6' 'litellm!=1.82.7,!=1.82.8'
          "$RUNNER_TEMP/mini-venv/bin/python" -m pip check
          "$RUNNER_TEMP/mini-venv/bin/python" -m py_compile tools/run_native_miniswe_mission.py
          docker pull python:3.12-slim
          test "$(df --output=avail -B1 / | tail -1 | tr -d ' ')" -ge 9000000000
          test "$(awk '/MemTotal/ {print $2}' /proc/meminfo)" -ge 7000000
      - name: Qualify interface and independently demonstrate original defect
        run: |
          set -euo pipefail
          PYTHONPATH=src:tools python -B -m unittest discover -s tests -p test_memento_recovery_adapter.py -v
          PYTHONPATH=src:tools python -B -m unittest discover -s tests -p test_miniswe_staged_interface.py -v
          PYTHONPATH=src:tools python - <<'PY'
          import pathlib,subprocess
          from verify_original_openhands_candidate import sandbox_command,completed_unittest
          result=subprocess.run(sandbox_command(pathlib.Path.cwd(),"python:3.12-slim","/work/tests/acceptance","strict_health_1060.py"),capture_output=True,text=True,timeout=150)
          if not completed_unittest(result,failed=True) or "Ran 2 tests" not in result.stderr:
              raise SystemExit("Original behavior defect not independently established")
          print("Original held-out defect independently established.")
          PY
      - name: Verify exact issue binding before model startup
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mini-home"
          env -i PATH="$RUNNER_TEMP/mini-venv/bin:/usr/bin:/bin" HOME="$RUNNER_TEMP/mini-home" PYTHONPATH=src:tools MSWEA_SILENT_STARTUP=1 PLENUM_STAGED_1060_RESERVED=true "$RUNNER_TEMP/mini-venv/bin/python" -c 'import sys; from pathlib import Path; import run_native_miniswe_mission as m; m.configure_staged_1060(Path(sys.argv[1])); print(m.ISSUE,m.SOURCE,m.ACCEPTANCE)' "$RUNNER_TEMP/issue1060.json"
      - name: Check actual upstream response bridge and exact continuation binding
        run: |
          set -euo pipefail
          PYTHONPATH=src:tools PLENUM_STAGED_1060_RESERVED=true PLENUM_STAGED_1060_NATIVE_JSON=confirmed "$RUNNER_TEMP/mini-venv/bin/python" -c 'import sys; from pathlib import Path; import run_native_miniswe_mission as m; m.configure_staged_1060(Path(sys.argv[1])); m.bind_native_json_1060(Path(sys.argv[2])); assert len(m.PRIOR_REQUESTS)==4' "$RUNNER_TEMP/issue1060.json" "$RUNNER_TEMP/1060.zip"
          PYTHONPATH=tools "$RUNNER_TEMP/mini-venv/bin/python" -c 'import json; from miniswe_native_json import request,response; from minisweagent.models.utils.actions_toolcall import parse_toolcall_actions; q=request([{"role":"user","content":"test"}],"local"); assert q["think"] is False and q["format"]["required"]==["op"]; command=json.dumps({"op":"submit"}); a=response({"model":"local","done":True,"message":{"content":command}},"local",1); assert parse_toolcall_actions(a.choices[0].message.tool_calls,format_error_template="{{ error }}")[0]["command"]==command'
      - name: Verify exact candidate restoration before inference
        run: |
          set -euo pipefail
          PYTHONPATH=src:tools PLENUM_STAGED_1060_RESERVED=true PLENUM_STAGED_1060_NATIVE_JSON=confirmed PLENUM_1060_INDEPENDENT_CORRECTION=confirmed "$RUNNER_TEMP/mini-venv/bin/python" -c 'import sys; from pathlib import Path; import run_native_miniswe_mission as m; m.configure_staged_1060(Path(sys.argv[1])); m.bind_native_json_1060(Path(sys.argv[2])); c=m.bind_independent_correction(Path(sys.argv[3])); assert len(m.PRIOR_REQUESTS)==6 and m.sha(c)=="b57081733d038a314eb916926e75f312cd8fe87e5509df597c1acaab0b541735"' "$RUNNER_TEMP/issue1060.json" "$RUNNER_TEMP/1060.zip" "$RUNNER_TEMP/rejected1060.zip"
      - name: Start original free local inference
        run: |
          set -euo pipefail
          docker run -d --rm --name plenum-miniswe-ollama -p 127.0.0.1:11434:11434 -e OLLAMA_CONTEXT_LENGTH=8192 -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_NO_CLOUD=1 --memory=8g --cpus=3 ollama/ollama:latest
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          docker exec plenum-miniswe-ollama ollama pull qwen2.5-coder:7b-instruct
          digest=$(curl --fail --silent http://127.0.0.1:11434/api/tags | jq -er '.models[]|select(.name=="qwen2.5-coder:7b-instruct")|.digest')
          [[ "$digest" =~ ^dae161e27b0e[0-9a-f]{52}$ ]]
          echo "PLENUM_1060_SPECIALIST_DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Run original native agent with staged action feedback and independent grader
        run: |
          set -euo pipefail
          env -i PATH="$RUNNER_TEMP/mini-venv/bin:/usr/bin:/bin" HOME="$RUNNER_TEMP/mini-home" PYTHONPATH=src GITHUB_ACTIONS=true GITHUB_REPOSITORY=chadkhalil21-svg/Plenum-Scientific-Intelligence PLENUM_MINISWE_RESERVED=true PLENUM_MINISWE_STAGED=confirmed PLENUM_STAGED_1060_RESERVED=true PLENUM_STAGED_1060_NATIVE_JSON=confirmed PLENUM_1060_INDEPENDENT_CORRECTION=confirmed PLENUM_1060_SPECIALIST=confirmed PLENUM_1060_SPECIALIST_DIGEST="$PLENUM_1060_SPECIALIST_DIGEST" MSWEA_SILENT_STARTUP=1 MSWEA_MODEL_RETRY_STOP_AFTER_ATTEMPT=1 LITELLM_LOCAL_MODEL_COST_MAP=True LITELLM_LOG=ERROR DO_NOT_TRACK=1 "$RUNNER_TEMP/mini-venv/bin/python" tools/run_native_miniswe_mission.py --staged --staged-1060 "$RUNNER_TEMP/issue1060.json" --native-json-archive "$RUNNER_TEMP/1060.zip" --independent-correction-archive "$RUNNER_TEMP/rejected1060.zip" --exhausted-correction-archive "$RUNNER_TEMP/exhausted1060.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-specialist-grounded-1060
          path: |
            reports/miniswe-1060-specialist-grounded/
            reports/openhands-review/issue-1060.patch
          if-no-files-found: warn
      - if: always()
        run: |
          docker rm -f plenum-miniswe-ollama || true
          docker ps -aq --filter label=plenum-miniswe-1060 | xargs -r docker rm -f

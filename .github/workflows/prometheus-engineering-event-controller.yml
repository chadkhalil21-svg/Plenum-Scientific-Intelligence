name: Prometheus | Event engineering controller
on:
  workflow_run:
    workflows:
      - Prometheus upstream skill supply-chain qualification
      - Prometheus model-free document retrieval qualification
      - Prometheus | Pinned local speech recognition qualification
      - Prometheus | Blender concept geometry qualification
      - Prometheus | HyperFrames local motion qualification
      - Plenum Workforces | Five Divisions and OCI Staging Safety
      - Verify Scientific AI Foundation
      - Paperclip import and entrypoint gate
      - Browser progress ledger guard
    types: [completed]
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [plenum_engineering_backlog_tick_v1, plenum_engineering_cadence_proof_v1]
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - 'src/plenum_ai/engineering_event_controller.py'
      - 'src/plenum_ai/whisper_repair_candidate.py'
      - 'tests/test_engineering_event_controller.py'
      - 'integrations/cloudflare/plenum-engineering-fallback*.mjs'
      - 'integrations/cloudflare/plenum-github-wake-worker*.mjs'
      - 'wrangler.toml'
      - 'integrations/cloudflare/wrangler.toml'
      - '.github/workflows/prometheus-engineering-event-controller.yml'
permissions:
  contents: read
concurrency:
  group: prometheus-engineering-controller-${{ github.event_name == 'pull_request' && github.ref || 'trusted' }}
  cancel-in-progress: false
jobs:
  policy-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -p test_engineering_event_controller.py -v
      - run: node --test integrations/cloudflare/plenum-engineering-fallback.test.mjs integrations/cloudflare/plenum-github-wake-worker.test.mjs
  verify-cadence:
    if: >-
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'repository_dispatch' &&
      github.event.sender.login == 'chadkhalil21-svg' &&
      github.event.action == 'plenum_engineering_cadence_proof_v1'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Authenticate and record bounded scheduler receipt only
        env:
          PLENUM_WEBHOOK_HMAC_SECRET: ${{ secrets.PLENUM_WEBHOOK_HMAC_SECRET }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, hmac, json, os, re, time
          event=json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          payload=event.get("client_payload")
          assert event.get("action")=="plenum_engineering_cadence_proof_v1"
          assert event.get("repository",{}).get("full_name")=="chadkhalil21-svg/Plenum-Scientific-Intelligence"
          assert event.get("sender",{}).get("login")=="chadkhalil21-svg"
          assert isinstance(payload,dict) and set(payload)=={"slot","scope","signature"}
          slot=payload["slot"]
          start=int(datetime.datetime(2026,11,26,8,tzinfo=datetime.timezone.utc).timestamp()*1000)
          end=int(datetime.datetime(2026,11,27,5,tzinfo=datetime.timezone.utc).timestamp()*1000)
          assert type(slot) is int and start<=slot<end and slot%300000==0
          assert 0<=int(time.time()*1000)-slot<1800000
          assert payload["scope"]=="cron_observation_only"
          signature=payload["signature"]
          key=os.environ["PLENUM_WEBHOOK_HMAC_SECRET"]
          assert len(key)>=32 and isinstance(signature,str) and re.fullmatch(r"[0-9a-f]{64}",signature)
          expected=hmac.new(key.encode(),f"plenum-engineering-cadence-v1.{slot}.cron_observation_only".encode(),hashlib.sha256).hexdigest()
          assert hmac.compare_digest(signature,expected), "Invalid cadence attestation"
          print(json.dumps({"schema":"plenum-cadence-proof-v1","scheduled_slot_ms":slot,
                            "authenticated":True,"paid_inference":False,"work_dispatched":False}))
          PY
  observe-and-recover:
    if: >-
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_run' || github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.actor == 'chadkhalil21-svg') ||
       (github.event_name == 'repository_dispatch' && github.event.sender.login == 'chadkhalil21-svg' && github.event.action == 'plenum_engineering_backlog_tick_v1') ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.sender.login == 'chadkhalil21-svg' && github.event.sender.id == 251133044 &&
        github.event.comment.user.login == 'chadkhalil21-svg' &&
        github.event.comment.author_association == 'OWNER' &&
        startsWith(github.event.comment.body, '<!-- plenum-engineering-observe-v1:')) ||
       (github.event_name == 'issues' && github.event.issue.user.login == 'chadkhalil21-svg' &&
        github.event.sender.login == 'chadkhalil21-svg' &&
        github.event.issue.title == '[Plenum Engineering] approved backlog wake' &&
        github.event.issue.body == 'PLENUM_ENGINEERING_WAKE_V1'))
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: write
    outputs:
      whisper_repair: ${{ steps.controller.outputs.whisper_repair }}
    steps:
      # Never check out the originating run's head or execute its artifacts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Trusted default-branch controller (no model or candidate execution)
        id: controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=src python3 -m plenum_ai.engineering_event_controller --event "$GITHUB_EVENT_PATH" --kind "$GITHUB_EVENT_NAME"

  repair-whisper:
    needs: observe-and-recover
    if: needs.observe-and-recover.outputs.whisper_repair == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Produce exact-source correction candidate, never execute candidate workflow
        run: |
          set -euo pipefail
          git fetch --depth=1 origin a9ed286a49308fb5e01ed25a53c08f65e72445af
          git show a9ed286a49308fb5e01ed25a53c08f65e72445af:.github/workflows/prometheus-whisper-local.yml > original.yml
          python -m plenum_ai.whisper_repair_candidate --original original.yml --out candidate.yml
        env:
          PYTHONPATH: src
      - name: Build reviewed public release and download distinct hash-pinned base model
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/whisper-repair"
          mkdir -p "$root"
          git init "$root/upstream"
          git -C "$root/upstream" fetch --depth=1 https://github.com/ggml-org/whisper.cpp.git refs/tags/v1.9.6
          git -C "$root/upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$root/upstream" rev-parse HEAD)" = 96ec4d9823e9d0211944172da35f9f29134af990
          cmake -S "$root/upstream" -B "$root/build" -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DGGML_NATIVE=OFF
          cmake --build "$root/build" --target whisper-cli --parallel 2
          curl --fail --location --silent --show-error --max-time 180 'https://huggingface.co/ggerganov/whisper.cpp/resolve/fb5ed9369c26eaf08392504d8446da431e0fffb9/ggml-base.en.bin' -o "$root/model.bin"
          echo "a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002  $root/model.bin" | sha256sum --check
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg
          espeak-ng -v en-us -s 140 -w "$root/synthetic.wav" "The quick brown fox jumps over the lazy dog."
          ffmpeg -hide_banner -loglevel error -i "$root/synthetic.wav" -ac 1 -ar 16000 -c:a pcm_s16le "$root/audio.wav"
      - name: Execute one distinct corrected model offline, preserving the original accuracy gate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/whisper-repair"
          sudo --preserve-env=PATH unshare --net -- env -i HOME="$root" PATH="$root/build/bin:/usr/bin:/bin" "$root/build/bin/whisper-cli" -m "$root/model.bin" -f "$root/audio.wav" -t 2 -otxt -of "$root/transcript"
          cp "$root/audio.wav" audio.wav
          cp "$root/transcript.txt" transcript.txt
          PYTHONPATH=src python -m plenum_ai.whisper_repair_candidate --receipt --original original.yml --out candidate.yml --audio audio.wav --transcript transcript.txt --model "$root/model.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-repair-candidate
          path: |
            original.yml
            candidate.yml
            audio.wav
            transcript.txt
            repair-receipt.json
          if-no-files-found: error
          retention-days: 7
  verify-whisper-repair:
    needs: repair-whisper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: whisper-repair-candidate
          path: repair
      - name: Independently check exact immutable original, permitted correction and transcript
        run: |
          PYTHONPATH=src python -m plenum_ai.whisper_repair_candidate --verify --original repair/original.yml --out repair/candidate.yml --audio repair/audio.wav --transcript repair/transcript.txt --receipt-file repair/repair-receipt.json

name: Reconcile Public Scientific Evidence Ledger
on:
  workflow_dispatch:
  schedule:
    - cron: '47 8 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reconcile-public-ledger.yml'
      - 'src/plenum_ai/evidence_index.py'
      - 'tests/test_evidence_index.py'
permissions:
  contents: write
concurrency:
  group: plenum-public-evidence-ledger-reconciliation
  cancel-in-progress: false
jobs:
  index-public-evidence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/checkout@v7
        with:
          ref: research-memory
          path: ledger
      - name: Verify evidence indexing and confidentiality protections
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -p 'test_evidence_index.py' -v
      - name: Reconcile the actual research-memory public evidence inventory
        run: |
          test -f ledger/state/mission_status.json
          python -m plenum_ai.evidence_index --root ledger/evidence --out ledger/state/evidence_index.json
      - name: Preserve deterministic public inventory without rewriting experiments
        run: |
          git -C ledger config user.name 'Plenum Public Evidence Ledger'
          git -C ledger config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C ledger add state/evidence_index.json
          if git -C ledger diff --cached --quiet; then
            echo 'Public evidence index already current'
            exit 0
          fi
          git -C ledger commit -m 'Reconcile existing public scientific experiment evidence'
          git -C ledger pull --rebase origin research-memory
          git -C ledger push origin HEAD:research-memory

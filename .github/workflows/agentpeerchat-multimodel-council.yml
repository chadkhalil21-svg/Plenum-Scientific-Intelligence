name: Plenum Council | AgentPeerChat Qwen Gemini Llama and Claude
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agentpeerchat-multimodel-council.yml'
      - 'src/plenum_ai/agentpeerchat_pair.py'
      - 'src/plenum_ai/agentpeerchat_council.py'
  schedule:
    - cron: '*/30 * * * *'
  pull_request:
    paths:
      - 'src/plenum_ai/agentpeerchat_council.py'
      - 'src/plenum_ai/agentpeerchat_pair.py'
      - 'tests/test_agentpeerchat_council.py'
      - '.github/workflows/agentpeerchat-multimodel-council.yml'
permissions:
  contents: read
concurrency:
  group: plenum-agentpeerchat-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original model bridge contract, no model calls
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_agentpeerchat_council.py' -v
  receive:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      PYTHONPATH: src
      PLENUM_APC_URL: https://agentpeerchat.chadkhalil21.workers.dev
      PLENUM_APC_QWEN_KEY: ${{ secrets.PLENUM_APC_QWEN_KEY }}
      PLENUM_APC_GEMINI_KEY: ${{ secrets.PLENUM_APC_GEMINI_KEY }}
      PLENUM_APC_CLAUDE_KEY: ${{ secrets.PLENUM_APC_CLAUDE_KEY }}
      PLENUM_APC_CLAUDE_INVITE: ${{ secrets.PLENUM_APC_CLAUDE_INVITE }}
      PLENUM_APC_LLAMA_KEY: ${{ secrets.PLENUM_APC_LLAMA_KEY }}
      PLENUM_APC_QWEN_INVITE: ${{ secrets.PLENUM_APC_QWEN_INVITE }}
      PLENUM_APC_GEMINI_INVITE: ${{ secrets.PLENUM_APC_GEMINI_INVITE }}
      PLENUM_APC_LLAMA_INVITE: ${{ secrets.PLENUM_APC_LLAMA_INVITE }}
      PLENUM_GEMINI_API_KEY: ${{ secrets.PLENUM_GEMINI_API_KEY }}
      PLENUM_GEMINI_MODEL: ${{ vars.PLENUM_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Idempotent: Qwen remains active; Gemini now uses owner-provisioned Google AI key.
      - name: Recheck owner-saved AgentPeerChat invitations and activate available identities
        run: |
          python -m plenum_ai.agentpeerchat_pair --model qwen
          python -m plenum_ai.agentpeerchat_pair --model gemini
          python -m plenum_ai.agentpeerchat_pair --model llama
          python -m plenum_ai.agentpeerchat_pair --model claude
      - name: Inspect genuine unread group messages before model startup
        id: mail
        run: |
          if [ -z "$PLENUM_APC_QWEN_KEY" ] && [ -z "$PLENUM_APC_GEMINI_KEY" ] && [ -z "$PLENUM_APC_LLAMA_KEY" ] && [ -z "$PLENUM_APC_CLAUDE_KEY" ]; then
            echo 'qwen=false' >> "$GITHUB_OUTPUT"
            echo 'gemini=false' >> "$GITHUB_OUTPUT"
            echo 'llama=false' >> "$GITHUB_OUTPUT"
            echo 'claude=false' >> "$GITHUB_OUTPUT"
            echo 'No private agent keys provisioned; model startup skipped'
            exit 0
          fi
          for model in qwen gemini llama claude; do
            pending=$(python -m plenum_ai.agentpeerchat_council --model "$model" --mode inspect)
            echo "$model=${pending#actionable=}" >> "$GITHUB_OUTPUT"
          done
      - name: Reuse local Ollama only if Qwen or Llama has actionable messages
        if: steps.mail.outputs.qwen == 'true' || steps.mail.outputs.llama == 'true'
        run: |
          docker pull ollama/ollama:latest
          docker run -d --rm --name plenum-peerchat-qwen \
            -p 127.0.0.1:11434:11434 -e OLLAMA_NUM_PARALLEL=1 \
            --memory=5g --cpus=3 ollama/ollama:latest
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          if [ "${{ steps.mail.outputs.qwen }}" = "true" ]; then
            docker exec plenum-peerchat-qwen ollama pull qwen3:1.7b
          fi
          if [ "${{ steps.mail.outputs.llama }}" = "true" ]; then
            docker exec plenum-peerchat-qwen ollama pull llama3.2:1b
          fi
      - name: Qwen — independently respond and critique
        if: steps.mail.outputs.qwen == 'true'
        run: python -m plenum_ai.agentpeerchat_council --model qwen --mode run
      - name: Gemini — independently respond and critique
        if: steps.mail.outputs.gemini == 'true'
        run: python -m plenum_ai.agentpeerchat_council --model gemini --mode run
      - name: Llama — independently respond and critique
        if: steps.mail.outputs.llama == 'true'
        run: python -m plenum_ai.agentpeerchat_council --model llama --mode run
      - name: Install official Puter SDK only for actionable Claude mail
        if: steps.mail.outputs.claude == 'true'
        env:
          PLENUM_APC_QWEN_KEY: ''
          PLENUM_APC_GEMINI_KEY: ''
          PLENUM_APC_LLAMA_KEY: ''
          PLENUM_APC_CLAUDE_KEY: ''
          PLENUM_APC_QWEN_INVITE: ''
          PLENUM_APC_GEMINI_INVITE: ''
          PLENUM_APC_LLAMA_INVITE: ''
          PLENUM_APC_CLAUDE_INVITE: ''
          PLENUM_GEMINI_API_KEY: ''
        run: npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false @heyputer/puter.js@2.6.5
      - name: Claude — independently respond and critique within free allowance
        if: steps.mail.outputs.claude == 'true'
        env:
          PLENUM_PUTER_TOKEN: ${{ secrets.PLENUM_PUTER_TOKEN }}
        run: python -m plenum_ai.agentpeerchat_council --model claude --mode run
      - name: Shut down the temporary model container
        if: always()
        run: docker rm -f plenum-peerchat-qwen 2>/dev/null || true

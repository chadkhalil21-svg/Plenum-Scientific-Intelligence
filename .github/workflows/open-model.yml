name: Open-Weight AI Model Demonstration
on:
  workflow_dispatch:
  push:
    paths:
      - "src/plenum_ai/hf_model.py"
      - "src/plenum_ai/quality.py"
      - "src/plenum_ai/research.py"
      - "src/plenum_ai/investigate.py"
      - "src/plenum_ai/lab.py"
      - ".github/workflows/open-model.yml"
permissions:
  contents: read
concurrency:
  group: bounded-open-model-demo
  cancel-in-progress: true
jobs:
  cpu-model:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU-only model dependencies
        run: |
          python -m pip install -e ".[science]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.51,<5" safetensors
      - name: Execute two model roles and verify a numerical simulation
        run: python -m plenum_ai.cli investigate --query "What experiments can test the reliability of orbital mechanics and chemical simulation?" --hf-model --domains mechanics,chemistry,materials,molecules --out reports/open_model_investigation.json
      - name: Check generated content (not a scientific proof)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("reports/open_model_investigation.json").read_text())
          assert result["research"]["model_inference_executed"]
          assert result["lab"]["known_model_checks_passed"]
          assert result["workflow_verified_as_known_tool_demonstration"]
          assert result["research"]["model_outputs_pass_basic_screen"], result["research"]["model_output_quality"]
          assert not result["claims"]["new_scientific_discovery_verified"]
          print("Basic model output screen passed; scientific validity remains unverified.")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: open-model-research-report
          path: reports/
          if-no-files-found: warn
          retention-days: 7

name: Open-Weight AI Model Demonstration
on:
  workflow_dispatch:
  push:
    paths:
      - "src/plenum_ai/hf_model.py"
      - ".github/workflows/open-model.yml"
permissions:
  contents: read
concurrency:
  group: bounded-open-model-demo
  cancel-in-progress: true
jobs:
  cpu-model:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU-only model dependencies
        run: |
          python -m pip install -e .
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.51,<5" safetensors
      - name: Execute two model roles and verify a numerical simulation
        run: python -m plenum_ai.cli mission --query "What falsifiable experiments could make AI-generated physics results more reproducible?" --hf-model --simulation heat --out reports/open_model_mission.json
      - name: Check generated content (not a scientific proof)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("reports/open_model_mission.json").read_text())
          assert result["model_inference_executed"]
          assert result["numeric_benchmark_verified"]
          assert result["model_outputs_pass_basic_screen"], result["model_output_quality"]
          assert not result["verified_new_scientific_discovery"]
          print("Basic model output screen passed; scientific validity remains unverified.")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: open-model-research-report
          path: reports/
          if-no-files-found: warn
          retention-days: 7

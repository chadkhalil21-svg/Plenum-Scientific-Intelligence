name: Open-Weight AI Model Demonstration
on:
  workflow_dispatch:
  push:
    paths:
      - "src/plenum_ai/hf_model.py"
      - ".github/workflows/open-model.yml"
permissions:
  contents: read
concurrency:
  group: bounded-open-model-demo
  cancel-in-progress: true
jobs:
  cpu-model:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU-only model dependencies
        run: |
          python -m pip install -e .
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.46,<5" safetensors
      - name: Execute two model roles and verify a numerical simulation
        run: python -m plenum_ai.cli mission --query "How could scientific AI verification improve?" --offline --hf-model --simulation heat --out reports/open_model_mission.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: open-model-research-report
          path: reports/
          if-no-files-found: warn
          retention-days: 7

name: Business Workforce | Real n8n Import and OpenHands Local-Model Trial

# One-time isolated execution evidence on the integration branch; manual thereafter.
# Never run on a schedule, production account or default-branch push.
on:
  push:
    branches: [feat/live-business-workforce-20261110, feat/openhands-one-repair-check-20261110]
    paths:
      - '.github/workflows/business-workforce-runtime.yml'
      - 'integrations/n8n/plenum-business-workforce.json'
      - 'src/plenum_ai/openhands_coding_agent.py'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
concurrency:
  # Distinct owner-authorized repair issues must not cancel one another.
  # The original ref-wide concurrency group cancelled valid #717 when #719 opened.
  group: workforce-runtime-${{ github.event_name == 'issues' && github.event.issue.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'issues' }}

jobs:
  native-n8n-import:
    if: github.event_name != 'issues' && github.ref != 'refs/heads/feat/openhands-one-repair-check-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify nine public specialist assignments without external accounts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          w=json.loads(Path('integrations/n8n/plenum-business-workforce.json').read_text())
          assert w['active'] is False and len(w['nodes']) == 6
          assert 'Founder Review Queue' in [n['name'] for n in w['nodes']]
          code=next(n for n in w['nodes'] if n['name']=='Founder Review Queue')['parameters']['jsCode']
          assert 'role:' in code and 'DRAFT_AWAITING_FOUNDER_REVIEW' in code
          assert 'external_actions_executed: false' in code
          assert not any('credentials' in n for n in w['nodes'])
          print('Nine-role review-only input contract PASS')
          PY
      - name: Pull official n8n Community engine into disposable runner
        run: |
          docker pull n8nio/n8n:latest
          docker image inspect n8nio/n8n:latest --format 'n8n image digest {{index .RepoDigests 0}}'
      - name: Import exact Plenum JSON with official n8n CLI (no production deployment)
        env:
          N8N_DIAGNOSTICS_ENABLED: 'false'
          N8N_PERSONALIZATION_ENABLED: 'false'
        run: |
          docker run --rm --network none --memory=3g --cpus=2 \
            -v "$PWD/integrations/n8n/plenum-business-workforce.json:/plenum/workforce.json:ro" \
            -e N8N_USER_FOLDER=/tmp/n8n \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            -e N8N_PERSONALIZATION_ENABLED=false \
            -e N8N_ENCRYPTION_KEY=public-ephemeral-prototype-not-a-secret-2026 \
            n8nio/n8n:latest import:workflow --input=/plenum/workforce.json
          echo 'Native n8n workflow import SUCCESS, execution/model connectivity not yet tested.'

  isolated-openhands-actual-model:
    if: >-
      github.event_name != 'issues' ||
      (github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
       github.event.issue.user.login == 'chadkhalil21-svg' &&
       github.event.issue.title == '[Plenum OpenHands] public repair')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    timeout-minutes: 32
    env:
      PLENUM_EPHEMERAL_RUNNER: confirmed
      PLENUM_OPENHANDS_MODEL: ${{ github.event_name == 'issues' && 'openai/glm-4.7-flash' || 'ollama/qwen3:1.7b' }}
      PLENUM_OPENHANDS_BASE_URL: ${{ github.event_name == 'issues' && 'https://plenum-public-wake.chadkhalil21.workers.dev/ai/v1' || 'http://127.0.0.1:11434' }}
      PLENUM_OPENHANDS_API_KEY: ''
      HF_HUB_DISABLE_TELEMETRY: '1'
      OLLAMA_KEEP_ALIVE: '2m'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Authorize original founder public source BEFORE any model/network call
        if: github.event_name == 'issues'
        run: >-
          PYTHONPATH=src python -m plenum_ai.openhands_coding_agent
          --event "$GITHUB_EVENT_PATH"
          --out reports/openhands-agent-preflight.json
      - name: Use only GitHub-issued ephemeral OIDC for original Free Worker AI
        if: github.event_name == 'issues'
        shell: bash
        run: |
          set -euo pipefail
          json=$(curl -fsS --max-time 15 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=plenum-original-public-coder")
          jwt=$(printf '%s' "$json" | python -c 'import json,sys;print(json.load(sys.stdin)["value"])')
          test "${#jwt}" -gt 300
          echo "::add-mask::$jwt"
          # Inspect ONLY the verified GitHub-origin IDENTITY CLAIMS locally;
          # never print, upload, or echo the JWT or source/secret material.
          printf '%s' "$jwt" | python -c '
          import base64,json,sys
          parts=sys.stdin.read().split(".")
          if len(parts)!=3: raise SystemExit("malformed_oidc_token")
          claims=json.loads(base64.urlsafe_b64decode(parts[1]+"="*((-len(parts[1]))%4)))
          repo="chadkhalil21-svg/Plenum-Scientific-Intelligence"
          checks={
            "issuer":claims.get("iss")=="https://token.actions.githubusercontent.com",
            "audience":claims.get("aud")=="plenum-original-public-coder",
            "repository":claims.get("repository")==repo,
            "immutable_owner_id":str(claims.get("repository_owner_id"))=="251133044",
            "immutable_repository_id":str(claims.get("repository_id"))=="1447724141",
            "immutable_subject":claims.get("sub")=="repo:chadkhalil21-svg@251133044/Plenum-Scientific-Intelligence@1447724141:ref:refs/heads/main",
            "workflow":claims.get("workflow_ref")==repo+"/.github/workflows/business-workforce-runtime.yml@refs/heads/main",
            "event":claims.get("event_name")=="issues",
          }
          for name,ok in checks.items(): print("PLENUM_ORIGINAL_OIDC_"+name.upper()+"="+("MATCH" if ok else "MISMATCH"))
          if not all(checks.values()): raise SystemExit("Original public repair JWT identity mismatch; no inference")
          '
          printf 'PLENUM_OPENHANDS_API_KEY=%s\n' "$jwt" >> "$GITHUB_ENV"
      - name: Start Ollama locally, never expose model server on public interface
        if: github.event_name != 'issues'
        run: |
          docker pull ollama/ollama:latest
          docker image inspect ollama/ollama:latest --format 'Ollama image digest {{index .RepoDigests 0}}'
          docker run -d --rm --name plenum-temporary-ollama \
            -p 127.0.0.1:11434:11434 \
            -e OLLAMA_CONTEXT_LENGTH=22000 \
            -e OLLAMA_NUM_PARALLEL=1 \
            --memory=6g --cpus=3 \
            ollama/ollama:latest
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null && exit 0
            sleep 2
          done
          docker logs plenum-temporary-ollama
          exit 1
      - name: Download open-weight Qwen to disposable local model server
        if: github.event_name != 'issues'
        run: |
          docker exec plenum-temporary-ollama ollama pull qwen3:1.7b
          docker exec plenum-temporary-ollama ollama list
      - name: Install exact previously reviewed OpenHands SDK
        run: |
          python -m pip install -e ".[openhands_tools]"
          python -m pip check
      - name: Run original OpenHands isolated file editor, retain REVIEW-ONLY artifact
        run: |
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            timeout 240 python -m plenum_ai.openhands_coding_agent --execute \
              --event "$GITHUB_EVENT_PATH" --out reports/openhands-agent-review.json
          else
            timeout 600 python -m plenum_ai.openhands_coding_agent --execute \
              --candidate-out reports/openhands-review/proposal.py \
              --out reports/openhands-agent-review.json
          fi
      - name: Verify real model call and inspectable public candidate without publication
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          data=json.load(open('reports/openhands-agent-review.json'))
          assert data['model_run_completed'] and data['candidate_syntax_valid']
          assert data['status']=='PROPOSAL_AWAITING_REVIEW'
          assert data['candidate_persisted']
          artifact = Path(data['candidate_artifact'])
          assert artifact.is_file() and artifact.stat().st_size > 0
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == data['candidate_artifact_sha256']
          assert artifact.suffix == ('.patch' if data['source_file'] else '.py')
          assert not data['generated_code_executed']
          assert not data['production_written'] and not data['external_accounts_changed']
          print('OpenHands model and real candidate PASS; SHA256:',data['candidate_sha256'])
          PY
      - name: Reuse original focused Python tests on model patch in offline restricted Docker sandbox
        if: github.event_name == 'issues'
        run: |
          python tools/verify_original_openhands_candidate.py \
            --report reports/openhands-agent-review.json \
            --verdict reports/openhands-sandbox-verdict.json
      - name: Reuse imported Google Goldfish as original independent read-only coding reviewer
        if: always() && github.event_name == 'issues'
        run: >-
          python -m plenum_ai.openhands_goldfish_review
          --event "$GITHUB_EVENT_PATH"
          --coding-report reports/openhands-agent-review.json
      - name: Preserve only public proof, no generated code or credentials
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openhands-original-review-${{ github.event.issue.number || github.run_id }}
          path: |
            reports/openhands-agent-review.json
            reports/openhands-agent-preflight.json
            reports/openhands-sandbox-verdict.json
            reports/openhands-goldfish-review.json
            reports/openhands-review/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record founder issue disposition, never code or prompts
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from urllib.request import Request,urlopen
          event=json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          issue=int(event["issue"]["number"])
          report=Path("reports/openhands-agent-review.json")
          status="BLOCKED_NO_REVIEWABLE_PATCH"
          digest=""
          if report.is_file():
              d=json.loads(report.read_text())
              if (d.get("status")=="BLOCKED_ORIGINAL_DAILY_FREE_AI_CAP"
                  and d.get("failure_category")=="LOCAL_DURABLE_OBJECT_DAILY_BUDGET"
                  and not d.get("model_run_completed")
                  and not d.get("candidate_persisted")):
                  status="BLOCKED_LOCAL_FREE_AI_DAILY_CAP_NO_SAME_DAY_RETRY"
              if (d.get("candidate_persisted") and d.get("status")=="PROPOSAL_AWAITING_REVIEW"
                  and d.get("candidate_artifact", "").endswith(".patch")
                  and not d.get("production_written") and not d.get("external_accounts_changed")):
                  status="REVIEW_ONLY_PATCH_READY_NOT_MERGED"
                  digest=d.get("candidate_artifact_sha256","")
          # A runnable candidate is never equivalent to trusted source.
          # This is an OFFLINE sandbox of the ORIGINAL test, not auto-merge.
          guard=Path("reports/openhands-sandbox-verdict.json")
          if guard.is_file():
              assessment=json.loads(guard.read_text())
              if assessment.get("existing_focused_tests_passed") is True:
                  status="REVIEW_ONLY_EXISTING_TESTS_PASS_SEMANTIC_REVIEW_REQUIRED"
              elif status=="REVIEW_ONLY_PATCH_READY_NOT_MERGED":
                  status="BLOCKED_EXISTING_SOURCE_TESTS"
          goldfish=Path("reports/openhands-goldfish-review.json")
          reviewer_state="NOT_RUN"
          reviewer_blocker_count=0
          if goldfish.is_file():
              critique=json.loads(goldfish.read_text())
              reviewer_state=critique.get("status", "BLOCKED_INVALID_REVIEW")
              reviewer_blocker_count=(critique.get("severity_counts") or {}).get("BLOCKER", 0)
              if reviewer_state=="ADVISORY_WITH_BLOCKERS" and reviewer_blocker_count>0:
                  status="BLOCKED_GOLDFISH_SEMANTIC_REVIEW_REQUIRED"
          run=os.environ["GITHUB_RUN_ID"]
          attempt=os.environ["GITHUB_RUN_ATTEMPT"]
          if not attempt.isascii() or not attempt.isdecimal() or not 1 <= int(attempt) <= 100:
              raise ValueError("invalid original GitHub attempt identifier")
          marker="<!-- plenum-openhands-review:"+run+":attempt:"+attempt+" -->"
          # Preserve idempotency for existing original first-attempt receipts.
          legacy="<!-- plenum-openhands-review:"+run+" -->"
          root="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/issues/"+str(issue)+"/comments"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "Accept":"application/vnd.github+json",
                   "User-Agent":"PlenumOriginalOpenHandsReview/1"}
          with urlopen(Request(root+"?per_page=100",headers=headers),timeout=15) as response:
              comments=json.loads(response.read(250000))
          if not any(
                  marker in str(x.get("body",""))
                  or (attempt=="1" and legacy in str(x.get("body","")))
                  for x in comments):
              msg=(marker+"\n**OpenHands original public repair: "+status+"**\n"
                   "Attempt: "+attempt+"\n"
                   "Untrusted candidate only, no source code merged, no accounts written. "
                   "Independent semantic review and original CI remain REQUIRED.\n"
                   "Artifact SHA256: "+digest+"\n"
                   "Original Goldfish read-only advisory: "+str(reviewer_state)+"\n"
                   "Goldfish explicit blockers: "+str(reviewer_blocker_count)+"\n"
                   "Goldfish cannot authorize source execution or auto-merge.\n"
                   "Evidence: https://github.com/"+os.environ["GITHUB_REPOSITORY"]
                   +"/actions/runs/"+run)
              req=Request(root,data=json.dumps({"body":msg}).encode(),
                          headers={**headers,"Content-Type":"application/json"},method="POST")
              with urlopen(req,timeout=15) as response:
                  assert response.status==201
          PY
      - name: Delete transient local model container
        if: always()
        run: docker rm -f plenum-temporary-ollama 2>/dev/null || true

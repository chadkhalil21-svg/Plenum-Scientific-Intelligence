name: Business Workforce | Real n8n Import and OpenHands Local-Model Trial

# One-time isolated execution evidence on the integration branch; manual thereafter.
# Never run on a schedule, production account or default-branch push.
on:
  push:
    branches: [feat/live-business-workforce-20261110, feat/openhands-one-repair-check-20261110]
    paths:
      - '.github/workflows/business-workforce-runtime.yml'
      - 'integrations/n8n/plenum-business-workforce.json'
      - 'src/plenum_ai/openhands_coding_agent.py'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
concurrency:
  # Distinct owner-authorized repair issues must not cancel one another.
  # The original ref-wide concurrency group cancelled valid #717 when #719 opened.
  group: workforce-runtime-${{ github.event_name == 'issues' && github.event.issue.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'issues' }}

jobs:
  native-n8n-import:
    if: github.event_name != 'issues' && github.ref != 'refs/heads/feat/openhands-one-repair-check-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify nine public specialist assignments without external accounts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          w=json.loads(Path('integrations/n8n/plenum-business-workforce.json').read_text())
          assert w['active'] is False and len(w['nodes']) == 6
          assert 'Founder Review Queue' in [n['name'] for n in w['nodes']]
          code=next(n for n in w['nodes'] if n['name']=='Founder Review Queue')['parameters']['jsCode']
          assert 'role:' in code and 'DRAFT_AWAITING_FOUNDER_REVIEW' in code
          assert 'external_actions_executed: false' in code
          assert not any('credentials' in n for n in w['nodes'])
          print('Nine-role review-only input contract PASS')
          PY
      - name: Pull official n8n Community engine into disposable runner
        run: |
          docker pull n8nio/n8n:latest
          docker image inspect n8nio/n8n:latest --format 'n8n image digest {{index .RepoDigests 0}}'
      - name: Import exact Plenum JSON with official n8n CLI (no production deployment)
        env:
          N8N_DIAGNOSTICS_ENABLED: 'false'
          N8N_PERSONALIZATION_ENABLED: 'false'
        run: |
          docker run --rm --network none --memory=3g --cpus=2 \
            -v "$PWD/integrations/n8n/plenum-business-workforce.json:/plenum/workforce.json:ro" \
            -e N8N_USER_FOLDER=/tmp/n8n \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            -e N8N_PERSONALIZATION_ENABLED=false \
            -e N8N_ENCRYPTION_KEY=public-ephemeral-prototype-not-a-secret-2026 \
            n8nio/n8n:latest import:workflow --input=/plenum/workforce.json
          echo 'Native n8n workflow import SUCCESS, execution/model connectivity not yet tested.'

  isolated-openhands-actual-model:
    if: >-
      github.event_name != 'issues' ||
      (github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
       github.event.issue.user.login == 'chadkhalil21-svg' &&
       github.event.issue.title == '[Plenum OpenHands] public repair')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
      id-token: write
    timeout-minutes: 32
    env:
      PLENUM_EPHEMERAL_RUNNER: confirmed
      PLENUM_OPENHANDS_MODEL: ${{ github.event_name == 'issues' && 'openai/glm-4.7-flash' || 'ollama/qwen3:1.7b' }}
      PLENUM_OPENHANDS_BASE_URL: ${{ github.event_name == 'issues' && 'https://plenum-public-wake.chadkhalil21.workers.dev/ai/v1' || 'http://127.0.0.1:11434' }}
      PLENUM_OPENHANDS_API_KEY: ''
      HF_HUB_DISABLE_TELEMETRY: '1'
      OLLAMA_KEEP_ALIVE: '2m'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Authorize original founder public source BEFORE any model/network call
        id: owner-preflight
        if: github.event_name == 'issues'
        run: |
          PYTHONPATH=src python -m plenum_ai.openhands_coding_agent \
            --event "$GITHUB_EVENT_PATH" --out reports/openhands-agent-preflight.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data=json.load(open('reports/openhands-agent-preflight.json'))
          engine=data.get('engine','openhands')
          assert engine in ('openhands','aider_local_ollama')
          print('engine='+engine)
          model=data.get('local_model','qwen2.5-coder:7b')
          assert model in ('qwen2.5-coder:7b','qwen3.5:9b-q4_K_M')
          print('local_model='+model)
          PY
      - name: Reserve actual original coding execution before any model or provider access
        id: coding-reservation
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from datetime import datetime,timezone
          import json,os
          from plenum_ai.minister_missed_public_wake import reserve_native_coder
          event=json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          approved=reserve_native_coder(
              event, os.environ["GH_TOKEN"],
              run_id=int(os.environ["GITHUB_RUN_ID"]),
              attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
              now=datetime.now(timezone.utc))
          if not approved:
              raise SystemExit("BLOCKED_ORIGINAL_CODING_EXECUTION_ALREADY_RESERVED_OR_UNVERIFIED_RETRY")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("authorized=true",file=output)
          PY
      - name: Use only GitHub-issued ephemeral OIDC for original Free Worker AI
        if: github.event_name == 'issues' && steps.coding-reservation.outputs.authorized == 'true' && steps.owner-preflight.outputs.engine == 'openhands'
        shell: bash
        run: |
          set -euo pipefail
          # A public, read-only health check consumes no inference quota. Fail closed
          # before minting OIDC or invoking any model if production is stale.
          curl -fsS --max-time 15 --max-filesize 8192 https://plenum-public-wake.chadkhalil21.workers.dev/health | python -c '
          import json,sys
          data=json.load(sys.stdin)
          if not (data.get("source_contract_revision")=="original-oidc-and-openhands-chat-v3" and data.get("state")=="REACHABLE_NOT_A_RUNNING_AGENT" and data.get("no_model") is True and data.get("ai_binding_present") is True):
              raise SystemExit("BLOCKED_ORIGINAL_CLOUD_REVISION_NOT_VERIFIED")
          print("ORIGINAL_CLOUD_REVISION_VERIFIED")
          '
          json=$(curl -fsS --max-time 15 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=plenum-original-public-coder")
          jwt=$(printf '%s' "$json" | python -c 'import json,sys;print(json.load(sys.stdin)["value"])')
          test "${#jwt}" -gt 300
          echo "::add-mask::$jwt"
          # Inspect ONLY the verified GitHub-origin IDENTITY CLAIMS locally;
          # never print, upload, or echo the JWT or source/secret material.
          printf '%s' "$jwt" | python -c '
          import base64,json,sys
          parts=sys.stdin.read().split(".")
          if len(parts)!=3: raise SystemExit("malformed_oidc_token")
          claims=json.loads(base64.urlsafe_b64decode(parts[1]+"="*((-len(parts[1]))%4)))
          repo="chadkhalil21-svg/Plenum-Scientific-Intelligence"
          checks={
            "issuer":claims.get("iss")=="https://token.actions.githubusercontent.com",
            "audience":claims.get("aud")=="plenum-original-public-coder",
            "repository":claims.get("repository")==repo,
            "immutable_owner_id":str(claims.get("repository_owner_id"))=="251133044",
            "immutable_repository_id":str(claims.get("repository_id"))=="1447724141",
            "immutable_subject":claims.get("sub")=="repo:chadkhalil21-svg@251133044/Plenum-Scientific-Intelligence@1447724141:ref:refs/heads/main",
            "workflow":claims.get("workflow_ref")==repo+"/.github/workflows/business-workforce-runtime.yml@refs/heads/main",
            "event":claims.get("event_name")=="issues",
          }
          for name,ok in checks.items(): print("PLENUM_ORIGINAL_OIDC_"+name.upper()+"="+("MATCH" if ok else "MISMATCH"))
          if not all(checks.values()): raise SystemExit("Original public repair JWT identity mismatch; no inference")
          '
          printf 'PLENUM_OPENHANDS_API_KEY=%s\n' "$jwt" >> "$GITHUB_ENV"
      - name: Install exact previously reviewed OpenHands SDK
        if: github.event_name != 'issues' || (steps.coding-reservation.outputs.authorized == 'true' && steps.owner-preflight.outputs.engine != 'aider_local_ollama')
        run: |
          python -m pip install -e ".[openhands_tools]"
          python -m pip check
      - name: Invoke authenticated original cloud coding engine once
        id: cloud-coding
        if: github.event_name == 'issues' && steps.coding-reservation.outputs.authorized == 'true' && steps.owner-preflight.outputs.engine == 'openhands'
        continue-on-error: true
        run: |
          timeout 240 python -m plenum_ai.openhands_coding_agent --execute \
            --event "$GITHUB_EVENT_PATH" --out reports/openhands-agent-review.json
      - name: Reserve owner-verified Gemini Free recovery only from bound terminal cloud failure
        id: gemini-fallback-preflight
        if: steps.coding-reservation.outputs.authorized == 'true' && steps.cloud-coding.outcome == 'failure' && vars.PLENUM_GEMINI_FREE_RECOVERY_DISABLED != 'true'
        env:
          # Existing Default Gemini Project verified Free by owner on 2026-11-15.
          # Disable this route before changing the project/key/billing tier and reverify.
          PLENUM_GEMINI_FREE_PROJECT_APPROVAL: 'owner-verified-default-gemini-project-free-2026-11-15'
        run: |
          PYTHONPATH=src python -m plenum_ai.openhands_coding_agent --reserve-gemini-fallback \
            --event "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
      - name: Fail closed for every unclassified or unauthorized cloud failure
        if: steps.cloud-coding.outcome == 'failure' && steps.gemini-fallback-preflight.outputs.eligible != 'true'
        run: exit 1
      - name: Invoke fixed Gemini Free OpenHands FileEditor once, review only
        if: steps.coding-reservation.outputs.authorized == 'true' && steps.gemini-fallback-preflight.outputs.eligible == 'true'
        env:
          PLENUM_GEMINI_FREE_PROJECT_APPROVAL: 'owner-verified-default-gemini-project-free-2026-11-15'
          PLENUM_GEMINI_API_KEY: ${{ secrets.PLENUM_GEMINI_API_KEY }}
          PLENUM_OPENHANDS_API_KEY: ''
        run: |
          if PYTHONPATH=src timeout 240 python -m plenum_ai.openhands_coding_agent --execute --gemini-fallback \
            --event "$GITHUB_EVENT_PATH" --out reports/openhands-agent-review.json >/dev/null 2>&1; then
            echo 'Gemini recovery candidate generated; original review gate required'
          else
            echo 'Gemini recovery blocked; inspect nonsecret receipt'
            exit 1
          fi
      - name: Start Ollama locally, never expose model server on public interface
        if: github.event_name != 'issues' || (steps.coding-reservation.outputs.authorized == 'true' && steps.owner-preflight.outputs.engine == 'aider_local_ollama')
        run: |
          docker pull ollama/ollama:latest
          docker image inspect ollama/ollama:latest --format 'Ollama image digest {{index .RepoDigests 0}}'
          # Existing free public runner: 16GiB RAM, 4 CPU. Keep 2GiB for Aider
          # and remaining memory for OS; old manual route still uses 6GiB.
          ram=6g
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then ram=10g; fi
          docker run -d --rm --name plenum-temporary-ollama \
            -p 127.0.0.1:11434:11434 \
            -e OLLAMA_CONTEXT_LENGTH=22000 \
            -e OLLAMA_NUM_PARALLEL=1 \
            --memory="$ram" --cpus=3 \
            ollama/ollama:latest
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null && exit 0
            sleep 2
          done
          docker logs plenum-temporary-ollama
          exit 1
      - name: Download open-weight Qwen to disposable local model server
        if: github.event_name != 'issues'
        run: |
          docker exec plenum-temporary-ollama ollama pull qwen3:1.7b
          docker exec plenum-temporary-ollama ollama list
      - name: Download verified free coding model and pinned isolated client before isolating their network
        if: steps.coding-reservation.outputs.authorized == 'true' && steps.owner-preflight.outputs.engine == 'aider_local_ollama'
        env:
          PLENUM_LOCAL_MODEL: ${{ steps.owner-preflight.outputs.local_model }}
        run: |
          set -euo pipefail
          case "$PLENUM_LOCAL_MODEL" in
            qwen2.5-coder:7b) expected=dae161e27b0e ;;
            qwen3.5:9b-q4_K_M) expected=56671c2ab938 ;;
            *) exit 1 ;;
          esac
          # Verify actual free-runner headroom before a larger model pull.
          if [ "$PLENUM_LOCAL_MODEL" = "qwen3.5:9b-q4_K_M" ]; then
            test "$(df --output=avail -B1 / | tail -1 | tr -d ' ')" -ge 9000000000
            test "$(awk '/MemTotal/ {print $2}' /proc/meminfo)" -ge 14000000
          fi
          docker exec plenum-temporary-ollama ollama pull "$PLENUM_LOCAL_MODEL"
          docker exec plenum-temporary-ollama ollama list
          digest=$(docker exec plenum-temporary-ollama ollama list | awk -v model="$PLENUM_LOCAL_MODEL" '$1==model {print $2}')
          test "$digest" = "$expected"
          image=$(PYTHONPATH=src python -c 'from plenum_ai.openhands_coding_agent import AIDER_IMAGE; print(AIDER_IMAGE)')
          docker pull "$image"
          docker network create --internal plenum-coding-isolated
          docker network connect plenum-coding-isolated plenum-temporary-ollama
          docker network disconnect bridge plenum-temporary-ollama
      - name: Run selected original isolated coding engine, retain REVIEW-ONLY artifact
        if: github.event_name != 'issues' || (steps.coding-reservation.outputs.authorized == 'true' && steps.owner-preflight.outputs.engine == 'aider_local_ollama')
        env:
          PLENUM_SELECTED_CODING_ENGINE: ${{ steps.owner-preflight.outputs.engine }}
          PLENUM_OPENHANDS_API_KEY: ''
        run: |
          if [ "$PLENUM_SELECTED_CODING_ENGINE" = "aider_local_ollama" ]; then
            PYTHONPATH=src timeout 1020 python -m plenum_ai.openhands_coding_agent --execute \
              --event "$GITHUB_EVENT_PATH" --out reports/openhands-agent-review.json
          else
            timeout 600 python -m plenum_ai.openhands_coding_agent --execute \
              --candidate-out reports/openhands-review/proposal.py \
              --out reports/openhands-agent-review.json
          fi
      - name: Verify real model call and inspectable public candidate without publication
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          data=json.load(open('reports/openhands-agent-review.json'))
          assert data['model_run_completed'] and data['candidate_syntax_valid']
          assert data['status']=='PROPOSAL_AWAITING_REVIEW'
          assert data['candidate_persisted']
          artifact = Path(data['candidate_artifact'])
          assert artifact.is_file() and artifact.stat().st_size > 0
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == data['candidate_artifact_sha256']
          assert artifact.suffix == ('.patch' if data['source_file'] else '.py')
          assert not data['generated_code_executed']
          assert not data['production_written'] and not data['external_accounts_changed']
          print(data['upstream'],'model and real candidate PASS; SHA256:',data['candidate_sha256'])
          PY
      - name: Reuse original focused Python tests on model patch in offline restricted Docker sandbox
        if: github.event_name == 'issues'
        env:
          PYTHONPATH: src
          PLENUM_SELECTED_CODING_ENGINE: ${{ steps.owner-preflight.outputs.engine }}
          PLENUM_ORIGINAL_CODING_RESERVED: ${{ steps.coding-reservation.outputs.authorized }}
        run: |
          args=()
          if [ "$PLENUM_SELECTED_CODING_ENGINE" = "aider_local_ollama" ] && [ "$PLENUM_ORIGINAL_CODING_RESERVED" = "true" ]; then
            args+=(--recover-local-event "$GITHUB_EVENT_PATH")
          fi
          python tools/verify_original_openhands_candidate.py \
            --report reports/openhands-agent-review.json \
            --verdict reports/openhands-sandbox-verdict.json "${args[@]}"
      - name: Examine only the saved interrupted original patch without replaying the model
        if: >-
          always() && github.event_name == 'issues' && steps.coding-reservation.outputs.authorized == 'true' &&
          steps.owner-preflight.outputs.engine == 'openhands' && steps.cloud-coding.outcome == 'failure' &&
          steps.gemini-fallback-preflight.outputs.eligible != 'true'
        env:
          PLENUM_REVIEW_INTERRUPTED: confirmed
          PYTHONPATH: src
        run: |
          if test -f reports/openhands-agent-review.json; then
            python tools/verify_original_openhands_candidate.py \
              --report reports/openhands-agent-review.json \
              --verdict reports/openhands-sandbox-verdict.json
          fi
      - name: Reuse imported Google Goldfish as original independent read-only coding reviewer
        if: always() && github.event_name == 'issues' && steps.coding-reservation.outputs.authorized == 'true' && steps.cloud-coding.outcome == 'success'
        run: >-
          python -m plenum_ai.openhands_goldfish_review
          --event "$GITHUB_EVENT_PATH"
          --coding-report reports/openhands-agent-review.json
      - name: Preserve only public proof, no generated code or credentials
        id: original_review_archive
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openhands-original-review-${{ github.event.issue.number || github.run_id }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            reports/openhands-agent-review.json
            reports/openhands-agent-preflight.json
            reports/openhands-cloud-failure.json
            reports/openhands-gemini-fallback-reservation.json
            reports/openhands-gemini-fallback-execution.json
            reports/openhands-sandbox-verdict.json
            reports/openhands-goldfish-review.json
            reports/openhands-review/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record founder issue disposition, never code or prompts
        if: always() && github.event_name == 'issues' && steps.coding-reservation.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
          PLENUM_REVIEW_ARCHIVE_OUTCOME: ${{ steps.original_review_archive.outcome }}
          PLENUM_REVIEW_ARCHIVE_ID: ${{ steps.original_review_archive.outputs.artifact-id }}
          PLENUM_REVIEW_ARCHIVE_DIGEST: ${{ steps.original_review_archive.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from urllib.request import Request,urlopen
          event=json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          issue=int(event["issue"]["number"])
          report=Path("reports/openhands-agent-review.json")
          status="BLOCKED_NO_REVIEWABLE_PATCH"
          digest=""
          engine="openhands"
          preflight=Path("reports/openhands-agent-preflight.json")
          if preflight.is_file():
              engine=json.loads(preflight.read_text()).get("engine","openhands")
          fallback=Path("reports/openhands-gemini-fallback-reservation.json")
          attempted=fallback.is_file()
          cloud_status="NOT_APPLICABLE"
          if attempted:
              engine="gemini_free_openhands"
              cloud_status=json.loads(fallback.read_text()).get("cloud_attempt_status","UNKNOWN")
              status="BLOCKED_GEMINI_FALLBACK_PREPARATION"
              if Path("reports/openhands-gemini-fallback-execution.json").is_file():
                  status="BLOCKED_GEMINI_FALLBACK_NO_REVIEWABLE_PATCH"
          if report.is_file():
              d=json.loads(report.read_text())
              partial=Path('reports/openhands-review')/f'issue-{issue}.patch'
              if (not attempted and d.get('status')=='BLOCKED_INTERRUPTED_WITH_REVIEW_ARTIFACT'
                  and d.get('candidate_persisted') is True and d.get('model_run_completed') is False
                  and d.get('candidate_artifact')==partial.as_posix()
                  and d.get('origin_issue_number')==issue and d.get('origin_run_id')==os.environ['GITHUB_RUN_ID']
                  and d.get('origin_run_attempt')==os.environ.get('GITHUB_RUN_ATTEMPT','1')
                  and all(d.get(key) is False for key in ('generated_code_executed','production_written','external_accounts_changed'))
                  and not partial.parent.is_symlink() and partial.is_file() and not partial.is_symlink()
                  and 0<partial.stat().st_size<=80000
                  and hashlib.sha256(partial.read_bytes()).hexdigest()==d.get('candidate_artifact_sha256')):
                  status='BLOCKED_INTERRUPTED_WITH_REVIEW_ARTIFACT'
                  digest=d['candidate_artifact_sha256']
                  # Only typed, origin-bound interruption categories are public.
                  cloud_status={
                      'LOCAL_DURABLE_OBJECT_DAILY_BUDGET':'BLOCKED_ORIGINAL_DAILY_FREE_AI_CAP',
                      'ORIGINAL_ENGINE_TRANSPORT':'BLOCKED_ORIGINAL_CLOUD_TRANSPORT',
                  }.get(d.get('failure_category'),'UNKNOWN_INTERRUPTION')
              if (not attempted and d.get("status")=="BLOCKED_ORIGINAL_DAILY_FREE_AI_CAP"
                  and d.get("failure_category")=="LOCAL_DURABLE_OBJECT_DAILY_BUDGET"
                  and not d.get("model_run_completed")
                  and not d.get("candidate_persisted")):
                  status="BLOCKED_LOCAL_FREE_AI_DAILY_CAP_NO_SAME_DAY_RETRY"
              if (d.get("candidate_persisted") and d.get("status")=="PROPOSAL_AWAITING_REVIEW"
                  and d.get("candidate_artifact", "").endswith(".patch")
                  and not d.get("production_written") and not d.get("external_accounts_changed")):
                  status="REVIEW_ONLY_PATCH_READY_NOT_MERGED"
                  digest=d.get("candidate_artifact_sha256","")
          # A runnable candidate is never equivalent to trusted source.
          # This is an OFFLINE sandbox of the ORIGINAL test, not auto-merge.
          guard=Path("reports/openhands-sandbox-verdict.json")
          sandbox_state="NOT_RUN"
          if guard.is_file() and not guard.is_symlink():
              assessment=json.loads(guard.read_text())
              if status=='BLOCKED_INTERRUPTED_WITH_REVIEW_ARTIFACT':
                  sandbox_state='INTERRUPTED_FOCUSED_TESTS_NOT_ACCEPTED'
                  if (assessment.get('schema')=='plenum-original-openhands-candidate-regression-v1'
                      and assessment.get('status')=='INTERRUPTED_FOCUSED_TESTS_PASS_REVIEW_STILL_REQUIRED'
                      and assessment.get('candidate_artifact_sha256')==digest
                      and assessment.get('source_file')==d.get('source_file')
                      and assessment.get('source_sha256')==d.get('source_sha256')
                      and assessment.get('origin_issue_number')==issue
                      and assessment.get('origin_run_id')==os.environ['GITHUB_RUN_ID']
                      and assessment.get('origin_run_attempt')==os.environ.get('GITHUB_RUN_ATTEMPT','1')
                      and assessment.get('existing_focused_tests_passed') is True
                      and assessment.get('network_disabled_for_candidate') is True
                      and all(assessment.get(key) is False for key in ('model_run_completed','independent_semantic_approval','automatically_merged','production_written','external_accounts_changed'))):
                      sandbox_state='INTERRUPTED_FOCUSED_TESTS_PASS_REVIEW_STILL_REQUIRED'
              elif (assessment.get('status')=='FOCUSED_TESTS_PASS_REVIEW_STILL_REQUIRED'
                    and assessment.get("existing_focused_tests_passed") is True
                    and assessment.get("task_acceptance_passed") is not False
                    and assessment.get("candidate_artifact_sha256")==digest):
                  status="REVIEW_ONLY_EXISTING_TESTS_PASS_SEMANTIC_REVIEW_REQUIRED"
                  sandbox_state='FOCUSED_TESTS_PASS_REVIEW_STILL_REQUIRED'
              elif status=="REVIEW_ONLY_PATCH_READY_NOT_MERGED":
                  if assessment.get("task_acceptance_passed") is False:
                      status="BLOCKED_TASK_BEHAVIOR_ACCEPTANCE"
                      sandbox_state=assessment.get("status","BLOCKED_TASK_ACCEPTANCE")
                  else:
                      status="BLOCKED_EXISTING_SOURCE_TESTS"
          goldfish=Path("reports/openhands-goldfish-review.json")
          reviewer_state="NOT_RUN"
          reviewer_blocker_count=0
          if goldfish.is_file() and status!='BLOCKED_INTERRUPTED_WITH_REVIEW_ARTIFACT':
              critique=json.loads(goldfish.read_text())
              reviewer_state=critique.get("status", "BLOCKED_INVALID_REVIEW")
              reviewer_blocker_count=(critique.get("severity_counts") or {}).get("BLOCKER", 0)
              if reviewer_state=="ADVISORY_WITH_BLOCKERS" and reviewer_blocker_count>0:
                  status="BLOCKED_GOLDFISH_SEMANTIC_REVIEW_REQUIRED"
          run=os.environ["GITHUB_RUN_ID"]
          attempt=os.environ["GITHUB_RUN_ATTEMPT"]
          if not attempt.isascii() or not attempt.isdecimal() or not 1 <= int(attempt) <= 100:
              raise ValueError("invalid original GitHub attempt identifier")
          marker="<!-- plenum-openhands-review:"+run+":attempt:"+attempt+" -->"
          root="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/issues/"+str(issue)+"/comments"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "Accept":"application/vnd.github+json",
                   "User-Agent":"PlenumOriginalOpenHandsReview/1"}
          with urlopen(Request(root+"?per_page=100",headers=headers),timeout=15) as response:
              comments=json.loads(response.read(250000))
          from plenum_ai.minister_missed_public_wake import (
              has_original_coder_terminal_receipt, coding_archive_receipt_lines)
          if not has_original_coder_terminal_receipt(comments, int(run), int(attempt)):
              archive_lines=coding_archive_receipt_lines(issue=issue, run=run, attempt=attempt,
                  outcome=os.getenv('PLENUM_REVIEW_ARCHIVE_OUTCOME',''),
                  artifact_id=os.getenv('PLENUM_REVIEW_ARCHIVE_ID',''),
                  digest=os.getenv('PLENUM_REVIEW_ARCHIVE_DIGEST',''))
              headline={"openhands":"OpenHands original public repair","aider_local_ollama":"Aider local original public repair","gemini_free_openhands":"Gemini free original public repair"}[engine]
              msg=(marker+"\n**"+headline+": "+status+"**\n"
                   "Coding engine: "+engine+"\n"
                   "Gemini fallback attempted: "+str(attempted).lower()+"\n"
                   "Cloud attempt status: "+cloud_status+"\n"
                   "Attempt: "+attempt+"\n"
                   "Untrusted candidate only, no source code merged, no accounts written. "
                   "Independent semantic review and original CI remain REQUIRED.\n"
                   "Artifact SHA256: "+digest+"\n"
                   +"\n".join(archive_lines)+"\n"
                   "Original offline sandbox: "+sandbox_state+"\n"
                   "Original Goldfish read-only advisory: "+str(reviewer_state)+"\n"
                   "Goldfish explicit blockers: "+str(reviewer_blocker_count)+"\n"
                   "Goldfish cannot authorize source execution or auto-merge.\n"
                   "Evidence: https://github.com/"+os.environ["GITHUB_REPOSITORY"]
                   +"/actions/runs/"+run)
              req=Request(root,data=json.dumps({"body":msg}).encode(),
                          headers={**headers,"Content-Type":"application/json"},method="POST")
              with urlopen(req,timeout=15) as response:
                  assert response.status==201
          PY
      - name: Delete transient local model container
        if: always()
        run: |
          docker rm -f plenum-temporary-ollama 2>/dev/null || true
          docker network rm plenum-coding-isolated 2>/dev/null || true





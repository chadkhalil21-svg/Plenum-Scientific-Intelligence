name: Prospective SkillOpt engineering transfer 1048
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'tools/run_native_miniswe_mission.py'
      - 'tests/acceptance/checkpoint_hardlink_1048.py'
      - '.github/workflows/prometheus-skillopt-prospective-1048.yml'
permissions:
  contents: read
concurrency:
  group: plenum-original-prospective-1048
  cancel-in-progress: false
jobs:
  reserve:
    if: github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' && github.actor == 'chadkhalil21-svg' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'prometheus-skillopt-prospective-1048' && github.event.pull_request.base.ref == 'prometheus-miniswe-native-current-main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    outputs:
      reserved: ${{ steps.reserve.outputs.reserved }}
    steps:
      - id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=chadkhalil21-svg/Plenum-Scientific-Intelligence
          gh api "repos/$repo/issues/1048" | jq -e '.user.login=="chadkhalil21-svg" and .state=="open" and .title=="[Plenum Prometheus] Independent engineering assignment: checkpoint hard-link isolation" and (.body|contains("reject hard-linked files as checkpoint inputs or destinations and as worker artifacts"))' >/dev/null
          gh api --paginate "repos/$repo/issues/1048/comments?per_page=100" | jq -s add > "$RUNNER_TEMP/prior.json"
          if jq -e 'any(.[]; .body|contains("plenum-prospective-1048-reserved-v1"))' "$RUNNER_TEMP/prior.json" >/dev/null; then
            echo reserved=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --method POST "repos/$repo/issues/1048/comments" -f body="<!-- plenum-prospective-1048-reserved-v1:$GITHUB_RUN_ID --> One prospective comparison, two distinct arms (incumbent and learned), no historical replay or automatic promotion." >/dev/null
          echo reserved=true >> "$GITHUB_OUTPUT"
  engineering:
    needs: reserve
    if: needs.reserve.outputs.reserved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        arm: [incumbent, learned]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve bound actual SkillOpt output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 90 --max-filesize 2000000 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/chadkhalil21-svg/Plenum-Scientific-Intelligence/actions/artifacts/15232351717/zip" -o "$RUNNER_TEMP/skill.zip"
          echo "dea76a9a3c4f0f7f3f37eb930c7743489f7489a2ff37a8ec9bf481a86ea0750a  $RUNNER_TEMP/skill.zip" | sha256sum -c -
      - name: Install existing upstream native executor
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/mini-venv"
          "$RUNNER_TEMP/mini-venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: 'mini-swe-agent==2.4.6' 'litellm!=1.82.7,!=1.82.8'
          "$RUNNER_TEMP/mini-venv/bin/python" -m pip check
          "$RUNNER_TEMP/mini-venv/bin/python" -m py_compile tools/run_native_miniswe_mission.py
          docker pull python:3.12-slim
          test "$(df --output=avail -B1 / | tail -1 | tr -d ' ')" -ge 9000000000
          test "$(awk '/MemTotal/ {print $2}' /proc/meminfo)" -ge 14000000
      - name: Independently establish actual original defect
        run: |
          set -euo pipefail
          PYTHONPATH=src:tools python - <<'PY'
          import pathlib,subprocess
          from verify_original_openhands_candidate import sandbox_command,completed_unittest
          result=subprocess.run(sandbox_command(pathlib.Path.cwd(),"python:3.12-slim","/work/tests/acceptance","checkpoint_hardlink_1048.py"),capture_output=True,text=True,timeout=150)
          if not completed_unittest(result,failed=True) or "Ran 3 tests" not in result.stderr or "failures=2" not in result.stderr:
              raise SystemExit("Original behavior defect not independently established")
          print("Original normal behavior passes; two independent hard-link behaviors fail.")
          PY
      - name: Verify exact skill and prospective arm binding
        env:
          ARM: ${{ matrix.arm }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mini-home"
          env -i PATH="$RUNNER_TEMP/mini-venv/bin:/usr/bin:/bin" HOME="$RUNNER_TEMP/mini-home" PYTHONPATH=src:tools MSWEA_SILENT_STARTUP=1 PLENUM_PROSPECTIVE_1048_RESERVED="$ARM" "$RUNNER_TEMP/mini-venv/bin/python" -c 'import sys; from pathlib import Path; import run_native_miniswe_mission as m; m.configure_prospective(sys.argv[1],Path(sys.argv[2])); print(m.PROSPECTIVE)' "$ARM" "$RUNNER_TEMP/skill.zip"
      - name: Start original free local inference
        run: |
          set -euo pipefail
          docker run -d --rm --name plenum-miniswe-ollama -p 127.0.0.1:11434:11434 -e OLLAMA_CONTEXT_LENGTH=8192 -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_NO_CLOUD=1 --memory=10g --cpus=3 ollama/ollama:latest
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          docker exec plenum-miniswe-ollama ollama pull qwen3.5:9b-q4_K_M
          test "$(docker exec plenum-miniswe-ollama ollama list | awk '$1=="qwen3.5:9b-q4_K_M" {print $2}')" = 56671c2ab938
      - name: Complete genuine repair with independent original verifier
        env:
          ARM: ${{ matrix.arm }}
        run: |
          set -euo pipefail
          env -i PATH="$RUNNER_TEMP/mini-venv/bin:/usr/bin:/bin" HOME="$RUNNER_TEMP/mini-home" PYTHONPATH=src GITHUB_ACTIONS=true GITHUB_REPOSITORY=chadkhalil21-svg/Plenum-Scientific-Intelligence PLENUM_MINISWE_RESERVED=true PLENUM_PROSPECTIVE_1048_RESERVED="$ARM" MSWEA_SILENT_STARTUP=1 MSWEA_MODEL_RETRY_STOP_AFTER_ATTEMPT=1 LITELLM_LOCAL_MODEL_COST_MAP=True LITELLM_LOG=ERROR DO_NOT_TRACK=1 "$RUNNER_TEMP/mini-venv/bin/python" tools/run_native_miniswe_mission.py --prospective-arm "$ARM" --skill-archive "$RUNNER_TEMP/skill.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-1048-prospective-${{ matrix.arm }}
          path: |
            reports/miniswe-1048-${{ matrix.arm }}/
            reports/openhands-review/issue-1048.patch
          if-no-files-found: warn
      - if: always()
        run: |
          docker rm -f plenum-miniswe-ollama || true
          docker ps -aq --filter label=plenum-miniswe-1048 | xargs -r docker rm -f

name: Verify Real Playwright MCP Read-only Integration
on:
  pull_request:
    paths:
      - 'tools/browser-mcp/**'
      - 'src/plenum_ai/browser_research_graph.py'
      - 'tests/test_browser_research_graph.py'
      - '.github/workflows/browser-mcp-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'tools/browser-mcp/**'
      - '.github/workflows/browser-mcp-readonly.yml'
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  mcp-protocol:
    if: >-
      github.event_name != 'issues' ||
      (github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
       github.event.issue.user.login == 'chadkhalil21-svg' &&
       github.event.issue.title == 'Computer Browser: run official Playwright MCP' &&
       github.event.issue.body == 'RUN_VERIFIED_PUBLIC_MCP:example.com:2026-11-08')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned official Playwright MCP and client SDK
        working-directory: tools/browser-mcp
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Run strict allowlist and action policy tests without browser
        working-directory: tools/browser-mcp
        run: npm run test:policy
      - name: Install isolated official browser
        working-directory: tools/browser-mcp
        run: npx --no-install playwright install --with-deps chromium
      - name: Install the repository's existing LangGraph coordinator
        if: github.event_name != 'issues'
        run: python -m pip install -e '.[orchestration]'
      - name: Test policy-gated browser graph without external requests
        if: github.event_name != 'issues'
        run: python -m unittest discover -s tests -p test_browser_research_graph.py -v
      - name: Exercise actual MCP stdio tools against static public page
        working-directory: tools/browser-mcp
        timeout-minutes: 3
        run: npm run test:live
      - name: Execute actual LangGraph plan to MCP browser to verifier
        if: github.event_name != 'issues'
        run: python -m plenum_ai.browser_research_graph
      - name: Report official MCP live result in the founder's issue
        if: always() && github.event_name == 'issues' && github.event.issue.user.login == 'chadkhalil21-svg'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          if [ "$RESULT" = 'success' ]; then
            gh issue comment "$ISSUE_NUMBER" --body 'PASS: Independent official Microsoft Playwright MCP stdio handshake, public https://example.com/ navigation and accessibility snapshot completed. No TinyFish, account login, site write or model API usage. This proves direct ordinary-chat GitHub -> official MCP execution for a fixed public task, not general private account automation.'
          else
            gh issue comment "$ISSUE_NUMBER" --body 'BLOCKED: Official Playwright MCP live execution failed. See the pinned MCP CI step; no account session or website mutation was authorized.'
          fi

name: Plenum Research | Free Public YouTube Captions
on:
  issues:
    types: [opened]
  pull_request:
    paths:
      - 'src/plenum_ai/youtube_public_caption_worker.py'
      - 'tests/test_youtube_public_caption_worker.py'
      - 'integrations/workforces/six_video_platforms_20261111.json'
      - '.github/workflows/plenum-public-youtube-captions.yml'
permissions:
  contents: read
concurrency:
  group: plenum-public-caption-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false
jobs:
  small-source-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_youtube_public_caption_worker.py' -v
  public-caption-research:
    if: >-
      github.event_name == 'issues' &&
      github.repository == 'chadkhalil21-svg/Plenum-Scientific-Intelligence' &&
      github.event.issue.user.login == 'chadkhalil21-svg' &&
      github.event.issue.title == '[Plenum Research] public video captions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only upstream MIT no-key public captions library
        run: |
          python -m pip install -e .
          python -m pip install youtube-transcript-api==1.2.5
      - name: Confirm original founder and reviewed six public YouTube IDs, then read captions
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTIONS: 'true'
        run: timeout 480 python -m plenum_ai.youtube_public_caption_worker --event "$GITHUB_EVENT_PATH" --execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plenum-video-caption-evidence-${{ github.run_id }}
          path: reports/youtube-research/free-caption-evidence.json
          if-no-files-found: ignore
          retention-days: 7
